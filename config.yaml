# Métadonnées WhoScored par ligue (url / slug / substage éventuel).
# Une ligue listée dans `leagues:` mais ABSENTE d'ici est ignorée au scraping
# (avec un warning explicite). Ajouter une ligue = ajouter son bloc ici, sans code.
whoscored_leagues:
  "Championship":
    url:  "https://www.whoscored.com/regions/252/tournaments/7/england-championship"
    slug: "ENG-Championship"
    default_substage: "Championship"
  "Premier League":
    url:  "https://www.whoscored.com/regions/252/tournaments/2/england-premier-league"
    slug: "ENG-Premier-League"


  "Ligue 1":
    url:  "https://www.whoscored.com/regions/74/tournaments/22/france-ligue-1"
    slug: "FRA-Ligue-1"

  # Pas de Match report en Ligue 2
  # "Ligue 2":
  #   url:  "https://www.whoscored.com/regions/74/tournaments/37/france-ligue-2"
  #   slug: "FRA-Ligue-2"

  "Bundesliga":
    url:  "https://www.whoscored.com/regions/81/tournaments/3/germany-bundesliga"
    slug: "GER-Bundesliga"
  "2. Bundesliga":
    url:  "https://www.whoscored.com/regions/81/tournaments/6/germany-2-bundesliga"
    slug: "GER-2-Bundesliga"

  "Serie A":
    url:  "https://www.whoscored.com/regions/108/tournaments/5/italy-serie-a"
    slug: "ITA-Serie-A"
    default_substage: "Serie A"
  # "Serie B":
  #   url:  "https://www.whoscored.com/regions/108/tournaments/19/italy-serie-b"
  #   slug: "ITA-Serie-B"
  #   default_substage: "Serie B"

  "La Liga":
    url:  "https://www.whoscored.com/regions/206/tournaments/4/spain-laliga"
    slug: "ESP-La-Liga"
  # "La Liga 2":
  #   url:  "https://www.whoscored.com/regions/206/tournaments/63/spain-segunda-divisi%C3%B3n"
  #   slug: "ESP-La-Liga-2"
  #   default_substage: "LaLiga2"

whoscored_season_months:
  - [0, 7, "Jul"]
  - [0, 8, "Aug"]
  - [0, 9, "Sept"]
  - [0, 10, "Oct"]
  - [0, 11, "Nov"]
  - [0, 12, "Dec"]
  - [1, 1, "Jan"]
  - [1, 2, "Feb"]
  - [1, 3, "Mar"]
  - [1, 4, "Apr"]
  - [1, 5, "May"]
  - [1, 6, "Jun"]

# Métadonnées Transfermarkt par ligue (slug / code compétition / tm_slug pour le cache).
# Même principe que whoscored_leagues : une ligue de `leagues:` absente ici est ignorée.
transfermarkt_leagues:
  "Premier League":
    slug: "premier-league"
    code: "GB1"
    tm_slug: "ENG-Premier-League"
  "Ligue 1":
    slug: "ligue-1"
    code: "FR1"
    tm_slug: "FRA-Ligue-1"
  "Bundesliga":
    slug: "bundesliga"
    code: "L1"
    tm_slug: "GER-Bundesliga"
  "Serie A":
    slug: "serie-a"
    code: "IT1"
    tm_slug: "ITA-Serie-A"
  "La Liga":
    slug: "laliga"
    code: "ES1"
    tm_slug: "ESP-La-Liga"
  "Championship":
    slug: "championship"
    code: "GB2"
    tm_slug: "ENG-Championship"
  "2. Bundesliga":
    slug: "2-bundesliga"
    code: "L2"
    tm_slug: "GER-Bundesliga-2"
  # "Ligue 2":
  #   slug: "ligue-2"
  #   code: "FR2"
  #   tm_slug: "FRA-Ligue-2"
  # "Serie B":
  #   slug: "serie-b"
  #   code: "IT2"
  #   tm_slug: "ITA-Serie-B"
  # "La Liga 2":
  #   slug: "laliga2"
  #   code: "ES2"
  #   tm_slug: "ESP-La-Liga-2"

#  Path configuration
paths:
  raw_data: data/raw/
  processed: data/processed/
  features: data/features/
  models: models/
  # db: db/football.duckdb
  # duckdb: db/football.duckdb
  db: db/football_dev.duckdb
  duckdb: db/football_dev.duckdb
  # Archive brute des JSON matchCentreData WhoScored (gzip).
  # Chemin relatif = sous la racine du projet. Pour un disque externe,
  # mets un chemin ABSOLU ici, ex: E:/3etoiles_bronze/whoscored/
  whoscored_raw: data/raw/whoscored/

# ── Spark ──────────────────────────────────────────────────────────────────
# Machine : 15,7 Go RAM / 12 cœurs logiques / disque C: unique.
spark:
  java_home: "C:\\Java\\jdk-21.0.12.1"
  python: ".venv/Scripts/python.exe"    # interpréteur du subprocess Spark
  hadoop_home: "C:/hadoop"        # utilisé seulement si winutils.exe s'y trouve
  driver_memory: "8g"             # laisse ~7 Go à Windows + VS Code + Python
  cores: 6                        # 6 tâches concurrentes ; 6 cœurs pour l'OS
  shuffle_partitions: 64          # à ajuster quand on connaîtra les volumes
  local_dir: "C:/spark-tmp"       # spill Spark — hors OneDrive, hors projet
  log_level: "WARN"
  paths:
    input:  "data/spark_in"
    output: "data/spark_out"
# Compétitions
# competitions:
# - ligue_1
# - ligue_2
# - premier_league
# - championship
# - La 
# - bundesliga
# - serie_a


# Pipeline configuration
pipeline_main:
  # Timezone commune
  timezone: "Europe/Paris"

  # Crons par flux (surchargent les défauts codés)
  cron_daily:  "0 6 * * *"
  cron_weekly: "0 20 * * 5"
  cron_yearly: "0 3 1 7 *"

  # Noms de deployment (optionnels — défauts : pipeline-master-{flow})
  # deployment_name_daily:  "pipeline-master-daily"
  # deployment_name_weekly: "pipeline-master-weekly"
  # deployment_name_yearly: "pipeline-master-yearly"

  retries: 0
  retry_delay_seconds: 60

# Scraping nocturne WhoScored (run_scrapping.py)
# Un flow = scrape_raw (raw-only, sans écriture DuckDB) puis load_archive.
scraping:
  cron: "0 23 * * *"                     # tous les jours à 23h
  timezone: "Europe/Paris"               # sinon le cron serait interprété en UTC
  deployment_name: "scraping-whoscored-nuit"
  max_runtime_min: 500                   # arrêt du scrape après 8h (23h → 7h),
                                         # laisse une marge avant 8h pour le load
  retries: 1
  retry_delay_seconds: 60
  headless: false
  current_season_parameters:
    season: "2026-2027"       # la saison en cours
    min_month: 8              # août par défaut

# ── Agent Gemini ──────────────────────────────────────────────────────────────
agent:
  model: "gemini-3.1-flash-lite-preview"   # ou gemini-1.5-flash selon ta clé
  model_fallback: "gemini-2.0-flash-lite"
  max_turns: 10                # sécurité anti-boucle infinie
  verbose: true                # affiche le raisonnement intermédiaire
  log_file: "logs/agent.log"
  prefect_api: "http://127.0.0.1:4200/api"   # ← ligne 129 du code
  tools_defaults:
    read_logs_n_lines: 100
    get_pipeline_status_n_runs: 10
    read_backtest_n_recent: 100

# Modèle configuration
prediction:
  target: result_1n2
  classes:
  - H
  - D
  - A
  upset_confidence_threshold: 0.55   # seuil P(Away) pour valider un upset
  draw_threshold: 0.28
  value_edge: 0.05

features:
  form_window: 5           # référence inchangée
  form_windows: [3, 5, 10] # nouvelle clé P1
  h2h_window: 10

model:
  default: lightgbm
  test_size: 0.2
  random_state: 42
  cv_folds: 5

mlflow:
  experiment_name: football_1n2
  # Local
  # tracking_uri: mlruns/
  # Remote
  tracking_uri: https://dagshub.com/marcellin.stephane/Football_predictor.mlflow

# Prédiction : sélection des prochains matchs à servir
predict:
  # Snapshot des prochains matchs, écrasé à chaque run de next_matches.py
  next_matches_file: data/next_matches.csv
  # Largeur (jours) du regroupement "une journée" : capte week-end + midweek
  next_matchday_window_days: 7
  # Championnats servis — indépendant de la liste de scraping `leagues:` plus haut
  leagues:
    - "Ligue 1"
    - "Bundesliga"
    - "La Liga"
    - "Serie A"
    - "Premier League"

train:
  use_autoencoder: false
  use_stacking: false
  test_season: 2024-2025
  TRAIN_SEASONS : [
    "2009-2010",
    "2010-2011",
    "2011-2012",
    "2012-2013",
    "2013-2014",
    "2014-2015",
    "2015-2016",
    "2016-2017",
    "2017-2018",
    "2018-2019", 
    "2019-2020",
    "2020-2021", 
    "2021-2022",
  ]
  VAL_SEASONS : ["2022-2023", "2023-2024"]   # deux saisons pour plus de robustesse
  TEST_SEASON : "2024-2025"
  val_split_pct: 0.5
  bottleneck_dim: 32
  bayes_n_iter: 50
  target: result_1n2

backtest:
  BANKROLL_INIT  : 1000.0   # bankroll initiale en unités
  EDGE_MIN       : 0.04     # edge minimum pour parier (prob_model - prob_implied)
  CONFIDENCE_MIN : 0.45     # confiance minimum du modèle
  KELLY_FRACTION : 0.5      # Half Kelly
  MAX_MISE_PCT   : 0.05     # mise max = 5% de la bankroll (protection)
  MIN_MISE       : 1.0      # mise minimale en unités
  BACKTEST_SEASONS_DEFAULT : ["2023-2024", "2024-2025"]

# ── Famille 11 : clusters de style (76/77) + imputation KNN (78) ──────────────
# Paramètres figés par le diagnostic du 16/08 (cf. Concepts_Session_2026-08-16_KNN).
# On modifie un seuil ICI, jamais dans le code.
knn:
  n_clusters: 3            # clusters de style par côté (silhouette/elbow)
  min_apps: 10             # seuil de fiabilité du profil (split-half r≈0.70)
  gk_vertical_max: 0.3     # gv <= seuil → gardien, exclu du clustering
  k_neighbors: 30  # grille Optuna pour K (imputation 78, plus tard)
  # Noms refondus (préfixe de type en tête) — identiques aux colonnes gold.joueur_saison / joueur_zone_saison.
  features:
    offensive:
      - dec_scorer_xg_per90_lag
      - dec_scorer_shots_per90_lag
      - dec_off_xg_per_shot_lag
      - dec_scorer_team_shot_share_lag
      - dec_off_chances_created_per90_lag
      - dec_off_key_passes_per90_lag
      - dec_off_xgchain_per90_lag
      - dec_off_xgbuildup_per90_lag
      - dec_scorer_xgot_overperformance_lag
    defensive:
      - dec_def_aerial_win_rate_lag
      - dec_def_actions_per90_lag
      - dec_def_errors_per90_lag
      - dec_def_threat_conceded_per90_lag
    # Espaces de similarité : chaque cible zonale est imputée sur des coordonnées
  # JOUEUR fiables (jamais sur elle-même) + le cluster du bon côté.
  coordinate_sets:
    finishing: [dec_scorer_xg_per90_lag, dec_scorer_shots_per90_lag, dec_off_xg_per_shot_lag,
                dec_scorer_xgot_overperformance_lag, dec_scorer_team_shot_share_lag]
    creation:  [dec_off_chances_created_per90_lag, dec_off_key_passes_per90_lag,
                dec_off_xgchain_per90_lag, dec_off_xgbuildup_per90_lag]
    defense:   [dec_def_aerial_win_rate_lag, dec_def_actions_per90_lag,
                dec_def_errors_per90_lag, dec_def_threat_conceded_per90_lag]
  zonal_targets:
    - {feature: dec_off_shot_volume_by_zone_lag,         coords: finishing, side: offensive, method: knn}
    - {feature: dec_off_danger_by_zone_lag,              coords: finishing, side: offensive, method: knn}
    - {feature: dec_off_cross_volume_by_zone_lag,        coords: creation,  side: offensive, method: knn}
    - {feature: dec_off_progressive_actions_by_zone_lag, coords: creation,  side: offensive, method: knn}
    - {feature: dec_off_touch_share_by_zone_lag,         coords: creation,  side: offensive, method: knn}
    - {feature: dec_def_duel_win_rate_by_zone_lag,       coords: defense,   side: defensive, method: cluster}
    - {feature: dec_def_actions_by_zone_lag,             coords: defense,   side: defensive, method: knn}

season_format: YYYY-YYYY

venue_mapping:
  Home: Home
  Away: Away
  home: Home
  away: Away
  H: Home
  A: Away

predict:
  ensemble_alpha: 0.5      # poids du dérivé dans le blend
  dixon_coles_rho: -0.08   # correction des petits scores (estimée sur la val)

xgot:
  # "season" : découpage par saisons (bloc train:) — le vrai mode.
  # "random" : découpage aléatoire PAR MATCH 70/15/15 — test de fumée uniquement,
  #            quand la base n'a qu'une saison d'événements WhoScored.
  split: random
  random_seed: 42