      - name: dec_prob_close_over25
        tests: [is_valid_probability]
      - name: dec_prob_close_under25
        tests: [is_valid_probability]

  - name: gold_team_match_elo
    description: >
      Elo et classement AVANT le match, grain (str_match_id, str_team_id). Construit depuis
      machine_learning.elo_team_match (pipelines/features/team_elo.py). Consommé par les marts 1N2.
      Évalué : gain de log-loss +0,0101 (IC95 [+0,0074 ; +0,0130], 7 saisons sur 7) sur la variante E.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [str_match_id, str_team_id]
    columns:
      - name: str_match_id
        tests: [not_null]
      - name: str_team_id
        tests: [not_null]
      - name: dec_elo
        tests: [not_null]
      - name: dec_opp_elo
        tests: [not_null]
      - name: dec_elo_win_exp
        tests: [is_valid_probability]
      - name: dec_s_rank_pct
        tests: [is_valid_probability]

  - name: gold_player_aerial_profile
    description: >
      Profil aérien d'un joueur sur une fenêtre de 3 saisons glissantes (s-2, s-1, s), depuis
      intermediate_aerial_duel_players. Grain (str_player_id, str_season), str_season étant la
      DERNIÈRE saison de la fenêtre : un modèle qui prédit la saison s doit lire s-1 (la fenêtre
      inclut s). Victoire au-dessus de l'attendu (rôle x type de ballon), tirs de la tête, style et
      qualité du geste suivant, xT des passes de la tête. Mesures rétrécies vers la moyenne
      (K = 30 duels, K = 20 passes) : un petit volume reste proche de la moyenne. Stabilité d'une
      saison à l'autre : victoire au-dessus de l'attendu 0,73 ; tirs de la tête 0,66 ; précision,
      progression et xT de la passe de la tête 0,2 (bruit). Corrélation avec la taille : 0,47.
      Colonnes nettes de la taille (dec_woe_net*) : victoire au-dessus d'un attendu qui tient compte
      de l'écart de taille avec l'adversaire. Têtes séparées en coups de pied arrêtés et jeu ouvert.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [str_player_id, str_season]
    columns:
      - name: str_player_id
        tests: [not_null]
      - name: str_season
        description: "Dernière saison de la fenêtre de 3 saisons."
        tests: [not_null]
      - name: int_n_seasons_window
        description: "Nombre de saisons de la fenêtre où le joueur a des duels (1 à 3)."
      - name: int_n_duels
        description: "Duels aériens sur la fenêtre. Profil fiable à partir de 80 duels."
        tests: [not_null]
      - name: dec_win_rate
        description: "Taux de victoire brut, sans correction du rôle ni du type de ballon."
        tests: [is_valid_probability]
      - name: dec_woe
        description: "Victoire au-dessus de l'attendu, tous rôles, rétrécie (K = 30)."
        tests:
          - dbt_utils.accepted_range:
              min_value: -0.6
              max_value: 0.6
      - name: dec_woe_off
        description: "Victoire au-dessus de l'attendu en rôle offensif, rétrécie (K = 30)."
        tests:
          - dbt_utils.accepted_range:
              min_value: -0.6
              max_value: 0.6
      - name: dec_woe_def
        description: "Victoire au-dessus de l'attendu en rôle défensif, rétrécie (K = 30)."
        tests:
          - dbt_utils.accepted_range:
              min_value: -0.6
              max_value: 0.6
      - name: dec_woe_net
        description: >
          Victoire au-dessus de l'attendu NET DE LA TAILLE, tous rôles, rétrécie (K = 30). L'attendu
          dépend du rôle, du groupe de ballon et de l'écart de taille avec l'adversaire (tranches de
          4 cm). Taille manquante : tranche à part.
        tests:
          - dbt_utils.accepted_range:
              min_value: -0.6
              max_value: 0.6
      - name: dec_woe_net_off
        description: "Victoire au-dessus de l'attendu net de la taille, rôle offensif, rétrécie (K = 30)."
        tests:
          - dbt_utils.accepted_range:
              min_value: -0.6
              max_value: 0.6
      - name: dec_woe_net_def
        description: "Victoire au-dessus de l'attendu net de la taille, rôle défensif, rétrécie (K = 30)."
        tests:
          - dbt_utils.accepted_range:
              min_value: -0.6
              max_value: 0.6
      - name: dec_height_diff_mean
        description: "Écart de taille moyen (cm) entre le joueur et ses adversaires de duel. Manquant si aucune taille n'est connue."
      - name: dec_head_shots_setpiece_per_match
        description: "Tirs de la tête sur corner ou coup franc (qualifiers 24 et 25) par match joué."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 5
      - name: dec_head_shots_open_per_match
        description: "Tirs de la tête hors coup de pied arrêté par match joué."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 5
      - name: dec_share_off
        description: "Part des duels disputés en rôle offensif (style : attaquant ou défenseur dans les airs)."
        tests: [is_valid_probability]
      - name: dec_head_shot_rate
        description: >
          Tirs de la tête par duel aérien offensif, rétréci (K = 30). Les têtes sans duel comptent :
          le taux n'est pas borné par 1.
      - name: dec_follow_pass_accuracy
        description: "Réussite de la passe de la tête du gagnant, rétrécie (K = 20) : à ces volumes, surtout du bruit."
        tests: [is_valid_probability]
      - name: dec_follow_xt_per_pass
        description: "xT moyen ajouté par la passe de la tête du gagnant, rétréci (K = 20) : à ces volumes, surtout du bruit."
      - name: dec_shot_after_win_off
        description: "Part des victoires offensives suivies d'un tir de l'équipe dans les 10 s (brut)."

  - name: gold_team_match_aerial_lineup
    description: >
      Profil aérien de la composition de départ (titulaires à la minute 0), grain (str_match_id,
      str_team_id). Sans fuite : compétences lues sur la dernière ligne de gold_player_aerial_profile
      dont la saison de fin est s-1 ou s-2 (la fenêtre de 3 saisons n'inclut jamais la saison du match).
      Un joueur sans profil est compté dans int_n_starters mais pas dans int_n_profiled : lire
      int_n_profiled avant d'interpréter les sommes. Tailles : valeur courante de la fiche WhoScored.
      Poste : poste macro habituel. Écarts dec_edge_* : positif = avantage de l'équipe. Dépend de la
      composition, connue environ une heure avant le coup d'envoi. Mesure du 09/11/2026 (hors
      échantillon, 2022-23 à 2025-26) : les cinq écarts expliquent 4,9 % de la variance de la part de
      duels aériens gagnés dans le match (3,7 % pour l'ancienne colonne de taux de victoire, 5,9 % les
      deux ensemble ; plafond d'environ 22 % à cause du hasard sur 36 duels par équipe).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [str_match_id, str_team_id]
    columns:
      - name: str_match_id
        tests: [not_null]
      - name: str_team_id
        tests: [not_null]
      - name: int_n_starters
        description: "Titulaires de la composition (11 attendus ; 84 cas à 10 ou plus de 11 sur 67 692, dont un à 22)."
        tests:
          - dbt_utils.accepted_range:
              min_value: 9
              max_value: 14
              config:
                severity: warn
      - name: int_n_profiled
        description: "Titulaires ayant un profil aérien en s-1 ou s-2."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 14
      - name: dec_xi_height_mean
        description: "Taille moyenne (cm) des joueurs de champ titulaires."
      - name: dec_xi_height_top3
        description: "Taille moyenne (cm) des trois plus grands joueurs de champ."
      - name: dec_xi_height_def
        description: "Taille moyenne (cm) des défenseurs titulaires (poste habituel)."
      - name: dec_xi_height_att
        description: "Taille moyenne (cm) des attaquants titulaires (poste habituel)."
      - name: dec_xi_woe_net_def_def
        description: "Moyenne de la compétence aérienne défensive nette de la taille des défenseurs titulaires."
      - name: dec_xi_woe_net_off_att
        description: "Moyenne de la compétence aérienne offensive nette de la taille des attaquants titulaires."
      - name: dec_xi_woe_net_mean
        description: "Moyenne de la compétence aérienne nette de la taille des joueurs de champ titulaires."
      - name: dec_xi_duels_per_match_sum
        description: "Somme des duels aériens par match des joueurs de champ titulaires profilés (présence aérienne attendue)."
      - name: dec_xi_head_shots_setpiece_sum
        description: "Somme des tirs de la tête par match sur coup de pied arrêté des titulaires profilés (menace sur CPA)."
      - name: dec_xi_head_shots_open_sum
        description: "Somme des tirs de la tête par match en jeu ouvert des titulaires profilés."
      - name: dec_edge_height_mean
        description: "Taille moyenne des joueurs de champ moins celle de l'adversaire (cm)."
      - name: dec_edge_att_height
        description: "Taille moyenne des attaquants moins celle des défenseurs adverses (cm)."
      - name: dec_edge_att_skill
        description: "Compétence offensive nette des attaquants moins compétence défensive nette des défenseurs adverses."
      - name: dec_edge_def_height
        description: "Taille moyenne des défenseurs moins celle des attaquants adverses (cm)."
      - name: dec_edge_def_skill
        description: "Compétence défensive nette des défenseurs moins compétence offensive nette des attaquants adverses."

  - name: gold_keeper_aerial_profile
    description: >
      Jeu aérien du gardien sur une fenêtre de 3 saisons glissantes (s-2, s-1, s), grain (str_player_id,
      str_season) avec str_season = DERNIÈRE saison de la fenêtre : pour prédire la saison s, lire s-1.
      Captés, boxés et sorties hors surface par match (événements Claim, Punch, KeeperSweeper). Décrit un
      STYLE (volume, capter ou boxer, sortir) et non un taux de réussite : le nombre de centres subis est
      inconnu et dépend de l'équipe. Stabilité sur profils s et s+3 : 0,30 à 0,37. Complète
      gold_keeper_season_lag (arrêts).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [str_player_id, str_season]
    columns:
      - name: str_player_id
        tests: [not_null]
      - name: str_season
        tests: [not_null]
      - name: int_n_matches
        description: "Matchs joués en tant que gardien sur la fenêtre."
        tests: [not_null]
      - name: dec_aerial_actions_per_match
        description: "Ballons captés et boxés par match."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 6
      - name: dec_claim_share
        description: "Part de ballons captés parmi captés + boxés, rétrécie vers la moyenne (K = 20 actions)."
        tests: [is_valid_probability]
      - name: dec_sweeper_per_match
        description: "Sorties hors surface par match."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 6

  - name: gold_player_ground_profile
    description: >
      Profil « duels au sol » d'un joueur (dribbles, tacles, dépossessions, fautes) sur une fenêtre
      de 3 saisons glissantes (s-2, s-1, s), depuis intermediate_ground_duel_players. Grain
      (str_player_id, str_season), str_season étant la DERNIÈRE saison de la fenêtre : un modèle
      qui prédit la saison s doit lire s-1 (la fenêtre inclut s). Volumes et taux bruts, taux au-dessus
      de l'attendu (même saison, famille, rôle, zone 5x5) rétrécis vers 0 (K = 30), ajustement par
      l'adversaire pour les dribbles, danger à 10 s net du contexte, xT après duel gagné, fautes,
      cartons et penaltys. Stabilité entre fenêtres sans recouvrement (s et s+3, mesurée le
      10/11/2026) : dribbleur 0,58 (brut 0,60, ajusté par l'adversaire 0,55), défenseur face aux
      dribbles 0,68, dépossessions 0,75, fautes commises 0,73 et subies 0,83, jaunes par faute 0,54 ;
      tacle sur dépossession 0,14 et danger net 0,09 à 0,16 (bruit). La correction par zone
      n'améliore pas la stabilité. Seuls les dribbles appariés à un défenseur comptent.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [str_player_id, str_season]
    columns:
      - name: str_player_id
        tests: [not_null]
      - name: str_season
        description: "Dernière saison de la fenêtre de 3 saisons."
        tests: [not_null]
      - name: int_n_seasons_window
        description: "Nombre de saisons de la fenêtre où le joueur a des duels au sol (1 à 3)."
      - name: int_n_ground_duels
        description: "Duels au sol du joueur sur la fenêtre, toutes familles."
        tests: [not_null]
      - name: int_n_dribbles
        description: "Dribbles appariés tentés sur la fenêtre. Profil fiable à partir de 100."
      - name: dec_dribble_win_rate
        description: "Taux de dribbles réussis parmi les appariés, brut (biaisé à la hausse : les ratés sans défenseur identifié sont absents)."
        tests: [is_valid_probability]
      - name: dec_dribble_woe
        description: "Réussite du dribbleur au-dessus de l'attendu de la zone, rétrécie (K = 30)."
        tests:
          - dbt_utils.accepted_range:
              min_value: -0.6
              max_value: 0.6
      - name: dec_dribble_woe_adj
        description: "Idem, après décalage de l'attendu par la force du défenseur affronté (un tour, sans le duel lui-même)."
        tests:
          - dbt_utils.accepted_range:
              min_value: -0.6
              max_value: 0.6
      - name: dec_defended_woe
        description: "Dribbles stoppés au-dessus de l'attendu de la zone, rétrécis (K = 30)."
        tests:
          - dbt_utils.accepted_range:
              min_value: -0.6
              max_value: 0.6
      - name: dec_defended_woe_adj
        description: "Idem, après décalage par la force du dribbleur affronté."
        tests:
          - dbt_utils.accepted_range:
              min_value: -0.6
              max_value: 0.6
      - name: dec_dribble_danger_net
        description: "Écart de tirs (propres moins adverses) dans les 10 s, net de la moyenne du contexte, rétréci (K = 30). Faible stabilité (0,16)."
      - name: dec_dribble_xt_after_win
        description: "xT du geste suivant (passe ou conduite) du dribbleur après un dribble réussi, rétréci (K = 30 gestes)."
      - name: dec_dispossessed_share
        description: "Part de dépossessions parmi les dribbles et dépossessions, rétrécie (K = 30)."
        tests: [is_valid_probability]
      - name: dec_foul_committed_share
        description: "Fautes commises rapportées aux duels défensifs au sol et fautes, rétrécies (K = 40)."
        tests: [is_valid_probability]
      - name: dec_foul_drawn_share
        description: "Fautes subies rapportées aux duels offensifs au sol et fautes, rétrécies (K = 40)."
        tests: [is_valid_probability]
      - name: dec_yellow_per_foul
        description: "Part des fautes commises suivies d'un jaune dans les 120 s, rétrécie (K = 20)."
        tests: [is_valid_probability]
      - name: int_n_penalties_conceded
        description: "Penaltys concédés (fautes de l'auteur menant à un penalty) sur la fenêtre."
      - name: int_n_penalties_drawn
        description: "Penaltys obtenus sur la fenêtre."

  - name: gold_referee_profile
    description: >
      Profil d'un arbitre sur une fenêtre de 3 saisons glissantes (s-2, s-1, s). Grain
      (str_referee_id, str_season), str_season étant la DERNIÈRE saison de la fenêtre : un modèle qui
      prédit la saison s doit lire s-1. Jaunes, rouges, fautes et penaltys par match, bruts et nets
      de la moyenne de la ligue et de la saison, rétrécis (K = 10 matchs) ; avantage du domicile en
      buts et en jaunes. Stabilité entre fenêtres sans recouvrement (au moins 30 matchs, mesurée le
      10/11/2026) : jaunes 0,50, fautes 0,50, écart de jaunes domicile moins extérieur 0,49 (peut
      refléter les désignations selon l'affiche) ; rouges 0,10, penaltys 0,05, avantage du domicile
      en buts -0,06 (bruit). L'arbitre d'un match est connu à l'avance, mais la source actuelle est
      scrapée après le match.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [str_referee_id, str_season]
    columns:
      - name: str_referee_id
        tests: [not_null]
      - name: str_season
        description: "Dernière saison de la fenêtre de 3 saisons."
        tests: [not_null]
      - name: int_n_matches
        description: "Matchs dirigés sur la fenêtre. Profil fiable à partir de 30."
        tests: [not_null]
      - name: dec_yellow_per_match
        description: "Jaunes par match, brut."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 12
      - name: dec_fouls_per_match
        description: "Fautes par match, brutes (duels appariés)."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 60
      - name: dec_penalties_per_match
        description: "Penaltys par match, bruts."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 3
      - name: dec_yellow_net
        description: "Jaunes par match au-dessus de la moyenne de la ligue-saison, rétrécis (K = 10)."
      - name: dec_fouls_net
        description: "Fautes par match au-dessus de la moyenne de la ligue-saison, rétrécies (K = 10)."
      - name: dec_home_goal_diff_net
        description: "Écart de buts domicile moins extérieur net de la ligue-saison, rétréci (K = 10). Non stable d'une fenêtre à l'autre."
