      - name: freekick_header_goal_share_against_3
        description: "Part des buts sur coup franc concédé marqués de la tête, sur 3 matchs"
      - name: freekick_forced_bad_clearance_rate_for_3
        description: "Part des dégagements adverses mal exécutés face à nos coups francs centrés, sur 3 matchs"
      - name: freekick_clearance_fail_rate_against_3
        description: "Part de nos propres dégagements mal exécutés face aux coups francs centrés concédés, sur 3 matchs"
      - name: freekick_headed_clearance_rate_against_3
        description: "Part de nos dégagements défensifs de la tête sur coup franc centré concédé, sur 3 matchs"
      - name: freekick_direct_distance_avg_for_3
        description: "Distance moyenne (m) des coups francs directs obtenus, sur 3 matchs"
      - name: freekick_direct_distance_avg_against_3
        description: "Distance moyenne (m) des coups francs directs concédés, sur 3 matchs — discipline défensive"
      - name: freekick_direct_angle_avg_for_3
        description: "Angle moyen (rad) vers le but des coups francs directs obtenus, sur 3 matchs"
