  - name: off_central_touch
    description: Présence centrale = Σ off_touch_share_by_zone_lag des titulaires en z3-z4, c3. Composante
      brute exposée pour la feature 55 (ligne axe).
  - name: def_central_density
    description: Densité défensive centrale = Σ def_actions_by_zone_lag des titulaires en z1-z3, c3. Solidité
      de B dans l''axe, brique de matchup_central_control (feature 55).
