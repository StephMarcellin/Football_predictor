# Documentation + tests dbt des tables Gold (spec CDC).
# Généré pour la couche gold-features. Chaque feature est décrite ; tests : unicité de clé,
# not_null sur les clés, accepted_range [0,1] sur les taux.

version: 2
models:
- name: equipe_match
  description: 'Grain (match_id, team_id). Familles CDC 1 (pré-match), 2 (forme), 3 (style), 8 (partie
    native backbone). Familles 4 et 8-agrégée ajoutées ultérieurement. Anti-leakage : fenêtres ROWS BETWEEN
    w PRECEDING AND 1 PRECEDING (match courant exclu).'
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - match_id
      - team_id
  columns:
  - name: match_id
    description: Identifiant unifié du match (SHA1).
    tests:
    - not_null:
        config:
          severity: warn
  - name: team_id
    description: Id canonique de l'équipe (perspective de la ligne).
    tests:
    - not_null
  - name: opponent_id
    description: Id canonique de l'adversaire.
  - name: date
    description: Date du match.
  - name: season
    description: Saison (ex. 2023-2024). Usage technique (split temporel), pas prédicteur direct.
  - name: league_source
    description: Championnat / compétition source.
  - name: venue
    description: 'Lieu du match : Home / Away / Neutral.'
  - name: comp_category
    description: '[Famille 1] Catégorie de compétition (Big5 / Cup / Europe) — proxy d''enjeu. PRE-MATCH
      CONNU.'
  - name: is_home
    description: '[Famille 1] 1 si l''équipe joue à domicile. PRE-MATCH CONNU.'
  - name: days_since_last_game
    description: '[Famille 1] Jours de repos depuis le dernier match officiel (tous matchs, ordre chronologique).
      PRE-MATCH CONNU, aucun leakage.'
  - name: avg_gf_rolling_3
    description: '[Famille 2, ROLLING(3)] Moyenne de buts marqués sur les 3 derniers matchs strictement
