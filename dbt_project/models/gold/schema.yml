    description: '[Famille 4] Taux de duels aériens gagnés moyen des titulaires.'
  - name: n_starters_profiled
    description: Nombre de titulaires (sur 11) ayant un profil joueur_saison (confiance).
- name: joueur_match
  description: 'Grain (match_id, team_id, player_id) — 7e table de grain, assemblage du modèle Buteurs
    (une ligne = un titulaire dans un match). Réunit les features scorer SEASON-LAG (joueur_saison) et
    la feature propre 75 (scorer_context_vs_opponent_style : croisement tirs du joueur × vulnérabilité
    adverse par couloir miroir). Candidats = XI de départ.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - match_id
      - team_id
      - player_id
  columns:
  - name: match_id
    description: Identifiant unifié du match.
    tests:
    - not_null
  - name: team_id
    description: Équipe du joueur.
    tests:
    - not_null
  - name: opponent_id
    description: Adversaire.
  - name: player_id
    description: Joueur (titulaire).
    tests:
    - not_null
  - name: is_home
    description: 1 si le joueur joue à domicile.
  - name: scorer_xg_per90_lag
    description: '[Famille 10] xG/90 du joueur (saison N-1) — repris de joueur_saison.'
  - name: scorer_shots_per90_lag
    description: '[Famille 10] Tirs/90 du joueur.'
  - name: scorer_team_shot_share_lag
    description: '[Famille 10] Part des tirs de l''équipe prise par le joueur.'
  - name: scorer_penalty_taker_lag
    description: '[Famille 10] Penaltys tirés sur la fenêtre (rôle de tireur).'
  - name: scorer_freekick_taker_lag
    description: '[Famille 10] Coups francs tirés sur la fenêtre.'
  - name: off_xg_per_shot_lag
    description: '[Famille 5/10] Qualité de tir (xG/tir).'
  - name: scorer_context_vs_opponent_style
    description: '[Famille 10, feature 75] Σ sur les couloirs [ tirs du joueur × (1 − solidité défensive
      de l''adversaire, couloir miroir) ]. Danger attendu du joueur face à CET adversaire. NULL/partiel
      si solidité adverse inconnue → imputation famille 11.'
    tests:
    - dbt_expectations.expect_column_values_to_be_between:
        min_value: 0
        max_value: 20
        row_condition: scorer_context_vs_opponent_style is not null
        config:
          severity: warn
- name: equipe_gardien_match
  description: 'Grain (match_id, team_id). Famille CDC 9 : rattache le profil SEASON-LAG du gardien
    titulaire à son équipe pour le match. Identification via int_whoscored_player_match (position=''GK''
    et is_first_eleven, tie-break player_id min si plusieurs GK marqués titulaires). Jointure gardien_saison
    sur (keeper_id, season). Pur rattachement au grain équipe : aucune feature nouvelle, tout vient
    de gardien_saison. NB : profile_confidence_flag de gardien_saison NON repris → perte du signal de
    fiabilité du profil. NULL si compo inconnue ou pas de saison N-1 (recrue) → imputation famille 11.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - match_id
      - team_id
  columns:
  - name: match_id
    description: Identifiant unifié du match (SHA1).
    tests:
    - not_null:
        config:
          severity: warn
  - name: team_id
    description: Id canonique de l'équipe (perspective de la ligne).
    tests:
    - not_null
  - name: keeper_psxg_plus_minus_lag
    description: '[Famille 9, SEASON-LAG, feature 64] Post-Shot xG +/- de la saison précédente (total :
      PSxG affronté − buts encaissés ; positif = arrête plus que la qualité des tirs ne le prédit).
      Repris de gardien_saison.'
  - name: keeper_psxg_per_shot_lag
    description: '[Famille 9, SEASON-LAG] PSxG +/- normalisé par tir affronté (comparable entre gardiens
      de volumes différents). Repris de gardien_saison.'
  - name: keeper_save_pct_lag
    description: '[Famille 9, SEASON-LAG, feature 65] Pourcentage d''arrêts de la saison précédente
      (saves / shots_faced, recalculé). Repris de gardien_saison.'
    tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 1
        config:
          severity: warn
  - name: keeper_shots_faced_lag
    description: '[Famille 9, SEASON-LAG, feature 66] Tirs affrontés la saison précédente. Sert de signal
      de confiance : un faible volume rend le PSxG bruité (seuil de bascule = calibration famille 11).
      Repris de gardien_saison.'
- name: equipe_confrontation_zone
  description: 'Grain (match_id, team_id). Pivote zone_confrontation_match (grain couloir A→B, 6 lignes
    par match) vers grain (match, équipe) : chaque ligne porte les DEUX perspectives dans un même enregistrement.
    off_* = quand cette équipe attaque (elle est A dans le sens A→B) ; def_* = quand cette équipe défend
    (elle est B, l''adversaire est A). Convention miroir : def_danger_gauche = danger créé par l''adversaire
    quand il attaque par SON couloir gauche = notre exposition défensive côté droit (les équipes se font
    face). Consommé directement par mart_1n2.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - match_id
      - team_id
  columns:
  - name: match_id
    description: Identifiant unifié du match.
    tests:
    - not_null
    - relationships:
        to: source('intermediate', 'match_registry')
        field: match_id
  - name: team_id
    description: Équipe (perspective de la ligne).
    tests:
    - not_null
    - relationships:
        to: ref('team_mapping')
        field: team_id
  - name: off_danger_gauche
    description: '[Famille 7, feature 52] Danger du couloir gauche en attaque = off_strength(A) × (1 −
      def_solidity(B miroir)). Repris de zone_confrontation_match.matchup_danger_by_corridor. NULL si
      solidité adverse inconnue → imputation famille 11.'
  - name: off_danger_axe
    description: '[Famille 7, feature 52] Danger de l''axe en attaque. Repris de zone_confrontation_match.matchup_danger_by_corridor.'
  - name: off_danger_droit
    description: '[Famille 7, feature 52] Danger du couloir droit en attaque. Repris de zone_confrontation_match.matchup_danger_by_corridor.'
  - name: off_cross_gauche
    description: '[Famille 7, feature 53] Menace de centre côté gauche en attaque = off_cross_strength(A)
      × (1 − def_solidity(B miroir)). Repris de zone_confrontation_match.matchup_cross_threat. VERSION
      RÉDUITE : composante aérienne du CDC (famille 6) non incluse.'
  - name: off_cross_droit
    description: '[Famille 7, feature 53] Menace de centre côté droit en attaque. Repris de zone_confrontation_match.matchup_cross_threat.
      Pas de colonne axe (centres = flancs par définition).'
  - name: off_dribble_gauche
    description: '[Famille 7, feature 54] Menace de percée côté gauche en attaque = off_dribble_strength(A)
      × (1 − def_solidity(B miroir)). Repris de zone_confrontation_match.matchup_dribble_threat.'
  - name: off_dribble_droit
    description: '[Famille 7, feature 54] Menace de percée côté droit en attaque. Repris de zone_confrontation_match.matchup_dribble_threat.
      Pas de colonne axe.'
  - name: off_central_axe
    description: '[Famille 7, feature 55] Contrôle de l''axe en attaque = off_central_progression(A) /
      def_central_density(B), ligne axe uniquement. >1 → A progresse dans l''axe plus que B n''y défend.
      SENS À VALIDER empiriquement. Repris de zone_confrontation_match.matchup_central_control.'
  - name: def_danger_gauche
    description: '[Famille 7, feature 52] Danger subi quand l''adversaire attaque par SON couloir gauche
      (= notre couloir droit en miroir). Repris de zone_confrontation_match.matchup_danger_by_corridor
      côté défenseur.'
  - name: def_danger_axe
    description: '[Famille 7, feature 52] Danger de l''axe subi (adversaire attaquant dans l''axe). Repris
      de zone_confrontation_match.matchup_danger_by_corridor côté défenseur.'
  - name: def_danger_droit
    description: '[Famille 7, feature 52] Danger subi quand l''adversaire attaque par SON couloir droit
      (= notre couloir gauche en miroir). Repris de zone_confrontation_match.matchup_danger_by_corridor
      côté défenseur.'
  - name: def_cross_gauche
    description: '[Famille 7, feature 53] Menace de centre subie côté gauche adverse (= notre exposition
      côté droit en miroir). Repris de zone_confrontation_match.matchup_cross_threat côté défenseur.
      VERSION RÉDUITE.'
  - name: def_cross_droit
    description: '[Famille 7, feature 53] Menace de centre subie côté droit adverse. Repris de zone_confrontation_match.matchup_cross_threat
      côté défenseur.'
  - name: def_dribble_gauche
    description: '[Famille 7, feature 54] Menace de percée subie côté gauche adverse. Repris de zone_confrontation_match.matchup_dribble_threat
      côté défenseur.'
  - name: def_dribble_droit
    description: '[Famille 7, feature 54] Menace de percée subie côté droit adverse. Repris de zone_confrontation_match.matchup_dribble_threat
      côté défenseur.'
  - name: def_central_axe
    description: '[Famille 7, feature 55] Contrôle de l''axe subi (adversaire progressant dans l''axe /
      notre densité défensive centrale). SENS À VALIDER. Repris de zone_confrontation_match.matchup_central_control
      côté défenseur.'
