        description: "Part des coups francs concédés joués en tir direct par l'adversaire, sur 3 matchs"
      - name: freekick_zone_crossed_rate_for_3
        description: "Part des coups francs obtenus centrés dans la surface, sur 3 matchs"
      - name: freekick_zone_crossed_rate_against_3
        description: "Part des coups francs concédés centrés dans la surface par l'adversaire, sur 3 matchs"
      - name: freekicks_for_5
