- name: joueur_saison
  description: 'Grain (match_id, team_id, player_id) — snapshot as-of-date. Familles CDC 4 (source des
    agrégats du onze), 5/6 NON-zonales, 8 (carton), 10 (Buteurs). PASSE 1 : source player_match_stats
    seule ; passe 2 à venir (xgchain, penalties, coups francs, xGOT, part des tirs). Profil = 38 dernières
    apparitions strictement antérieures du joueur (fenêtre ROWS 38 PRECEDING AND 1 PRECEDING, match courant
    exclu). Volumes normalisés PER-90 (Σ stat / Σ minutes × 90) ; ratios exacts. Passe 1 (player_match_stats)
    + passe 2 (xgChain/xgBuildup, part des tirs, rôles penalty/coup franc). Reste : scorer_xgot_overperformance
    (feature 70).'
  tests:
  - dbt_utils.unique_combination_of_columns:
      combination_of_columns:
      - match_id
      - team_id
      - player_id
  columns:
  - name: match_id
    description: Identifiant unifié du match (SHA1).
    tests:
    - not_null:
        config:
          severity: warn
  - name: team_id
    description: Id canonique de l'équipe du joueur pour ce match.
    tests:
    - not_null
  - name: player_id
    description: Identifiant du joueur.
    tests:
    - not_null
  - name: date
    description: Date du match courant (le profil porté est celui d'avant ce match).
  - name: season
    description: Saison du match courant.
  - name: n_apps_lag
    description: Nombre d'apparitions du joueur dans la fenêtre (0 à 38). Signal de confiance ; 0 = première
      apparition (profil NULL) → imputation famille 11.
  - name: minutes_lag
    description: Minutes cumulées du joueur sur la fenêtre. Dénominateur du per-90 et signal de fiabilité
      (faible volume = profil bruité).
  - name: scorer_xg_per90_lag
    description: '[Famille 10, feature 69] xG (contribution) par 90 minutes = Σ xG / Σ minutes × 90.'
  - name: scorer_shots_per90_lag
    description: '[Famille 10, feature 68] Tirs par 90 minutes.'
  - name: off_xg_per_shot_lag
    description: '[Famille 5/10, feature 42] Qualité de tir = Σ xG / Σ tirs sur la fenêtre (ratio exact,
      indépendant des minutes).'
  - name: off_chances_created_per90_lag
    description: '[Famille 5] Occasions créées par 90 minutes.'
  - name: off_key_passes_per90_lag
    description: '[Famille 5] Passes clés par 90 minutes.'
  - name: def_aerial_win_rate_lag
    description: '[Famille 6, feature 50] Taux de duels aériens gagnés = Σ gagnés / Σ duels (ratio exact).'
    tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 1
        config:
          severity: warn
  - name: def_actions_per90_lag
    description: '[Famille 6] Actions défensives (tacles + interceptions) par 90 minutes — volume non-zonal.'
  - name: def_errors_per90_lag
    description: '[Famille 6, feature 49] Erreurs menant à un tir/but, par 90 minutes.'
  - name: player_card_propensity_lag
    description: '[Famille 8, feature 60] Cartons jaunes (2es jaunes inclus) par 90 minutes.'
  - name: off_xgchain_per90_lag
    description: '[Famille 5, feature 39] xgChain par 90 min — xG cumulé des possessions où le joueur est
      impliqué (Σ xgChain / Σ minutes × 90).'
  - name: off_xgbuildup_per90_lag
    description: '[Famille 5, feature 40] xgBuildup par 90 min — comme xgChain mais hors tir et passe clé
      (implication dans la construction pure).'
  - name: scorer_team_shot_share_lag
    description: '[Famille 10, feature 71] Part des tirs de l''équipe pris par le joueur = Σ tirs joueur
      / Σ tirs équipe sur la fenêtre. Point focal offensif.'
    tests:
    - dbt_utils.accepted_range:
        min_value: 0
        max_value: 1
        config:
          severity: warn
  - name: scorer_penalty_taker_lag
    description: '[Famille 10, feature 73] Nombre de penaltys tirés par le joueur sur la fenêtre. Fort
      signal P(marque) : un tireur attitré convertit ~0,76 xG par penalty.'
  - name: scorer_freekick_taker_lag
    description: '[Famille 10, feature 74] Nombre de coups francs tirés par le joueur sur la fenêtre (rôle
      de tireur sur CPA). À affiner en coups francs directs quand fk_type sera exploité.'
  - name: def_threat_conceded_per90_lag
    description: '[Famille 6, feature 48] Menace concédée par 90 min quand le joueur est impliqué dans
      la chaîne défensive (fragilité). Non-zonale (threat_conceded sans coordonnées).'
  - name: scorer_xgot_overperformance_lag
    description: '[Famille 10, feature 70] Surperformance à la finition = (Σ buts − Σ xGOT) / Σ xGOT sur
      la fenêtre. Positif = finisseur clinique. NULL si aucun tir cadré. Source xGOT = table externe (pipeline Python).'
  - name: profile_confidence_flag
    description: '[Famille 11, feature 79] Fiabilité du profil : high (n_apps_lag≥20) / medium (≥5) / low
      (≥1) / none (première apparition). Seuils par défaut, à calibrer.'
    tests:
    - accepted_values:
        arguments:
          values: ['high', 'medium', 'low', 'none']
