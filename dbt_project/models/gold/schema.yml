  description: 'Grain (match_id, attacking_team_id, attack_corridor) — famille CDC 7. Croise la menace
    offensive de A et la vulnérabilité défensive de B PAR COULOIR, en MIROIR (A-gauche ↔ B-droite, car
    les équipes se font face). 6 lignes par match (2 sens × 3 couloirs). Calculable une fois les compos
    connues.'
