      - name: str_shot_body_part
        description: "Partie du corps du tir résultant (head / right_foot / left_foot / other, via qualifiers 15/20/72/21) — renseigné pour les coups francs centrés ('crossed')."
      - name: str_clearance_player_id
        description: "Identifiant du défenseur qui dégage (type 12), pour les coups francs centrés (NULL sinon)."
      - name: str_clearance_quality
        description: "Qualité du dégagement : 'perfect' (l'équipe qui dégage récupère), 'failed' (récupération adverse haut, recovery_x>=83), 'poor' (>=75), 'good' (sinon). NULL si pas de dégagement."
      - name: bool_is_headed_clearance
        description: "Booléen : dégagement de la tête (qual 15) plutôt qu'autre (qual 21)."
      - name: dec_x_m
        description: "Position X convertie en mètres = x * 1.05 (longueur terrain 105 m)."
      - name: dec_y_m
        description: "Position Y convertie en mètres = y * 0.68 (largeur terrain 68 m)."
      - name: dec_distance_to_goal
        description: "Distance en mètres du point du coup franc au centre du but adverse (105, 34)."
      - name: dec_angle
        description: "Angle d'ouverture du but vu depuis le point du coup franc, en radians (loi des cosinus avec les poteaux à y=30.34 et 37.66 m)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - int_row_num

  # ════════════════════════════════════════════════════════════════════════════
  # COUCHE int_* — rematchage silver → clés unifiées
  # Chaque table lit une source silver.*, remplace les noms d'équipes bruts par
  # team_id normalisé (team_mapping) et rattache le match_id unifié
  # (match_registry). Matérialisées en table.
  # ════════════════════════════════════════════════════════════════════════════

  - name: int_fbref_keeper
    description: >
      Stats gardien FBref (tirs cadrés subis, arrêts, save%) rematchées sur match_id unifié
      et team_id normalisé. Colonnes numériques castées et corrigées depuis le VARCHAR brut :
      identité sota = ga_keeper + saves appliquée quand une seule des trois manque, saves = 0
      par convention quand absent, NULL uniquement quand les trois manquent ensemble (~0.4%).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - str_team_id
      - dbt_utils.expression_is_true:
          expression: (int_ga_keeper IS NULL) OR (int_sota IS NULL) OR (int_ga_keeper <= int_sota)
          config:
            severity: error
      - dbt_utils.expression_is_true:
          expression: int_pk_allowed + int_pk_saved + int_pk_missed <= int_pk_att
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          expression: (int_ga_keeper IS NULL) OR (int_cs = CASE WHEN int_ga_keeper = 0 THEN 1 ELSE 0 END)
          config:
            severity: error
      - dbt_utils.expression_is_true:
          expression: >
            (str_result = 'W' AND int_gf > int_ga) OR
            (str_result = 'D' AND int_gf = int_ga) OR
            (str_result = 'L' AND int_gf < int_ga)
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          expression: int_gf <= 12
          config:
            severity: warn
      - dbt_utils.expression_is_true:
          expression: int_ga <= 12
          config:
            severity: warn
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1), rattaché via match_registry."
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('intermediate', 'match_registry')
                field: match_id
      - name: str_team_id
        description: "Id de l'équipe (converti depuis le nom de club FBref via team_mapping)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('referentiel', 'team_mapping')
                field: team_id
      - name: str_opponent_id
        description: "Id de l'équipe adverse (via team_mapping). Vérifié 0 % NULL sur la donnée actuelle (team_mapping résout 100 % des équipes/adversaires) — plus de tolérance NULL nécessaire."
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('referentiel', 'team_mapping')
                field: team_id
      - name: dt_date
        description: Date du match
        tests:
          - not_null
      - name: str_time
        description: >
          Heure du match, brute — contient des chaînes vides et un format double
          "19:45(20:45)" non nettoyé. Décision de traitement en attente.
      - name: str_league_source
        description: Nom de la compétition source
        tests:
          - not_null
      - name: str_day
        description: Jour de la semaine
        tests:
          - accepted_values:
              arguments:
                values: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
      - name: str_venue
        description: 'Lieu du match : Home, Away ou Neutral'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Home, Away, Neutral]
      - name: str_result
        description: 'Résultat brut FBref : W, D, L'
        tests:
          - accepted_values:
              arguments:
                values: [W, D, L]
      - name: int_gf
        description: Buts marqués
        tests:
          - not_null
          - is_positive
      - name: int_ga
        description: Buts encaissés
        tests:
          - not_null
          - is_positive
      - name: int_sota
        description: >
          Shots on target against. Dérivé de ga_keeper + saves si la valeur brute manque.
          NULL seulement si sota, saves et ga_keeper manquent tous les trois (~0.4%).
        tests:
          - is_positive
      - name: int_ga_keeper
        description: >
          Buts encaissés par le gardien (hors CSC). Dérivé de sota - saves si la valeur brute
          manque. NULL seulement si sota, saves et ga_keeper manquent tous les trois (~0.4%).
        tests:
          - is_positive
      - name: int_saves
        description: Arrêts du gardien. Vide en source = 0 (convention).
        tests:
          - not_null
          - is_positive
      - name: dec_save_pct
        description: >
          Pourcentage d'arrêts recalculé (le brut FBref n'est pas fiable). NULL si sota
          inconnu ou si sota = 0 (gardien non sollicité, ~10% des lignes).
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
              inclusive: true
              config:
                severity: warn
