  - name: player_possession_chains
    description: >
      Segmente le flux d'événements WhoScored en chaînes de possession.
      Pour chaque événement, détermine l'équipe réellement en possession
      (possession certaine vs indéterminée), puis marque le déclencheur de
      chaque chaîne via chain_trigger (corner, free_kick, counter_attack,
      open_play, recovery, throw_in, goal_kick...).
      Source : int_event_enriched. Incrémentale sur match_id.
      Brique de base de corner_profiles, player_passes_raw et player_xg_chain.
      Une ligne par action.
    columns:
      # ── Héritées de int_event_enriched (mêmes définitions) ─────────────────────
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index."
        tests:
          - not_null
      - name: str_season
        description: "Saison du match (ex. 2023-2024)."
      - name: str_league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: str_team_id
        description: "Id canonique de l'équipe de l'action (converti depuis l'id WhoScored via int_whoscored_match_index)."
      - name: str_player_id
        description: "Identifiant WhoScored du joueur auteur de l'action. NULL possible sur certains événements."
      - name: str_event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
      - name: int_row_num
        description: "Index de l'événement dans le flux du match (ordre chronologique)."
        tests:
          - not_null
      - name: int_expanded_minute
        description: "Minute cumulée, temps additionnel inclus (ex. 45+2 → 47)."
      - name: int_second
        description: "Seconde dans la minute."
      - name: int_period
        description: "Période : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match (FormationSet), 14 = fin de match (End)."
      - name: str_type_id
        description: "Type d'événement WhoScored (cf. docs/Event_type_definition.txt ; ex. 1 Pass, 3 TakeOn, 4 Foul, 13-16 tirs)."
      - name: str_type_name
        description: "Libellé du type d'événement (Pass, TakeOn, Foul, Goal…)."
      - name: str_outcome_id
        description: "Résultat de l'action : 1 = réussi, 0 = raté."
      - name: bool_is_shot
        description: "Booléen : l'événement est un tir (flag WhoScored isShot)."
      - name: dec_x
        description: "Position X de l'action sur le terrain (0-100, croissant vers le but adverse ; repère relatif à l'équipe)."
      - name: dec_y
        description: "Position Y de l'action (0-100, largeur, 50 = axe central)."
      - name: dt_scraped_at
        description: "Horodatage ISO du scrape du match."
      # ── Transformation : segmentation en chaînes de possession ────────────────
      - name: str_chain_id
        description: "Identifiant de la chaîne de possession = match_id || '_' || numéro de chaîne. Regroupe les actions d'une même possession."
      - name: int_chain_number
        description: "Numéro séquentiel de la chaîne de possession dans le match."
      - name: str_chain_team_id
        description: >
          Id canonique de l'équipe EN POSSESSION durant la chaîne (possesseur résolu).
          ≠ team_id : team_id est l'équipe de l'action précise (ex. un dégagement
          adverse peut appartenir à la chaîne de l'équipe qui attaque).
      - name: int_is_rupture
        description: "Flag (0/1) : l'événement clôt la chaîne (le possesseur change juste après)."
      - name: str_chain_trigger
        description: "Déclencheur de la chaîne : recovery / corner / goal_kick / throw_in / free_kick / open_play."
      - name: int_certain_possessor
        description: "Id de l'équipe si la possession est certaine à cet événement ; NULL si possession indéterminée (duel / ballon libre)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - int_row_num

