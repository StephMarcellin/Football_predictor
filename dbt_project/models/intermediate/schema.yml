          - is_positive
      - name: int_standard_sot
        description: >
          Tirs cadrés, hors penalties. NULL quand sh est NULL/neutralisé ou vide en source
          (~29.5 %). Conservé si sh est vide mais sot renseigné (2 lignes UEFA Super Cup).
        tests:
          - is_positive
      - name: dec_standard_sot_pct
        description: >
          Taux de tirs cadrés sot / sh, recalculé, échelle 0-1 (le brut FBref est en 0-100).
          NULL si sh ou sot inconnu.
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: dec_standard_g_sh
        description: >
          Buts hors penalty par tir : (gls - pk) / sh, recalculé avec une définition uniforme
          (le brut FBref inclut les penalties en 2014-2017 et 2026-2027). NULL si sh inconnu.
          1 ligne empirique > 1 (1 tir, 2 buts — incohérence FBref).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
              config:
                severity: warn
      - name: dec_standard_g_sot
        description: >
          Buts hors penalty par tir cadré : (gls - pk) / sot, recalculé. NULL si sot inconnu
          ou nul. 4 lignes empiriques > 1 (mêmes incohérences que A-011 révisé).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
              config:
                severity: warn
      - name: int_standard_pk
        description: Buts sur penalty
        tests:
          - not_null
          - is_positive
      - name: int_standard_pkatt
        description: >
          Penaltys tentés. NULL avant 2014-2015 (19 900 lignes, non fourni par FBref) :
          non dérivable, les penaltys manqués étant inconnus (seule borne connue : pkatt >= pk).
        tests:
          - is_positive
      - name: str_season
        description: Saison au format YYYY-YYYY
        tests:
          - not_null
          - matches_regex:
              arguments:
                pattern: ^\d{4}-\d{4}$
      - name: str_source
        description: Source de la donnée (fbref)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [fbref]
      - name: dt_scraped_at
        description: Timestamp du scraping
        tests:
          - not_null
      - name: str_comp_category
        description: 'Catégorie de compétition : Big5, Cup, D2, Europe, Other'
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Big5, Cup, D2, Europe, Other]
      - name: str_result_1n2
        description: 'Résultat encodé : H, D, A'
        tests:
          - accepted_values:
              arguments:
                values: [H, D, A]

  - name: int_odds
    description: >
      Cotes bookmakers (Pinnacle et moyennes marché) rematchées sur match_id
      + team_id/opponent_id. Alimente les colonnes odds_* et les probabilités
      implicites de backbone.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1), rattaché via match_registry."
      - name: str_team_id
        description: "Id canonique de l'équipe à DOMICILE (via team_mapping sur home_team)."
      - name: str_opponent_id
        description: "Id canonique de l'équipe à l'EXTÉRIEUR (via team_mapping sur away_team)."
      - name: dt_date
        description: "Date du match"
      - name: str_season
        description: "Saison au format YYYY-YYYY"
      - name: str_league_source
        description: "Nom de la compétition source"
      - name: str_result_fdc
        description: "Résultat réel du match (H/D/A) — utilisé pour calculer l'edge en backtest"
      - name: dec_odds_pinnacle_h
        description: "Cote Pinnacle victoire domicile"
      - name: dec_odds_pinnacle_d
        description: "Cote Pinnacle match nul"
      - name: dec_odds_pinnacle_a
        description: "Cote Pinnacle victoire extérieur"
      - name: dec_odds_avg_h
        description: "Cote moyenne du marché victoire domicile"
      - name: dec_odds_avg_d
        description: "Cote moyenne du marché match nul"
      - name: dec_odds_avg_a
        description: "Cote moyenne du marché victoire extérieur"
      - name: dec_odds_max_h
        description: "Meilleure cote disponible sur le marché victoire domicile"
      - name: dec_odds_max_d
        description: "Meilleure cote disponible match nul"
      - name: dec_odds_max_a
        description: "Meilleure cote disponible victoire extérieur"
      - name: dec_pinnacle_prob_h
        description: "Probabilité implicite Pinnacle victoire domicile (1/cote, marginée)"
      - name: dec_pinnacle_prob_d
        description: "Probabilité implicite Pinnacle match nul"
      - name: dec_pinnacle_prob_a
        description: "Probabilité implicite Pinnacle victoire extérieur"
      - name: dec_market_prob_h
        description: "Probabilité implicite marché moyen victoire domicile"
      - name: dec_market_prob_d
        description: "Probabilité implicite marché moyen match nul"
      - name: dec_market_prob_a
        description: "Probabilité implicite marché moyen victoire extérieur"
      # ── Nouveaux marchés propagés (clôture, drift, over/under 2.5) ──────────
      - name: dec_pinnacle_prob_close_h
        description: "Proba implicite Pinnacle CLÔTURE — domicile (no-vig). NULL si cote de clôture absente."
        tests:
          - is_valid_probability: {config: {severity: warn}}
      - name: dec_pinnacle_prob_close_d
        description: "Proba implicite Pinnacle CLÔTURE — nul (no-vig)."
        tests:
          - is_valid_probability: {config: {severity: warn}}
      - name: dec_pinnacle_prob_close_a
        description: "Proba implicite Pinnacle CLÔTURE — extérieur (no-vig)."
        tests:
          - is_valid_probability: {config: {severity: warn}}
      - name: dec_market_prob_close_h
        description: "Proba implicite marché moyen CLÔTURE — domicile (no-vig)."
        tests:
          - is_valid_probability: {config: {severity: warn}}
      - name: dec_market_prob_close_d
        description: "Proba implicite marché moyen CLÔTURE — nul (no-vig)."
        tests:
          - is_valid_probability: {config: {severity: warn}}
      - name: dec_market_prob_close_a
        description: "Proba implicite marché moyen CLÔTURE — extérieur (no-vig)."
        tests:
          - is_valid_probability: {config: {severity: warn}}
      - name: dec_pinnacle_drift_h
        description: "Drift ouverture→clôture (proba clôture − proba ouverture), domicile. Plage [-1,1], pas une probabilité."
      - name: dec_pinnacle_drift_d
        description: "Drift ouverture→clôture, nul."
      - name: dec_pinnacle_drift_a
        description: "Drift ouverture→clôture, extérieur."
      - name: dec_pinnacle_prob_over25
        description: "Proba implicite Pinnacle Over 2.5 buts (ouverture, no-vig 2-way)."
        tests:
          - is_valid_probability: {config: {severity: warn}}
      - name: dec_pinnacle_prob_under25
        description: "Proba implicite Pinnacle Under 2.5 buts (ouverture, no-vig 2-way)."
        tests:
          - is_valid_probability: {config: {severity: warn}}
      - name: dec_pinnacle_prob_close_over25
        description: "Proba implicite Pinnacle Over 2.5 buts (clôture, no-vig 2-way)."
        tests:
          - is_valid_probability: {config: {severity: warn}}
      - name: dec_pinnacle_prob_close_under25
        description: "Proba implicite Pinnacle Under 2.5 buts (clôture, no-vig 2-way)."
        tests:
          - is_valid_probability: {config: {severity: warn}}

  - name: int_understat_schedule
    description: >
      Calendrier Understat rematché sur le match_id unifié. 1 ligne par match (point de vue
      domicile : str_team_id = domicile, str_opponent_id = extérieur). Conserve str_us_match_id
      (id Understat d'origine) et produit la correspondance str_us_match_id ↔ str_match_id
      réutilisée par int_understat_stats. Périmètre : Big5 domestique, 2014-2015 → 2025-2026.
      Understat ne fournit pas de date : jointure registre sur (saison, championnat, domicile,
      extérieur), en retenant la première date de la paire (écarte les barrages classés dans
      le même league_source, ex. Spezia-Verona 11/06/2023).
    tests:
      # ── Grain : 1 ligne par match Understat ──
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - str_us_match_id
          config:
            severity: error
      # ── Cohérence : is_result ↔ score et xG renseignés (0 violation empirique, 431 non joués) ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (bool_is_result AND int_home_goals IS NOT NULL AND int_away_goals IS NOT NULL
                              AND dec_home_xg IS NOT NULL AND dec_away_xg IS NOT NULL)
              OR (NOT bool_is_result AND int_home_goals IS NULL AND dec_home_xg IS NULL)
          config:
            severity: error
    columns:
      - name: str_match_id
        description: >
          Identifiant unifié du match (SHA1), rattaché via match_registry. Unique (le fan-out
          Spezia-Verona 2022-2023 est corrigé). Historique : 38 NULL (AC Ajaccio 2015-2016 — le
          club de Ligue 1 cette saison-là était le GFC Ajaccio, mal mappé par la normalisation
          silver). Corrigé dans la CTE patched du modèle (seul cas connu) → 0 NULL attendu.
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: source('intermediate', 'match_registry')
                field: match_id
      - name: str_us_match_id
        description: "Identifiant du match côté Understat (source), casté en VARCHAR."
        tests:
          - not_null
      - name: str_team_id
        description: "Id canonique de l'équipe à domicile (via team_mapping sur home_team)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('referentiel', 'team_mapping')
                field: team_id
      - name: str_opponent_id
        description: "Id canonique de l'équipe à l'extérieur (via team_mapping sur away_team)."
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('referentiel', 'team_mapping')
                field: team_id
      - name: str_league_source
        description: "Nom de la compétition source"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Bundesliga, La Liga, Ligue 1, Premier League, Serie A]
      - name: int_home_goals
        description: "Buts marqués par l'équipe domicile. NULL si match non joué (431 lignes)."
        tests:
          - is_positive
      - name: int_away_goals
        description: "Buts marqués par l'équipe extérieur. NULL si match non joué."
        tests:
          - is_positive
      - name: dec_home_xg
        description: "Expected goals équipe domicile. NULL exactement sur les 431 matchs non joués (2 %)."
        tests:
          - is_positive
      - name: dec_away_xg
        description: "Expected goals équipe extérieur. NULL exactement sur les matchs non joués."
        tests:
          - is_positive
      - name: bool_is_result
        description: "TRUE si le match a un résultat définitif, FALSE s'il est à venir ou annulé (Ligue 1 2019-2020 : 101 matchs)."
        tests:
          - not_null
      - name: str_match_url
        description: "URL Understat du match"
      - name: str_season
        description: "Saison au format YYYY-YYYY"
        tests:
          - not_null
          - matches_regex:
              arguments:
                pattern: ^\d{4}-\d{4}$
      - name: str_source
        description: "Source des données (Understat)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [understat]
      - name: dt_scraped_at
        description: "Horodatage du scrape (casté depuis le VARCHAR ISO)."
        tests:
          - not_null
      - name: str_comp_category
        description: "Catégorie de compétition : Big5 (100 % — Understat couvre uniquement les 5 grands championnats domestiques)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Big5]

  - name: int_understat_stats
    description: >
      Stats Understat par match joué (xPts, npxG, PPDA, deep) rattachées au match_id unifié
      via int_understat_schedule (1-1 sur str_us_match_id). Alimente les colonnes xG et
      pressing de backbone. Périmètre : Big5 domestique. 21 259 lignes = matchs joués.
    tests:
      # ── Grain : 1 ligne par match Understat ──
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - str_us_match_id
          config:
            severity: error
      # ── Contrainte de miroir xG : le différentiel home est l'opposé du away (0 violation) ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ABS(dec_home_np_xg_diff + dec_away_np_xg_diff) < 0.001"
          config:
            severity: error
      # ── Cohérence : diff = home - away (0 violation) ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: "ABS((dec_home_np_xg - dec_away_np_xg) - dec_home_np_xg_diff) < 0.001"
          config:
            severity: error
      # ── Points attendus : 2 ≤ home + away ≤ 3 (le reste va au nul) — 0 violation ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dec_home_xpts + dec_away_xpts BETWEEN 1.999 AND 3.001"
          config:
            severity: error
      # ── Outliers de PPDA (Cat D) : signalés, jamais filtrés ──
      # 6 lignes empiriques > 100 (max 193 : équipe quasi sans action défensive).
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(dec_home_ppda IS NULL OR dec_home_ppda <= 100) AND (dec_away_ppda IS NULL OR dec_away_ppda <= 100)"
          config:
            severity: warn
    columns:
      - name: str_match_id
        description: >
          Identifiant unifié du match (SHA1), via int_understat_schedule. 0 NULL attendu
          (correctif AC → GFC Ajaccio 2015-2016 appliqué dans int_understat_schedule).
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: source('intermediate', 'match_registry')
                field: match_id
      - name: str_us_match_id
        description: "Identifiant du match côté Understat (source), casté en VARCHAR."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_understat_schedule')
                field: str_us_match_id
      - name: dec_home_xpts
        description: "Expected points domicile — points attendus selon les xG du match"
        tests:
          - not_null
          - is_positive
      - name: dec_away_xpts
        description: "Expected points extérieur"
        tests:
          - not_null
          - is_positive
      - name: dec_home_np_xg
        description: "Expected goals sans pénalties — équipe domicile (≤ home_xg du calendrier, 0 violation)"
        tests:
          - not_null
          - is_positive
      - name: dec_away_np_xg
        description: "Expected goals sans pénalties — équipe extérieur"
        tests:
          - not_null
          - is_positive
      - name: dec_home_np_xg_diff
        description: "Différentiel npxG domicile (home_np_xg - away_np_xg). Peut être négatif."
        tests:
          - not_null
      - name: dec_away_np_xg_diff
        description: "Différentiel npxG extérieur (away_np_xg - home_np_xg). Peut être négatif."
        tests:
          - not_null
      - name: dec_home_ppda
        description: >
          PPDA domicile — passes adverses autorisées par action défensive (intensité du pressing).
          NULL sur 2 lignes (dénominateur nul : indéfini, pas un zéro).
        tests:
          - is_positive
      - name: dec_away_ppda
        description: "PPDA extérieur. Mêmes règles de NULL que dec_home_ppda."
        tests:
          - is_positive
      - name: int_home_deep
        description: "Passes complétées dans les 18 derniers mètres adverses — domicile (mesure la pression offensive)"
        tests:
          - not_null
          - is_positive
      - name: int_away_deep
        description: "Passes complétées dans les 18 derniers mètres adverses — extérieur"
        tests:
          - not_null
          - is_positive
      - name: str_season
        description: "Saison au format YYYY-YYYY"
        tests:
          - not_null
          - matches_regex:
              arguments:
                pattern: ^\d{4}-\d{4}$
      - name: str_league_source
        description: "Nom de la compétition source"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Bundesliga, La Liga, Ligue 1, Premier League, Serie A]
      - name: str_source
        description: "Source des données (Understat)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [understat]
      - name: dt_scraped_at
        description: "Horodatage du scrape (casté depuis le VARCHAR ISO)."
        tests:
          - not_null
      - name: str_comp_category
        description: "Catégorie de compétition : Big5"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Big5]

  - name: int_whoscored_match_index
    description: >
      Pont d'identité entre l'univers WhoScored (ws_match_id, ws_home/away_team_id)
      et les clés unifiées (match_id, team_id normalisé). Table de résolution
      d'identité centrale pour toute la chaîne événementielle WhoScored.
      Grain : une ligne par match. Couvre 2 comp_category : Big5 et D2.
    tests:
      # Grain : ws_match_id unique — severity=warn car 118 doublons empiriques
      # à investiguer (rechargements de scraping ?).
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [str_ws_match_id]
          config:
            severity: warn
      # Contrainte : domicile ≠ extérieur (ids WhoScored bruts).
      - dbt_utils.expression_is_true:
          expression: "str_ws_home_team_id != str_ws_away_team_id"
          config:
            severity: error
      # Contrainte : domicile ≠ extérieur (ids canoniques) — sur non-NULL uniquement.
      - dbt_utils.expression_is_true:
          expression: "str_team_id IS NULL OR str_opponent_id IS NULL OR str_team_id != str_opponent_id"
          config:
            severity: error
    columns:
      - name: str_ws_match_id
        description: "Identifiant WhoScored du match (brut, VARCHAR entier, depuis silver.stg_whoscored_match_index)."
        tests:
          - not_null
          - matches_regex:
              arguments:
                pattern: '^[1-9][0-9]*$'
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1), résolu via match_registry. NULL si le match n'est pas résolu au registre (~4.4 % empirique)."
        tests:
          - not_null:
              config:
                severity: error
          - relationships:
              to: source('intermediate', 'match_registry')
              field: match_id
              config:
                severity: warn
      - name: str_team_id
        description: "Id canonique de l'équipe À DOMICILE (résolu via team_mapping sur home_team_name). NULL toléré (~2.2 %)."
        tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              to: source('referentiel', 'team_mapping')
              field: team_id
              config:
                severity: warn
      - name: str_opponent_id
        description: "Id canonique de l'équipe À L'EXTÉRIEUR (résolu via team_mapping sur away_team_name). NULL toléré (~2.2 %)."
        tests:
          - not_null:
              config:
                severity: warn
          - relationships:
              to: source('referentiel', 'team_mapping')
              field: team_id
              config:
                severity: warn
      - name: str_ws_home_team_id
        description: "Id WhoScored (brut) de l'équipe à domicile — sert de clé pour mapper vers team_id."
        tests:
          - not_null
          - is_positive
      - name: str_ws_away_team_id
        description: "Id WhoScored (brut) de l'équipe à l'extérieur — sert de clé pour mapper vers opponent_id."
        tests:
          - not_null
          - is_positive
      - name: dt_match_date
        description: "Date du match."
        tests:
          - not_null
      - name: str_league_source
        description: "Championnat / source des données (ex. Bundesliga)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Bundesliga', '2. Bundesliga', 'La Liga', 'Ligue 1', 'Premier League', 'Serie A', 'Championship']
      - name: str_season
        description: "Saison du match (ex. 2023-2024). Couvre 2009-2026 (historique long WhoScored)."
        tests:
          - not_null
          - matches_regex:
              arguments:
                pattern: '^\d{4}-\d{4}$'
      - name: dt_scraped_at
        description: "Horodatage ISO du scrape du match."
      - name: str_comp_category
        description: "Catégorie de compétition : Big5 (5 grands championnats) + D2 (Championship, 2. Bundesliga)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Big5', 'D2']

  - name: int_whoscored_events
    description: >
      Événements bruts WhoScored (silver.stg_whoscored_events) avec team_id
      normalisé et match_id unifié, résolus via int_whoscored_match_index.
      Point d'entrée de la chaîne événementielle. Grain : un événement.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index. NULL si le match n'est pas résolu au registre."
      - name: str_team_id
        description: "Id canonique de l'équipe de l'événement (converti depuis l'id WhoScored via int_whoscored_match_index)."
      - name: str_event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
      - name: str_league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: str_season
        description: "Saison du match (ex. 2023-2024)."
      - name: int_minute
        description: "Minute de jeu brute (hors temps additionnel)."
      - name: int_second
        description: "Seconde dans la minute."
      - name: int_expanded_minute
        description: "Minute cumulée, temps additionnel inclus (ex. 45+2 → 47)."
      - name: int_period
        description: "Période : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match (FormationSet), 14 = fin de match (End)."
      - name: str_player_id
        description: "Identifiant WhoScored du joueur auteur de l'action. NULL possible sur certains événements."
      - name: dec_x
        description: "Position X de l'action sur le terrain (0-100, croissant vers le but adverse ; repère relatif à l'équipe)."
      - name: dec_y
        description: "Position Y de l'action (0-100, largeur, 50 = axe central)."
      - name: dec_end_x
        description: "Position X de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: dec_end_y
        description: "Position Y de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: str_type_id
        description: "Type d'événement WhoScored (cf. docs/Event_type_definition.txt ; ex. 1 Pass, 3 TakeOn, 4 Foul, 13-16 tirs)."
      - name: str_type_name
        description: "Libellé du type d'événement (Pass, TakeOn, Foul, Goal…)."
      - name: str_outcome_id
        description: "Résultat de l'action : 1 = réussi, 0 = raté."
      - name: str_outcome_name
        description: "Libellé du résultat : Successful / Unsuccessful."
      - name: bool_is_touch
        description: "Booléen : le joueur a touché le ballon (flag WhoScored isTouch)."
