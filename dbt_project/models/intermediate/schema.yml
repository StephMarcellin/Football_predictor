      et l'issue de la séquence. Source : player_possession_chains. Incrémentale.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
      - name: team_id
        description: "Id de l'équipe qui tire le corner."
      - name: corner_taker_id
        description: "Identifiant du joueur qui tire le corner."
      - name: corner_row_num
        description: "row_num de l'événement du corner dans le match."
      - name: expanded_minute
        description: "Minute (expanded_minute) du corner."
      - name: corner_side
        description: "Côté du corner déduit du y de départ : 'right' si corner_start_y < 50, sinon 'left'."
      - name: landing_zone
        description: "Zone d'atterrissage relative au côté : 'short' (livraison courte, end_x<83), 'center' (end_y 45-55), 'near_post' ou 'far_post' selon le côté."
      - name: n_aerial_duels
        description: "Nombre de duels aériens disputés sur la chaîne issue du corner."
      - name: shot_body_part
        description: "Partie du corps du tir issu du corner : right_foot, left_foot, head ou 'other' (NULL si pas de tir)."
      - name: clearance_player_id
        description: "Identifiant du défenseur qui dégage (NULL si pas de dégagement)."
      - name: clearance_quality
        description: "Qualité du dégagement défensif : perfect / good / poor / failed (NULL si pas de dégagement)."
      - name: is_headed_clearance
        description: "Booléen : le dégagement est effectué de la tête."
      - name: outcome
        description: "Issue de la chaîne du corner : 'goal' (tir 16), 'shot_saved' (15), 'shot_off_target' (13/14), 'clearance' (dégagement), 'retained' (possession conservée sinon)."
      - name: chain_danger_total
        description: "Somme du danger (action_value de event_values) généré par l'équipe attaquante sur toute la chaîne issue du corner."
      - name: chain_danger_momentum
        description: "Part du danger accumulée AVANT le dernier tir / danger total de la chaîne (danger_before_shot / chain_danger_total). NULL si aucun tir."

  # ════════════════════════════════════════════════════════════════════════════
  # RÉSEAU DE PASSES JOUEUR
  # player_passes_raw → player_network_passes → centrality / betweenness / duels
  #                                          → team_network_features
  # ════════════════════════════════════════════════════════════════════════════

  - name: player_passes_raw
    description: >
      Passes atomiques passeur → receveur reconstruites depuis les chaînes de
      possession (LEAD sur les événements de l'équipe en possession, sans sauter
      les événements adverses). Porte les flags is_progressive/is_creative/
      is_buildup et le chain_trigger. Brique de base du réseau de passes.
      Grain : une passe réussie (type 1, outcome 1, avec receveur).
    columns:
      # ── Héritées ───────────────────────────────────────────────────────────────
      - name: match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index."
        tests:
          - not_null
      - name: chain_id
        description: "Identifiant de la chaîne de possession (repris de player_possession_chains)."
      - name: chain_trigger
        description: "Déclencheur de la chaîne : recovery / corner / goal_kick / throw_in / free_kick / open_play (repris de player_possession_chains)."
      - name: team_id
        description: "Id canonique de l'équipe qui fait la passe (= chain_team_id, l'équipe en possession)."
      - name: row_num
        description: "Index de l'événement (la passe) dans le flux du match (ordre chronologique)."
      - name: expanded_minute
        description: "Minute cumulée, temps additionnel inclus (ex. 45+2 → 47)."
      - name: second
        description: "Seconde dans la minute."
      - name: x
        description: "Position X de départ de la passe (0-100, croissant vers le but adverse ; repère relatif à l'équipe)."
      - name: y
        description: "Position Y de départ de la passe (0-100, largeur, 50 = axe central)."
      - name: end_x
        description: "Position X de fin de la passe (repris de int_event_enriched)."
      - name: end_y
        description: "Position Y de fin de la passe (repris de int_event_enriched)."
      - name: is_key_pass
        description: "Flag (0/1) : passe clé — mène à un tir (qualifier 11113 KeyPass, repris de int_event_enriched)."
      - name: is_shot_assist
        description: "Flag (0/1) : passe précédant directement un tir (qualifier 210 ShotAssist, repris de int_event_enriched)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      # ── Transformations propres à player_passes_raw ───────────────────────────
      - name: passer_id
        description: "Joueur qui effectue la passe (= player_id de l'événement Pass)."
      - name: receiver_id
        description: "Joueur qui reçoit = prochain joueur de la MÊME équipe dans la chaîne (LEAD sur les événements de l'équipe en possession)."
      - name: is_progressive
        description: "Booléen : la passe avance le ballon d'au moins 10 unités (≈10 m) vers le but adverse (end_x > x + 10)."
      - name: is_creative
        description: "Booléen : la passe mène directement à un tir (is_key_pass OU is_shot_assist)."
      - name: is_buildup
        description: "Booléen : la passe est jouée dans la moitié défensive (x < 50)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: player_network_passes
    description: >
      Arêtes du graphe de passes agrégées par (match, équipe, passeur, receveur) :
      volume total et ventilé par contexte (contre-attaque, open play, recovery,
      autre), passes progressives/créatives/buildup. Source : player_passes_raw.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
      - name: team_id
        description: "Id canonique de l'équipe."
      - name: passer_id
        description: "Identifiant WhoScored du joueur passeur (nœud source de l'arête du réseau de passes)."
      - name: receiver_id
        description: "Identifiant WhoScored du joueur receveur (nœud cible de l'arête)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: n_passes
        description: "Nombre total de passes réussies passeur -> receveur dans le match (poids de l'arête)."
      - name: n_passes_counter_attack
        description: "Parmi n_passes, celles dont la chaîne est une contre-attaque (chain_trigger = 'counter_attack')."
      - name: n_passes_open_play
        description: "Parmi n_passes, celles en jeu ouvert (chain_trigger = 'open_play')."
      - name: n_passes_recovery
        description: "Parmi n_passes, celles issues d'une récupération (chain_trigger = 'recovery')."
      - name: n_passes_other
        description: "Parmi n_passes, celles sur coup de pied arrêté (chain_trigger dans corner / free_kick / throw_in / goal_kick)."
      - name: n_progressive
        description: "Nombre de passes progressives (flag is_progressive de player_passes_raw)."
      - name: n_creative
        description: "Nombre de passes créatives (flag is_creative de player_passes_raw)."
      - name: n_buildup
        description: "Nombre de passes de construction (flag is_buildup de player_passes_raw)."

  - name: player_network_centrality
    description: >
      Centralité de chaque joueur dans le réseau de passes : degrés entrant et
      sortant (bruts et pondérés par le volume), passes créatives/progressives
      émises et reçues. Source : player_network_passes.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
      - name: team_id
        description: "Id canonique de l'équipe."
      - name: player_id
        description: "Identifiant WhoScored du joueur (nœud du réseau de passes de l'équipe)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: degree_out
        description: "Degré sortant : nombre de receveurs DISTINCTS du joueur dans le match."
      - name: degree_in
        description: "Degré entrant : nombre de passeurs DISTINCTS vers le joueur."
      - name: weighted_degree_out
        description: "Volume total de passes émises par le joueur (somme des n_passes sortantes)."
      - name: weighted_degree_in
        description: "Volume total de passes reçues par le joueur (somme des n_passes entrantes)."
      - name: n_creative_out
        description: "Nombre de passes créatives émises par le joueur (somme n_creative sortantes)."
      - name: n_progressive_out
        description: "Nombre de passes progressives émises par le joueur (somme n_progressive sortantes)."
      - name: pass_share
        description: "Part des passes de l'équipe portées par le joueur = weighted_degree_out / total passes équipe (arrondi 4 déc.)."
      - name: creative_rate
        description: "Taux de passes créatives parmi ses passes émises = n_creative_out / weighted_degree_out (arrondi 4 déc.)."
      - name: betweenness_proxy
        description: "Proxy de centralité d'intermédiarité = (degree_out × degree_in) / (n_players × (n_players − 1)) : diversité entrante × sortante normalisée par les paires possibles (arrondi 4 déc.)."

  - name: player_network_betweenness
    description: >
      Modèle Python (dbt-python). Calcule la betweenness centrality exacte par
      (match, équipe) avec networkx sur le graphe pondéré de passes (normalized=True,
      weight=n_passes). Identifie les joueurs-ponts. Source : player_network_passes.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
      - name: team_id
        description: "Id canonique de l'équipe."
      - name: player_id
        description: "Identifiant WhoScored du joueur (nœud du réseau de passes de l'équipe)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: betweenness_exact
        description: "Centralité d'intermédiarité EXACTE du joueur, calculée par NetworkX (betweenness_centrality) sur le réseau de passes DIRIGÉ de l'équipe (arêtes passeur->receveur pondérées par n_passes), normalisée dans [0,1], arrondie à 6 décimales. Modèle dbt Python."

  - name: player_network_duels
    description: >
      Apparie les duels adverses via le qualifier 233 (miroir d'événement) pour
      relier le joueur A et son vis-à-vis B sur le même affrontement. Matière
      première des duels individuels. Sources : events_qual, int_event_enriched.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: expanded_minute
        description: "Minute cumulée du duel (temps additionnel inclus)."
      - name: second
        description: "Seconde dans la minute."
      - name: duel_type_id
        description: "type_id de l'événement de duel (côté A) — ex. Aerial, Tackle, Foul, Dispossessed."
      - name: duel_type
        description: "Libellé du type de duel (type_name côté A)."
      - name: x
        description: "Position X du duel sur le terrain (côté A, repère de l'équipe A ; 0-100)."
      - name: y
        description: "Position Y du duel (côté A ; 0-100, 50 = axe central)."
      - name: event_id_a
        description: "event_id WhoScored du côté A du duel."
      - name: team_id_a
        description: "Id de l'équipe du côté A."
      - name: player_id_a
        description: "Identifiant du joueur du côté A."
      - name: outcome_a
        description: "Résultat du côté A (1 = réussi, 0 = raté)."
      - name: event_id_b
        description: "event_id du côté B, adverse, apparié via OppositeRelatedEvent (qualifier 233)."
      - name: team_id_b
        description: "Id de l'équipe du côté B (adverse à A)."
      - name: player_id_b
        description: "Identifiant du joueur du côté B."
      - name: outcome_b
        description: "Résultat du côté B (1 = réussi, 0 = raté)."

  - name: team_network_features
    description: >
      Agrège les métriques réseau joueur → features d'équipe par match : nombre
      de joueurs et d'arêtes actifs, dépendance au top créateur (top_creator_share),
      betweenness moyenne, entropie de Shannon du réseau (network_entropy).
      Source : player_network_centrality.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
      - name: team_id
        description: "Id canonique de l'équipe."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: n_players
        description: "Nombre de joueurs (nœuds) du réseau de passes de l'équipe (depuis player_network_centrality)."
      - name: n_edges
        description: "Nombre d'arêtes dirigées du réseau = somme des degree_out des joueurs."
      - name: network_density
        description: "Densité du réseau = n_edges / (n_players × (n_players − 1)) : proportion des connexions possibles réalisées (arrondi 4 déc.)."
      - name: top_creator_share
        description: "Part de passes du plus gros contributeur = MAX(pass_share) parmi les joueurs (arrondi 4 déc.)."
      - name: avg_betweenness
        description: "Moyenne du betweenness_proxy des joueurs de l'équipe (arrondi 4 déc.)."
      - name: network_entropy
        description: "Entropie de Shannon normalisée de la distribution des passes : −Σ(pass_share·ln(pass_share)) / ln(n_players). 0 = jeu concentré sur un joueur, proche de 1 = passes réparties uniformément (arrondi 4 déc.)."
      - name: centroid_x
        description: "Centroïde X des passes (moyenne des x de départ des passes réussies) : proche de 100 = équipe qui joue haut, proche de 0 = joue bas (arrondi 2 déc.)."
      - name: centroid_y
        description: "Centroïde Y des passes (moyenne des y de départ) : ~50 = jeu axial, décalé = jeu sur un côté (arrondi 2 déc.)."
      - name: centroid_x_progressive
        description: "Centroïde X des seules passes progressives (arrondi 2 déc.)."
      - name: centroid_y_progressive
        description: "Centroïde Y des seules passes progressives (arrondi 2 déc.)."

  # ════════════════════════════════════════════════════════════════════════════
  # xG / MENACE / ZONES
  # ════════════════════════════════════════════════════════════════════════════

  - name: player_xg_chain
    description: >
      Attribue une valeur xG (proxy via chance_creation du tir terminal) aux
      joueurs impliqués dans une chaîne se terminant par un tir — crédit offensif
      réparti sur la chaîne. Source : player_possession_chains. Incrémentale.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
      - name: chain_id
        description: "Identifiant de la chaîne de possession = match_id || '_' || numéro de chaîne (propagé de player_possession_chains). Regroupe les actions d'une même possession."
      - name: chain_number
        description: "Numéro séquentiel de la chaîne de possession dans le match (propagé de player_possession_chains)."
      - name: chain_team_id
        description: "Id canonique de l'équipe EN POSSESSION durant la chaîne (propagé de player_possession_chains). C'est l'équipe attaquante ; team_id peut différer (action d'un autre joueur)."
      - name: player_id
        description: "Identifiant du joueur de l'équipe en possession présent dans la chaîne (participant à la construction)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: shot_event_id
        description: "event_id WhoScored du tir terminal (dernier tir) de la chaîne."
      - name: shot_type_id
        description: "type_id du tir terminal (13 MissedShots, 14 ShotOnPost, 15 SavedShot, 16 Goal)."
      - name: shot_minute
        description: "Minute (expanded_minute) du tir terminal de la chaîne."
      - name: xg_proxy
        description: "Proxy xG du tir terminal de la chaîne = chance_creation de event_values pour ce tir (0-1)."
      - name: is_counter_attack
        description: "Booléen : la chaîne contient un tir en contre-attaque (qualifier 23 FastBreak) — propriété de la chaîne entière, pas du seul tir."
      - name: position_in_chain
        description: "Rang chronologique du joueur dans la chaîne (1 = premier), déduplication sur sa DERNIÈRE apparition (la plus proche du tir)."
      - name: chain_length
        description: "Nombre total de participations (touches) de l'équipe en possession dans la chaîne, avant déduplication par joueur."
      - name: position_weight
        description: "Poids de proximité au tir = position_in_chain / chain_length (0-1) : plus le joueur agit tard (près du tir), plus le poids est élevé."
      - name: is_shooter
        description: "Booléen : le joueur est le tireur terminal de la chaîne."
      - name: is_assister
        description: "Booléen : le joueur est le passeur décisif du tir (résolu via RelatedEventId, qualifier 55)."
      - name: xgchain
        description: "xGChain : crédit uniforme = xg_proxy du tir terminal, attribué à chaque joueur de la chaîne."
      - name: xgchain_weighted
        description: "xGChain pondéré = xg_proxy × position_weight (crédit croissant vers le tir)."
      - name: xgbuildup
        description: "xGBuildup : = xgchain pour les joueurs de construction ; NULL pour le tireur et le passeur décisif (isole l'apport hors finition)."
      - name: xgbuildup_weighted
        description: "xGBuildup pondéré : = xgchain_weighted pour les joueurs de construction ; NULL pour le tireur et le passeur décisif."

  - name: threat_conceded
    description: >
      Symétrique défensif de player_xg_chain : attribue la menace concédée sur
      les chaînes adverses terminées par un tir (penalty exclu), pour mesurer la
      responsabilité défensive. Source : player_xg_chain. Incrémentale.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
      - name: chain_id
        description: "Identifiant de la chaîne de possession = match_id || '_' || numéro de chaîne (propagé de player_possession_chains). Regroupe les actions d'une même possession."
      - name: chain_number
        description: "Numéro séquentiel de la chaîne de possession dans le match (propagé de player_possession_chains)."
      - name: chain_team_id
        description: "Id canonique de l'équipe EN POSSESSION durant la chaîne (propagé de player_possession_chains). C'est l'équipe attaquante ; team_id peut différer (action d'un autre joueur)."
      - name: player_id
        description: "Identifiant du joueur DÉFENSEUR adverse présent dans la chaîne (team_id != chain_team_id) — celui qui concède la menace."
      - name: team_id
        description: "Id de l'équipe du défenseur (équipe qui concède, adverse à chain_team_id)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: xg_proxy
        description: "Proxy xG du tir terminal de la chaîne (propagé de player_xg_chain) = chance_creation de event_values pour ce tir (0-1)."
      - name: is_penalty
        description: "Booléen : le tir terminal de la chaîne est un penalty (qualifier 9). Si TRUE, le gardien n'est pas sanctionné."
      - name: position_in_chain
        description: "Rang chronologique du défenseur dans la chaîne (1 = première intervention défensive), par expanded_minute/second/row_num."
      - name: chain_length
        description: "Nombre total d'interventions défensives adverses dans la chaîne."
      - name: position_weight
        description: "Poids de responsabilité = position_in_chain / chain_length (0-1) : plus le défenseur intervient tard (proche du tir), plus le poids est élevé."
      - name: is_keeper
        description: "Booléen : le défenseur est le gardien (a réalisé Save/Claim/Punch/KeeperPickup — type 10/11/41/52 — dans la chaîne)."
      - name: has_error_leading_to_goal
        description: "Booléen : le gardien a commis une Error menant au but (type 51 + qualifier 170) dans la chaîne."
      - name: threat_conceded
        description: "Menace concédée brute = xg_proxy du tir de la chaîne (non pondérée)."
      - name: threat_conceded_weighted
        description: "Menace concédée pondérée + règles gardien : penalty -> gardien = 0 ; erreur du gardien -> sanction pleine (xg_proxy × position_weight) ; défense trouée (gardien sans erreur) -> 0 ; défenseur non-gardien -> xg_proxy × position_weight."

  - name: player_zone_transitions
    description: >
      Compte les transitions de zone (zone_from → zone_to) par joueur, ventilées
      par période, état au score (score_state) et formation. Décrit les patterns
      de circulation du ballon. Source : int_event_enriched (via player_passes_raw
      pour les passes + TakeOns réussis). Incrémentale.
      Grain : (match, équipe, joueur, zone_from, zone_to, période, score_state, formation).
      Les « déplacements » = passes réussies + dribbles (TakeOn) réussis.
    columns:
      # ── Héritées ───────────────────────────────────────────────────────────────
      - name: match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index."
      - name: team_id
        description: "Id canonique de l'équipe du joueur (converti depuis l'id WhoScored via int_whoscored_match_index)."
      - name: player_id
        description: "Identifiant WhoScored du joueur auteur des déplacements."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: period
        description: "Période : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match, 14 = fin de match."
      # ── Transformations ───────────────────────────────────────────────────────
      - name: score_state
        description: "État au score au moment des déplacements : winning / losing / drawing (buts cumulés équipe vs adverse)."
      - name: formation
        description: "Code de la formation active de l'équipe à cet instant (via FormationSet/FormationChange, qualifier 130)."
      - name: zone_from
        description: >
          Cellule de DÉPART (grille 3×5). Bande latérale sur y : A (y<33.3), B (33.3–66.6),
          C (≥66.6) ; bande longitudinale sur x : 1 (x≥80, près du but adverse), 2 (≥60),
          3 (≥40), 4 (≥20), 5 (<20, près de son but). Ex. B1 = axe central, tiers offensif.
      - name: zone_to
        description: "Cellule d'ARRIVÉE du déplacement, même encodage 3×5, calculée depuis end_x / end_y."
      - name: n_transitions
        description: "Nombre de déplacements (passes + dribbles réussis) dans le groupe zone_from → zone_to."
      - name: pct_transitions
        description: "Part de ces déplacements sur l'ensemble des déplacements du joueur dans le contexte (match, période, score_state, formation)."
      - name: progressive_rate
        description: "Part des déplacements progressifs (end_x > x + 10, ≈10 m vers le but adverse) dans le groupe."

  - name: int_whoscored_player_match
    description: >
      Stats + note WhoScored par joueur par match, identités normalisées.
      Traduit l'id d'équipe WhoScored vers le team_id canonique et rattache le
      match_id unifié via int_whoscored_match_index (même logique que
      int_whoscored_events). player_id reste l'id WhoScored (clé vers
      silver.stg_whoscored_players_ref). Source : silver.stg_whoscored_player_match.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: "Id canonique de l'équipe (converti depuis l'id WhoScored)"
      - name: player_id
        description: "Identifiant WhoScored du joueur (FK vers stg_whoscored_players_ref)"
        tests:
          - not_null
      - name: rating
        description: "Note WhoScored finale du joueur sur le match"
      - name: stats_json
        description: "Stats du joueur par minute (JSON brut) — totaux calculés plus tard"
      - name: shirt_no
        description: "Numéro de maillot du joueur."
      - name: position
        description: "Position WhoScored du joueur (ex. GK, DC, DR/DL, DMC/DML, MC/ML, AMR/AML, FW/FWL/FWR, Sub)."
      - name: is_first_eleven
        description: "Booléen : le joueur est titulaire."
      - name: is_man_of_the_match
        description: "Booléen : le joueur est l'homme du match."
      - name: height
        description: "Taille du joueur (cm)."
      - name: weight
        description: "Poids du joueur (kg)."
      - name: age
