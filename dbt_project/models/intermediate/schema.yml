version: 2

models:
  - name: backbone
    description: >
      Table pivot centrale — 1 ligne par équipe par match.
      Jointure de 7 tables silver.* produite par dbt en mode incremental.
      Schéma intermediate — consommée par les modèles gold.features_*.
    config:
      alias: backbone

    columns:

      # ── Identifiants ────────────────────────────────────────────────────────
      - name: match_id
        description: "Identifiant Understat du match — NULL si le match n'existe pas dans Understat"
        tests:
          - not_null:
              config:
                severity: warn
      - name: date
        description: "Date du match"
        tests:
          - not_null

      - name: team_id
        description: "Nom normalisé de l'équipe"
        tests:
          - not_null

      - name: opponent_id
        description: "Nom normalisé de l'adversaire"
        tests:
          - not_null

      - name: venue
        description: "Lieu du match du point de vue de l'équipe : Home ou Away"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home', 'Away', 'Neutral']

      - name: season
        description: "Saison au format YYYY-YYYY"
        tests:
          - not_null

      - name: league_source
        description: "Nom de la compétition source (ex: Premier League, Ligue 1)"
        tests:
          - not_null

      - name: comp_category
        description: "Catégorie de compétition : Big5, Cup, Europe"
        tests:
          - not_null

      - name: result_1n2
        description: "Résultat du point de vue de l'équipe : H (victoire), D (nul), A (défaite)"
        tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              config:
                severity: error
              arguments:
                values: ['H', 'D', 'A']

      - name: formation
        description: "Formation tactique de l'équipe (ex: 4-3-3)"

      # ── Résultats bruts ──────────────────────────────────────────────────────
      - name: gf
        description: "Buts marqués par l'équipe"
        tests:
          - not_null
          - is_positive

      - name: ga
        description: "Buts encaissés par l'équipe"
        tests:
          - not_null
          - is_positive

      - name: possession
        description: "Possession en pourcentage (castée depuis VARCHAR fbref_schedule)"
        tests:
          - is_positive

      # ── Gardien (fbref_keeper) ───────────────────────────────────────────────
      - name: shots_on_target_faced
        description: "Tirs cadrés subis par le gardien (sota)"
        tests:
          - is_positive

      - name: saves
        description: "Arrêts du gardien"
        tests:
          - is_positive

      - name: save_pct
        description: "Pourcentage d'arrêts (saves / shots_on_target_faced)"

      - name: clean_sheet
        description: "1 si aucun but encaissé, 0 sinon"
        tests:
          - is_positive

      # ── Tirs (fbref_shooting) ────────────────────────────────────────────────
      - name: shots_total
        description: "Total de tirs tentés"
        tests:
          - is_positive

      - name: shots_on_target
        description: "Tirs cadrés"
        tests:
          - is_positive

      - name: goals_per_shot
        description: "Buts par tir (efficacité offensive brute)"

      # ── Disciplinaire (fbref_misc) ───────────────────────────────────────────
      - name: yellow_cards
        description: "Cartons jaunes reçus"
        tests:
          - is_positive

      - name: second_yellow_cards
        description: "Deuxièmes cartons jaunes (expulsion indirecte)"
        tests:
          - is_positive

      - name: red_cards
        description: "Cartons rouges directs reçus"
        tests:
          - is_positive

      - name: fouls_committed
        description: "Fautes commises"
        tests:
          - is_positive

      - name: interceptions
        description: "Interceptions"
        tests:
          - is_positive

      - name: tackles_won
        description: "Tacles remportés"
        tests:
          - is_positive

      # ── xG et pressing (understat_stats) ────────────────────────────────────
      - name: np_xg
        description: "Expected goals sans pénalties du point de vue de l'équipe (Understat) — NULL si match hors Understat"
        tests:
          - is_positive

      - name: np_xg_conceded
        description: "Expected goals sans pénalties concédés — NULL si match hors Understat"
        tests:
          - is_positive

      - name: ppda
        description: "PPDA de l'équipe — passes adverses autorisées par action défensive (mesure le pressing)"
        tests:
          - is_positive

      - name: ppda_allowed
        description: "PPDA autorisé à l'adversaire — pressing subi"
        tests:
          - is_positive

      - name: np_xg_diff_match
        description: "Différentiel npxG du match (np_xg - np_xg_conceded) — peut être négatif"

      # ── WhoScored saison (whoscored_team_season) ─────────────────────────────
      - name: season_att_rating
        description: "Rating offensif WhoScored de la saison selon le venue (Home ou Away)"
        tests:
          - is_positive

      - name: season_def_rating
        description: "Rating défensif WhoScored de la saison selon le venue"
        tests:
          - is_positive

      - name: ws_dribbles_pg
        description: "Dribbles réussis par match selon le venue"
        tests:
          - is_positive

      - name: ws_fouled_pg
        description: "Fautes subies par match selon le venue"
        tests:
          - is_positive

      - name: ws_shots_ot_pg
        description: "Tirs cadrés par match selon le venue"
        tests:
          - is_positive

      # ── Cotes Pinnacle (odds) ────────────────────────────────────────────────
      - name: odds_pinnacle_team
        description: "Cote Pinnacle victoire de l'équipe (H si Home, A si Away)"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: odds_pinnacle_draw
        description: "Cote Pinnacle match nul"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: odds_pinnacle_opp
        description: "Cote Pinnacle victoire de l'adversaire"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: odds_avg_team
        description: "Cote moyenne marché victoire de l'équipe"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: odds_avg_draw
        description: "Cote moyenne marché match nul"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: odds_avg_opp
        description: "Cote moyenne marché victoire adversaire"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      # ── Probabilités implicites ──────────────────────────────────────────────
      - name: pinnacle_prob_team
        description: "Probabilité implicite Pinnacle victoire de l'équipe"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: pinnacle_prob_draw
        description: "Probabilité implicite Pinnacle match nul"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: pinnacle_prob_opp
        description: "Probabilité implicite Pinnacle victoire adversaire"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: market_prob_team
        description: "Probabilité implicite marché moyen victoire de l'équipe"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: market_prob_draw
        description: "Probabilité implicite marché moyen match nul"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: market_prob_opp
        description: "Probabilité implicite marché moyen victoire adversaire"
        tests:
          - is_valid_probability:
              config:
                severity: warn

  - name: events_qual
    description: >
      Éclatement des qualifiers de int_whoscored_events (via qualifiers_json) :
      1 ligne par (événement × qualifier). Base de tous les modèles WhoScored.
      Incrémentale. Les colonnes d'événement sont reprises telles quelles de
      int_whoscored_events ; qual_type_id/name/value sont la transformation (unnest).
    columns:
      # ── Colonnes héritées de int_whoscored_events (mêmes définitions) ──────────
      - name: match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index."
      - name: team_id
        description: "Id canonique de l'équipe de l'événement (converti depuis l'id WhoScored via int_whoscored_match_index)."
      - name: player_id
        description: "Identifiant WhoScored du joueur auteur de l'action. NULL possible sur certains événements."
      - name: event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
        tests:
          - not_null
      - name: minute
        description: "Minute de jeu brute (hors temps additionnel)."
      - name: second
        description: "Seconde dans la minute."
      - name: expanded_minute
        description: "Minute cumulée, temps additionnel inclus (ex. 45+2 → 47)."
      - name: period
        description: "Période : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match (FormationSet), 14 = fin de match (End)."
      - name: x
        description: "Position X de l'action sur le terrain (0-100, croissant vers le but adverse ; repère relatif à l'équipe)."
      - name: y
        description: "Position Y de l'action (0-100, largeur, 50 = axe central)."
      - name: end_x
        description: "Position X de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: end_y
        description: "Position Y de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: type_id
        description: "Type d'événement WhoScored (cf. docs/Event_type_definition.txt ; ex. 1 Pass, 3 TakeOn, 4 Foul, 13-16 tirs)."
        tests:
          - not_null
      - name: type_name
        description: "Libellé du type d'événement (Pass, TakeOn, Foul, Goal…)."
      - name: outcome_id
        description: "Résultat de l'action : 1 = réussi, 0 = raté."
      - name: is_touch
        description: "Booléen : le joueur a touché le ballon (flag WhoScored isTouch)."
      - name: is_shot
        description: "Booléen : l'événement est un tir (flag WhoScored isShot)."
      - name: row_num
        description: "Index de l'événement dans le flux du match (ordre chronologique)."
        tests:
          - not_null
      # ── Transformation propre à events_qual : éclatement du qualifiers_json ────
      - name: qual_type_id
        description: "Id du type de qualifier (cf. docs/Qualifier_type_definition.txt ; ex. 9 Penalty, 102 GoalMouthY, 233 OppositeRelatedEvent)."
      - name: qual_type_name
        description: "Libellé du qualifier (displayName WhoScored)."
      - name: qual_value
        description: "Valeur du qualifier (chaîne). NULL pour un qualifier-drapeau sans valeur."

  - name: player_match_stats
    description: >
      Agrégats WhoScored par joueur par match.
      Calculé depuis int_whoscored_events et events_qual.
      Structure en trois CTEs : base_agg (métriques générales),
      offensive_agg (passes, tirs, progressions),
      defensive_agg (tackles, interceptions, dégagements).
      Utilisé pour les squad features dans gold.features_whoscored.

    columns:
      - name: match_id
        description: "Identifiant du match (SHA1)"
        tests:
          - not_null
      - name: team_id
        description: "Identifiant WhoScored de l'équipe"
        tests:
          - not_null
      - name: player_id
        description: "Identifiant WhoScored du joueur"
        tests:
          - not_null
      - name: date
        description: "Date du match"
        tests:
          - not_null
      - name: season
        description: "Saison (format YYYY-YYYY)"
        tests:
          - not_null
      - name: league_source
        description: "Ligue source"
        tests:
          - not_null
      - name: n_touches
        description: "Touches de balle."
      - name: pct_z1_c1
        description: "Part des touches du joueur dans la case longueur z1 (x 0-20) × couloir c1 (y 0-20) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: pct_z1_c2
        description: "Part des touches du joueur dans la case longueur z1 (x 0-20) × couloir c2 (y 20-40) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: pct_z1_c3
