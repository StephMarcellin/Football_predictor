  - name: int_fbref_misc
    description: >
      Stats disciplinaires et défensives FBref (cartons, fautes, hors-jeux, centres,
      interceptions, tacles gagnés, penaltys obtenus/concédés, CSC) rematchées sur
      match_id + team_id. Alimente le bloc disciplinaire de backbone. Colonnes castées
      depuis le VARCHAR brut de silver.fbref_misc. Stats avancées (fls, fld, off, crosses,
      int, tklw) absentes avant 2014-2015 (~24 900 lignes NULL) ; faux zéros FBref
      neutralisés en NULL (bloc complet 616 lignes, sous-bloc int/tklw). pkwon/pkcon
      fournis par FBref uniquement de 2014-2015 à 2018-2019 (~78 % NULL).
    tests:
      # ── Grain de la table (1 ligne par équipe par match) ──
      # Historique A-001 : severity=warn tant que la jointure registry fan-outait (+249 lignes).
      # Jointure contrainte sur l'adversaire depuis la refonte → 0 doublon empirique → error.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - str_match_id
              - str_team_id
          config:
            severity: error
      # ── Contraintes disciplinaires dures : le 2e jaune est compté dans crdy et crdr ──
      # 0 violation empirique chacune (l'ancien GREATEST(crdy, crdy2) était donc inutile).
      - dbt_utils.expression_is_true:
          arguments:
            expression: "int_crdy2 <= int_crdr"
          config:
            severity: error
      - dbt_utils.expression_is_true:
          arguments:
            expression: "int_crdy2 <= int_crdy"
          config:
            severity: error
      # ── Plafond de plausibilité disciplinaire (Cat D) ──
      # Empirique max crdy + crdr + crdy2 = 13. Marge à 15.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "int_crdy + int_crdr + int_crdy2 <= 15"
          config:
            severity: warn
      # ── CSC ≤ buts encaissés ──
      # 1 ligne empirique : Bastia-Nantes 10/08/2013 (0-0 avec og = 1), même anomalie côté
      # shooting (gls > gf). Pas de clip (l'ancien LEAST(og, ga) masquait l'erreur) → warn.
      # Identité croisée vérifiée : og équipe = gf - gls adverse (shooting) dans 99.99 % des cas.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(int_og IS NULL) OR (int_og <= int_ga)"
          config:
            severity: warn
      # ── Cohérence result vs score ──
      # 2 lignes empiriques : Bastia-Lyon 16/04/2017 (match arrêté, victoire attribuée). Attendu → warn.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (str_result = 'W' AND int_gf > int_ga) OR
              (str_result = 'D' AND int_gf = int_ga) OR
              (str_result = 'L' AND int_gf < int_ga)
          config:
            severity: warn
      # ── Outliers de score (Cat D) : signalés, jamais filtrés ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: "int_gf <= 12 AND int_ga <= 12"
          config:
            severity: warn
