  - name: int_whoscored_formations
    description: >
      Timeline tactique par équipe par match, identités normalisées (team_id
      canonique + match_id unifié via int_whoscored_match_index).
      formation_id reste la clé vers silver.stg_whoscored_formations_ref.
      Source : silver.stg_whoscored_formations.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: "Id canonique de l'équipe (converti depuis l'id WhoScored)"
      - name: formation_id
        description: "Identifiant de la formation (FK vers stg_whoscored_formations_ref)"
      - name: formation_seq
        description: "Index de la formation dans la liste de l'équipe (0, 1, 2...)"
      - name: start_minute
        description: "Minute étendue de début de la formation"
      - name: end_minute
        description: "Minute étendue de fin de la formation"
      - name: captain_player_id
        description: "Identifiant du capitaine sur cette période"
      - name: player_ids
        description: "JSON — ordre des joueurs sur la grille tactique"
      - name: formation_positions
        description: "JSON — coordonnées vertical/horizontal de chaque poste"
      - name: period
        description: "Période du match où s'applique la formation : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match (FormationSet), 14 = fin de match (End)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - team_id
            - formation_seq

  - name: int_whoscored_team_match
    description: >
      Stats d'équipe officielles WhoScored par match, identités normalisées.
      Conserve stats_json brut (35 métriques par minute) ; extraction des totaux
      plus tard. Source : silver.stg_whoscored_team_match.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: "Id canonique de l'équipe (converti depuis l'id WhoScored)"
      - name: stats_json
        description: "Stats équipe par minute (JSON brut) — totaux calculés plus tard"
      - name: field
        description: "Côté : home ou away"
      - name: manager_name
        description: "Nom de l'entraîneur"
      - name: average_age
        description: "Âge moyen de l'équipe"
      - name: country_name
        description: "Nom du pays de l'équipe (ex. France, England, Italy, Germany, Wales)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - team_id

  - name: int_whoscored_players
    description: >
      Dimension joueur par saison et par équipe — grain (player_id, season,
      team_id canonique). Un transfert en cours de saison = plusieurs lignes.
      Profil courant height/weight (âge exclu car WhoScored renvoie l'âge du
      scrape, pas du match). Sources : int_whoscored_player_match,
      int_whoscored_match_index, silver.stg_whoscored_players_ref.
    columns:
      - name: player_id
        description: "Identifiant WhoScored du joueur"
        tests:
          - not_null
      - name: season
        description: "Saison (rattachée via le match)"
      - name: team_id
        description: "Id canonique de l'équipe"
      - name: player_name
        description: "Nom du joueur (depuis la table de référence)"
      - name: height
        description: "Taille du joueur (cm, depuis la table de référence)"
      - name: weight
        description: "Poids du joueur (kg, depuis la table de référence)"
      - name: n_matchs
        description: "Nombre de matchs joués pour cette équipe cette saison"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_id
            - season
            - team_id

  - name: int_whoscored_lineup
    description: >
      Composition positionnelle par période de formation — grain (match × équipe
      × formation_seq × joueur), une ligne par titulaire (slot 1..11). La position
      est récupérée via le slot du joueur (formation_positions[slot]), pas par
      alignement d'index : robuste aux trous de slot (carton rouge). Identités
      normalisées (team_id canonique + match_id unifié via int_whoscored_match_index).
      Source : silver.stg_whoscored_formations (prérequis : formation_slots rempli).
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: "Id canonique de l'équipe (converti depuis l'id WhoScored)"
      - name: player_id
        description: "Identifiant WhoScored du joueur titulaire"
        tests:
          - not_null
      - name: slot
        description: "Slot de formation 1..11 (1 = gardien)"
      - name: grid_vertical
        description: "Coordonnée verticale sur la grille tactique (0 = ligne de but propre)"
      - name: grid_horizontal
        description: "Coordonnée horizontale sur la grille tactique (5 = axe central)"
      - name: is_captain
        description: "Vrai si ce joueur est le capitaine sur cette période"
      - name: formation_seq
        description: "Numéro de séquence de la formation dans le match (chaque changement de formation incrémente la séquence)."
      - name: formation_id
        description: "Identifiant WhoScored du schéma tactique (formation, ex. 442, 433)."
      - name: period
        description: "Période du match de la séquence : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match, 14 = fin de match."
      - name: start_minute
        description: "Minute de début de la séquence de formation."
      - name: end_minute
        description: "Minute de fin de la séquence de formation."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - team_id
            - formation_seq
            - player_id

  - name: int_shot_placement
    description: >
      Placement de tir au grain « un tir » — base du Post-Shot xG (xGOT).
      Tirs (types 13/14/15/16) issus de int_event_enriched, avec la géométrie du
      placement dans le cadre du but (goal_mouth_y/z) dérivée pour les tirs cadrés :
      zone 3×3, écart au centre, hauteur, distance normalisée à la lucarne. Le xGOT
      entraîné reste en aval ; ce modèle expose les entrées + un xG pré-tir proxy.
      Sources : int_event_enriched, event_values.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1). Clé de match commune à tout le projet."
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: >
          Id canonique de l'équipe qui tire (converti depuis l'id WhoScored).
          CAS CSC : pour un but contre son camp, team_id est l'équipe QUI CONCÈDE
          (celle du joueur marquant c.s.c.), pas celle qui profite du but.
      - name: player_id
        description: "Identifiant WhoScored du joueur qui tire."
        tests:
          - not_null
      - name: event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
      - name: row_num
        description: "Index de l'événement dans le flux du match (ordre chronologique). Unique par match avec match_id."
      - name: expanded_minute
        description: "Minute de jeu du tir, temps additionnel inclus (ex. 45+2 → 47)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: scraped_at
        description: "Horodatage ISO du scrape de ce match (sert au filtre incrémental)."
      - name: type_id
        description: "Type d'événement WhoScored : 13 MissedShots, 14 ShotOnPost, 15 SavedShot, 16 Goal."
      - name: type_name
        description: "Libellé du type d'événement (MissedShots / ShotOnPost / SavedShot / Goal)."
      - name: x
        description: "Position X de la frappe sur le terrain, échelle 0-100 (x croissant vers le but adverse)."
      - name: y
        description: "Position Y de la frappe sur le terrain, échelle 0-100 (largeur, 50 = axe central)."
      - name: goal_mouth_y
        description: >
          Position horizontale (largeur) où le tir franchit ou atteint la ligne de but
          (qualifier 102 GoalMouthY, définition Opta). Cadre : poteaux à Y≈45.2 et 54.8,
          centre 50. NULL si non renseigné à la source.
      - name: goal_mouth_z
        description: >
          Hauteur à laquelle le tir franchit/atteint la ligne de but (qualifier 103
          GoalMouthZ). Barre à Z≈38. NULL si non renseigné à la source.
      - name: blocked_x
        description: >
          Coordonnée X (repère de l'équipe qui tire, 0-100) du point où le tir est STOPPÉ
          (qualifier 146 BlockedX). Pour un tir arrêté, c'est la position de l'arrêt du
          gardien (vérifié sur exemple : blocked_x ≈ position du Save adverse converti).
          Peut aussi marquer un contre défenseur si le qualifier 82 Blocked est présent.
          Renseigné seulement pour une partie des tirs.
      - name: blocked_y
        description: >
          Coordonnée Y (repère de l'équipe qui tire, 0-100) du point où le tir est stoppé
          (qualifier 147 BlockedY). Même sémantique que blocked_x.
      - name: is_goal
        description: >
          Booléen : événement de type but (type_id = 16). ⚠️ Inclut 306 buts contre
          son camp (CSC) rattachés à l'équipe qui CONCÈDE, pas à celle qui marque.
          Pour « but marqué par l'équipe qui tire », exclure les CSC via is_own_goal.
          À filtrer aussi pour le xGOT (un CSC n'est pas un tir cadré normal).
      - name: is_own_goal
        description: >
          Booléen : le but est un but contre son camp (CSC). TRUE pour les 306 CSC
          (type 16), sinon FALSE/NULL. Combiné à is_goal, permet d'isoler les vrais
          buts de l'équipe qui tire. Propagé depuis int_event_enriched.
      - name: is_on_target
        description: "Booléen : tir cadré (SavedShot ou Goal, type 15/16). Seuls les tirs cadrés portent les dérivés de placement."
      - name: pre_shot_xg_proxy
        description: >
          Proxy de xG pré-tir = chance_creation issu de event_values (baseline du xGOT).
          Non calibré : sert d'entrée/repère, pas de probabilité exacte.
      - name: offset_center
        description: "Écart horizontal au centre du but : ABS(goal_mouth_y - 50). Tirs cadrés uniquement, NULL sinon."
      - name: height
        description: "Hauteur du tir dans le but (= goal_mouth_z). Tirs cadrés uniquement, NULL sinon."
      - name: placement_col
        description: "Colonne de la grille 3×3 du cadre : left / center / right (selon goal_mouth_y). Tirs cadrés uniquement."
      - name: placement_row
        description: "Rangée de la grille 3×3 : low / mid / high (selon goal_mouth_z). Tirs cadrés uniquement."
      - name: placement_zone
        description: "Zone 3×3 du cadre (rangée_colonne, ex: high_left = lucarne gauche). Tirs cadrés uniquement, NULL sinon."
      - name: corner_dist
        description: "Distance normalisée à la lucarne la plus proche (0 = pleine lucarne, plus grand = plus central/bas). Tirs cadrés uniquement."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: int_whoscored_lineup_agg
    description: >
      Features positionnelles au grain joueur×match, agrégées depuis
      int_whoscored_lineup : position moyenne pondérée par les minutes, slot
      principal, capitaine, nombre de périodes tactiques. Couverture liée à
      formation_slots (se remplit avec le load des archives).
      Source : int_whoscored_lineup.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: player_id
        description: "Identifiant WhoScored du joueur"
        tests:
          - not_null
      - name: avg_vertical
        description: "Position verticale moyenne (0 = ligne de but propre, ~10 = attaque)"
      - name: avg_horizontal
        description: "Position horizontale moyenne (5 = axe central)"
      - name: primary_slot
        description: "Slot de formation dominant (1..11, 1 = gardien)"
      - name: team_id
        description: "Id canonique de l'équipe."
      - name: is_captain
        description: "Booléen : le joueur a été capitaine sur au moins une période."
      - name: n_formation_periods
        description: "Nombre de périodes tactiques distinctes du joueur dans le match (proxy de repositionnement)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - team_id
            - player_id

  - name: int_penalties
    description: >
      Penaltys au grain « un penalty tiré ». Pivot = la frappe (types 13/14/15/16
      portant qual 9) : tireur, résultat (marqué/arrêté/poteau/hors-cadre) et
      placement (goal_mouth_*). Rattachés en LEFT JOIN : PenaltyFaced (type 58, même
      instant) → équipe qui défend + gardien ; le foul en double (type 4 + qual 9)
      → joueur qui obtient / concède, dans une fenêtre de 300 s avant la frappe.
      Sources : int_event_enriched, int_whoscored_events, events_qual.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: attacking_team_id
        description: "Id canonique de l'équipe qui tire le penalty"
        tests:
          - not_null
      - name: taker_player_id
        description: "Joueur qui tire le penalty"
        tests:
          - not_null
      - name: defending_team_id
        description: "Équipe qui défend (via type 58). NULL si pas de PenaltyFaced apparié (~0,1 %)."
      - name: gk_player_id
        description: "Gardien face au penalty (via type 58)"
      - name: player_conceded
        description: "Joueur ayant concédé la faute (via qual 233). Rattaché à 100 %."
      - name: player_drew
        description: "Joueur ayant obtenu le penalty. Souvent NULL (limite données WhoScored, ~23 %)."
      - name: result_label
        description: "scored | saved | post | off_target"
        tests:
          - accepted_values:
              values: ['scored', 'saved', 'post', 'off_target']
      - name: row_num
        description: "row_num du tir du penalty. Avec match_id, clé unique."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: scraped_at
        description: "Horodatage ISO du scrape."
      - name: expanded_minute
        description: "Minute (expanded_minute) du penalty."
      - name: is_goal
        description: "Booléen : penalty marqué."
      - name: is_saved
        description: "Booléen : penalty arrêté par le gardien."
      - name: is_post
        description: "Booléen : penalty sur le poteau/la barre."
      - name: is_off_target
        description: "Booléen : penalty non cadré."
      - name: goal_mouth_y
        description: "Position horizontale du penalty dans le cadre du but (qualifier 102)."
      - name: goal_mouth_z
        description: "Hauteur du penalty dans le cadre (qualifier 103)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: int_fouls_drawn
    description: >
      Fautes subies (coups francs obtenus) au grain « une faute subie » : côté
      outcome_id=1 des events Foul (type 4). Rattache le fautif via le qual 233
      (OppositeRelatedEvent, déterministe 100 %), la localisation (x/y, zone), le
      tiers offensif (x > 66.7) et si la faute donne un penalty. Le joueur qui subit
      est NULL ~5 % (limite source). Source : int_whoscored_events, events_qual.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: drawing_team_id
        description: "Équipe qui subit la faute / obtient le coup franc"
        tests:
          - not_null
      - name: drawer_player_id
        description: "Joueur qui subit la faute. NULL ~5 % (non renseigné à la source)."
      - name: committed_by_player_id
        description: "Fautif, rattaché via qual 233. NULL <1 %."
      - name: is_attacking_third
        description: "Faute subie dans le tiers offensif (x > 66.7) — coup franc dangereux. NULL si x absent."
      - name: leads_to_penalty
        description: "Vrai si la faute donne un penalty (qual 9 présent)"
      - name: row_num
        description: "row_num de la faute subie. Avec match_id, clé unique."
      - name: event_id
        description: "event_id WhoScored (scopé match+équipe)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: scraped_at
        description: "Horodatage ISO du scrape."
      - name: expanded_minute
        description: "Minute (expanded_minute) de la faute."
      - name: x
        description: "Position X de la faute (0-100)."
      - name: y
        description: "Position Y de la faute (0-100)."
      - name: foul_zone
        description: "Zone de la faute (qualifiers Opta) : Left / Center / Right = couloir latéral (gauche / axe / droite) ; Back = zone défensive/arrière. NULL si indéterminé."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: int_defensive_blocks
    description: >
      Contres défensifs au grain « un contre », avec le défenseur qui bloque.
      Basé sur l'event type 74 BlockedPass (bloqueur toujours nommé), rattaché à la
      passe bloquée via le qual 233 (99,4 %). Ce sont des contres de PASSE ; les
      contres de tir n'ont pas de bloqueur nommé chez Opta et sont hors périmètre.
      Le join qual 233 contraint l'équipe adverse (event_id scopé par équipe).
      Source : int_whoscored_events, events_qual.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: blocking_team_id
        description: "Équipe qui bloque (défend)"
        tests:
          - not_null
      - name: blocker_player_id
        description: "Défenseur qui bloque (type 74). Toujours renseigné."
        tests:
          - not_null
      - name: blocked_team_id
        description: "Équipe dont la passe est bloquée (adverse)"
      - name: blocked_player_id
        description: "Joueur dont la passe/action est bloquée (via qual 233). NULL <1 %."
      - name: blocked_type
        description: "Type d'action bloquée (surtout Pass)"
      - name: row_num
        description: "row_num du contre. Avec match_id, clé unique."
      - name: event_id
        description: "event_id WhoScored (scopé match+équipe)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: scraped_at
        description: "Horodatage ISO du scrape."
      - name: expanded_minute
        description: "Minute (expanded_minute) du contre."
      - name: block_x
        description: "Position X du contre (0-100)."
      - name: block_y
        description: "Position Y du contre (0-100)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: int_shot_creating_actions
    description: >
      Actions créatrices de tir (SCA) et de but (GCA), standard FBref/StatsBomb.
      Une ligne par crédit = (tir, sca_order 1|2) : les 2 actions offensives de
      l'équipe qui tire, dans la même chaîne de possession, juste avant le tir
      (Pass, TakeOn, faute obtenue, tir/rebond). is_gca vrai si le tir est un but.
      Source : player_possession_chains.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: sca_order
        description: "1 = action juste avant le tir, 2 = l'action précédente"
      - name: attacking_team_id
        description: "Équipe qui tire"
        tests:
          - not_null
      - name: creator_player_id
        description: "Joueur crédité de l'action créatrice"
        tests:
          - not_null
      - name: action_type
        description: "Type de l'action créatrice (Pass, TakeOn, tir…)"
      - name: is_gca
        description: "Vrai si le tir est un but → ce crédit compte aussi en GCA"
      - name: shot_row_num
        description: "row_num du tir crédité."
      - name: shot_event_id
        description: "event_id du tir."
      - name: chain_id
        description: "Identifiant de la chaîne de possession (propagé de player_possession_chains)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: scraped_at
        description: "Horodatage ISO du scrape."
      - name: shot_taker_player_id
        description: "Joueur qui tire."
      - name: action_row_num
        description: "row_num de l'action créatrice."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - shot_row_num
            - sca_order

  - name: int_progressive_carries
    description: >
      Conduites (dribbles) au grain « un dribble réussi » : TakeOn (type 3) réussis
      côté offensif (outcome 1 + qual 286). WhoScored n'a pas d'event carry ; le
      TakeOn est la seule conduite balle au pied enregistrée. Progression mesurée du
      dribble jusqu'à la touche suivante du joueur dans la même chaîne, en mètres
      (réduction de distance au but). is_progressive = gain ≥ 5 m.
      Source : player_possession_chains, events_qual.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: "Équipe du dribbleur"
        tests:
          - not_null
      - name: player_id
        description: "Joueur qui réussit le dribble"
        tests:
          - not_null
      - name: progress_m
        description: "Gain de distance vers le but adverse (m). NULL si pas de touche suivante en chaîne."
      - name: is_progressive
        description: "Vrai si la conduite gagne ≥ 5 m vers le but"
      - name: row_num
        description: "row_num du dribble (TakeOn). Avec match_id, clé unique."
      - name: event_id
        description: "event_id WhoScored du dribble (scopé match+équipe)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: scraped_at
        description: "Horodatage ISO du scrape."
      - name: expanded_minute
        description: "Minute (expanded_minute) du dribble."
      - name: dribble_x
        description: "Position X du dribble (0-100)."
      - name: dribble_y
        description: "Position Y du dribble (0-100)."
      - name: next_x
        description: "Position X de la touche suivante du joueur (fin de la conduite)."
      - name: next_y
        description: "Position Y de la touche suivante."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: int_substitutions
    description: >
      Changements au grain « un remplacement » : joueur qui sort (SubstitutionOff,
      type 18) apparié à celui qui entre (SubstitutionOn, type 19) par rang au sein
      du groupe (match, équipe, minute, seconde) — gère les changements simultanés.
      Croisé avec related_player_id (présent 27 %) : concordance 99,8 %. sub_number =
      k-ième changement de l'équipe. Source : int_whoscored_events.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: "Équipe qui effectue le changement"
        tests:
          - not_null
      - name: player_off
        description: "Joueur qui sort"
        tests:
          - not_null
      - name: player_on
        description: "Joueur qui entre. NULL si sortie sans remplaçant (ex. carton rouge)."
      - name: expanded_minute
        description: "Minute du changement (temps additionnel inclus)"
      - name: sub_number
        description: "k-ième changement de l'équipe dans le match"
      - name: off_row_num
        description: "row_num de l'événement de sortie (SubstitutionOff). Clé avec match_id."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: scraped_at
        description: "Horodatage ISO du scrape."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - off_row_num

  - name: int_xt_actions
    description: >
      Actions atomiques pour l'expected threat (xT), affectées à la grille fine
      16×12. Grain : une action de possession (déplacement, tir OU perte de balle).
      L'affectation (x,y)→case est définie UNIQUEMENT ici (col/row) et relue telle
      quelle par xt_grid.py et int_xt_contributions. Déplacements = passes réussies
      (player_passes_raw) + dribbles TakeOn réussis. Tirs = int_shot_placement, hors
      CSC. Pertes = fin de possession (passe/dribble ratés, contrôle manqué,
      Dispossessed, OffsidePass) depuis int_event_enriched.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
        tests:
          - not_null
      - name: row_num
        description: "Index de l'événement dans le match (ordre chronologique)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: team_id
        description: "Id canonique de l'équipe de l'action."
      - name: player_id
        description: "Identifiant WhoScored du joueur (passeur, dribbleur ou tireur)."
      - name: action_kind
        description: "Type d'action : 'move' (passe/dribble réussi, avec destination), 'shot' (tir), ou 'turnover' (perte de balle, sans destination)."
      - name: is_shot
        description: "Booléen : l'action est un tir."
      - name: is_goal
        description: "Booléen : le tir est un but (renseigné pour les tirs ; NULL pour déplacements et pertes)."
      - name: col_from
        description: "Colonne (0-15) de la case de DÉPART sur la grille 16×12 (0 = son but, 15 = but adverse). = GREATEST(0, LEAST(15, INT(x/100·16)))."
      - name: row_from
        description: "Ligne (0-11) de la case de départ (largeur, ~6 = axe central). = GREATEST(0, LEAST(11, INT(y/100·12)))."
      - name: col_to
        description: "Colonne (0-15) de la case d'ARRIVÉE (déplacements). NULL pour les tirs et les dribbles sans touche suivante."
      - name: row_to
        description: "Ligne (0-11) de la case d'arrivée (déplacements). NULL pour les tirs et les dribbles sans touche suivante."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: int_xt_contributions
    description: >
      Contributions Expected Threat (xT) : xT ajouté par déplacement. Grain :
      1 ligne par déplacement (int_xt_actions action_kind='move' avec destination).
      xT_ajouté = xT(case d'arrivée) − xT(case de départ), attribué au joueur/équipe ;
      positif = progression vers le but adverse. Grille lue depuis
      machine_learning.xt_grid (étalon global). Matérialisé en table.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
        tests:
          - not_null
      - name: row_num
        description: "Index de l'événement dans le match. Avec match_id, clé unique."
      - name: season
        description: "Saison du match."
      - name: league_source
        description: "Championnat / source des données."
      - name: team_id
        description: "Équipe qui effectue le déplacement."
      - name: player_id
        description: "Joueur qui effectue le déplacement (passeur ou dribbleur)."
      - name: col_from
        description: "Colonne (0-15) de la case de départ."
      - name: row_from
        description: "Ligne (0-11) de la case de départ."
      - name: col_to
        description: "Colonne (0-15) de la case d'arrivée."
      - name: row_to
        description: "Ligne (0-11) de la case d'arrivée."
      - name: xt_from
        description: "Valeur xT de la case de départ (machine_learning.xt_grid)."
      - name: xt_to
        description: "Valeur xT de la case d'arrivée (machine_learning.xt_grid)."
      - name: xt_added
        description: "xT ajouté = xt_to − xt_from. Positif = progression vers le but."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num
