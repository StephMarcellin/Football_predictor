  # CHAÎNE ÉVÉNEMENTIELLE — enrichissement et valorisation par action
  # ════════════════════════════════════════════════════════════════════════════

  - name: int_event_enriched
    description: >
      Événements WhoScored enrichis d'un pivot des qualifiers utiles, notamment
      la hiérarchie chance_creation (leading_to_goal, intentional_assist,
      big_chance_created, key_pass, shot_assist...). Table socle de event_values,
      player_possession_chains, player_network_duels et player_zone_transitions.
      Incrémentale sur scraped_at. Filtre : player_id IS NOT NULL.
    columns:
      # ── Héritées de int_whoscored_events (mêmes définitions) ───────────────────
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index."
      - name: str_team_id
        description: "Id canonique de l'équipe de l'événement (converti depuis l'id WhoScored via int_whoscored_match_index)."
      - name: str_player_id
        description: "Identifiant WhoScored du joueur auteur de l'action. (Ici jamais NULL : la table filtre player_id IS NOT NULL.)"
      - name: str_event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
      - name: int_row_num
        description: "Index de l'événement dans le flux du match (ordre chronologique)."
      - name: int_expanded_minute
        description: "Minute cumulée, temps additionnel inclus (ex. 45+2 → 47)."
      - name: int_second
        description: "Seconde dans la minute."
      - name: int_period
        description: "Période : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match (FormationSet), 14 = fin de match (End)."
      - name: str_type_id
        description: "Type d'événement WhoScored (cf. docs/Event_type_definition.txt ; ex. 1 Pass, 3 TakeOn, 4 Foul, 13-16 tirs)."
      - name: str_type_name
        description: "Libellé du type d'événement (Pass, TakeOn, Foul, Goal…)."
      - name: str_outcome_id
        description: "Résultat de l'action : 1 = réussi, 0 = raté."
      - name: bool_is_shot
        description: "Booléen : l'événement est un tir (flag WhoScored isShot)."
      - name: bool_is_touch
        description: "Booléen : le joueur a touché le ballon (flag WhoScored isTouch)."
      - name: dec_x
        description: "Position X de l'action sur le terrain (0-100, croissant vers le but adverse ; repère relatif à l'équipe)."
      - name: dec_y
        description: "Position Y de l'action (0-100, largeur, 50 = axe central)."
      - name: dec_end_x
        description: "Position X de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: dec_end_y
        description: "Position Y de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: bool_is_own_goal
        description: "Booléen : but contre son camp (CSC)."
      - name: str_related_event_id
        description: "Champ WhoScored relatedEventId. Souvent NULL — le lien réel entre events miroirs passe par le qualifier 233."
      - name: str_related_player_id
        description: "Champ WhoScored relatedPlayerId. Souvent NULL."
      - name: str_card_type
        description: "Type de carton : Yellow / Red / SecondYellow. NULL hors événements Card."
      - name: dec_goal_mouth_y
        description: >
          Position horizontale où le tir atteint la ligne de but (qualifier 102 GoalMouthY).
          Cadre : poteaux à Y≈45.2 et 54.8, centre 50. NULL hors tirs / non renseigné.
      - name: dec_goal_mouth_z
        description: "Hauteur où le tir atteint la ligne de but (qualifier 103 GoalMouthZ). Barre à Z≈38. NULL hors tirs / non renseigné."
      - name: dec_blocked_x
        description: "Coordonnée X (repère équipe, 0-100) du point où le tir est stoppé (qualifier 146 BlockedX)."
      - name: dec_blocked_y
        description: "Coordonnée Y (repère équipe, 0-100) du point où le tir est stoppé (qualifier 147 BlockedY)."
      - name: str_season
        description: "Saison du match (ex. 2023-2024)."
      - name: str_league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: dt_scraped_at
        description: "Horodatage ISO du scrape du match."
      # ── Héritée de int_whoscored_match_index ──────────────────────────────────
      - name: dt_match_date
        description: "Date du match (rattachée via int_whoscored_match_index)."
      # ── Transformation : flags de qualifiers pivotés (0/1) ────────────────────
      - name: int_is_leading_to_goal
        description: "Flag (0/1) : l'action mène à un but (qualifier 170 LeadingToGoal)."
      - name: int_is_intentional_goal_assist
        description: "Flag (0/1) : passe décisive intentionnelle (qualifier 11111 IntentionalGoalAssist)."
      - name: int_is_intentional_assist
        description: "Flag (0/1) : passe intentionnelle vers une occasion (qualifier 154 IntentionalAssist)."
      - name: int_is_big_chance_created
        description: "Flag (0/1) : grosse occasion créée (qualifier 11112 BigChanceCreated)."
      - name: int_is_key_pass
        description: "Flag (0/1) : passe clé — mène à un tir (qualifier 11113 KeyPass)."
      - name: int_is_shot_assist
        description: "Flag (0/1) : passe précédant directement un tir (qualifier 210 ShotAssist)."
      - name: int_is_leading_to_attempt
        description: "Flag (0/1) : l'action mène à une tentative de tir (qualifier 169 LeadingToAttempt)."
      - name: int_has_defensive_qual
        description: "Flag (0/1) : l'action porte le qualifier 285 Defensive (côté défensif d'un duel)."
      - name: int_has_offensive_qual
