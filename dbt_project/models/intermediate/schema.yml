  - name: int_whoscored_lineup
    description: >
      Composition positionnelle par période de formation — grain (match × équipe
      × formation_seq × joueur), une ligne par titulaire (slot 1..11). La position
      est récupérée via le slot du joueur (formation_positions[slot]), pas par
      alignement d'index : robuste aux trous de slot (carton rouge). Identités
      normalisées (team_id canonique + match_id unifié via int_whoscored_match_index).
      Source : silver.stg_whoscored_formations (prérequis : formation_slots rempli).
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: str_team_id
        description: "Id canonique de l'équipe (converti depuis l'id WhoScored)"
      - name: str_player_id
        description: "Identifiant WhoScored du joueur titulaire"
        tests:
          - not_null
      - name: int_slot
        description: "Slot de formation 1..11 (1 = gardien)"
      - name: dec_grid_vertical
        description: "Coordonnée verticale sur la grille tactique (0 = ligne de but propre)"
      - name: dec_grid_horizontal
        description: "Coordonnée horizontale sur la grille tactique (5 = axe central)"
      - name: bool_is_captain
        description: "Vrai si ce joueur est le capitaine sur cette période"
      - name: int_formation_seq
        description: "Numéro de séquence de la formation dans le match (chaque changement de formation incrémente la séquence)."
      - name: str_formation_id
        description: "Identifiant WhoScored du schéma tactique (formation, ex. 442, 433)."
      - name: int_period
        description: "Période du match de la séquence : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match, 14 = fin de match."
      - name: int_start_minute
        description: "Minute de début de la séquence de formation."
      - name: int_end_minute
        description: "Minute de fin de la séquence de formation."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - str_team_id
            - int_formation_seq
            - str_player_id

  - name: int_shot_placement
    description: >
      Placement de tir au grain « un tir » — base du Post-Shot xG (xGOT).
      Tirs (types 13/14/15/16) issus de int_event_enriched, avec la géométrie du
      placement dans le cadre du but (goal_mouth_y/z) dérivée pour les tirs cadrés :
      zone 3×3, écart au centre, hauteur, distance normalisée à la lucarne. Le xGOT
      entraîné reste en aval ; ce modèle expose les entrées + un xG pré-tir proxy.
      Sources : int_event_enriched, event_values.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1). Clé de match commune à tout le projet."
        tests:
          - not_null:
              config:
                severity: warn
      - name: str_team_id
        description: >
          Id canonique de l'équipe qui tire (converti depuis l'id WhoScored).
          CAS CSC : pour un but contre son camp, team_id est l'équipe QUI CONCÈDE
          (celle du joueur marquant c.s.c.), pas celle qui profite du but.
      - name: str_player_id
        description: "Identifiant WhoScored du joueur qui tire."
        tests:
          - not_null
      - name: str_event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
      - name: int_row_num
        description: "Index de l'événement dans le flux du match (ordre chronologique). Unique par match avec match_id."
      - name: int_expanded_minute
        description: "Minute de jeu du tir, temps additionnel inclus (ex. 45+2 → 47)."
      - name: str_season
        description: "Saison du match (ex. 2023-2024)."
      - name: str_league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: dt_scraped_at
        description: "Horodatage ISO du scrape de ce match (sert au filtre incrémental)."
      - name: str_type_id
        description: "Type d'événement WhoScored : 13 MissedShots, 14 ShotOnPost, 15 SavedShot, 16 Goal."
      - name: str_type_name
        description: "Libellé du type d'événement (MissedShots / ShotOnPost / SavedShot / Goal)."
      - name: dec_x
        description: "Position X de la frappe sur le terrain, échelle 0-100 (x croissant vers le but adverse)."
      - name: dec_y
        description: "Position Y de la frappe sur le terrain, échelle 0-100 (largeur, 50 = axe central)."
      - name: dec_goal_mouth_y
        description: >
          Position horizontale (largeur) où le tir franchit ou atteint la ligne de but
          (qualifier 102 GoalMouthY, définition Opta). Cadre : poteaux à Y≈45.2 et 54.8,
          centre 50. NULL si non renseigné à la source.
      - name: dec_goal_mouth_z
        description: >
          Hauteur à laquelle le tir franchit/atteint la ligne de but (qualifier 103
          GoalMouthZ). Barre à Z≈38. NULL si non renseigné à la source.
      - name: dec_blocked_x
        description: >
          Coordonnée X (repère de l'équipe qui tire, 0-100) du point où le tir est STOPPÉ
          (qualifier 146 BlockedX). Pour un tir arrêté, c'est la position de l'arrêt du
          gardien (vérifié sur exemple : blocked_x ≈ position du Save adverse converti).
          Peut aussi marquer un contre défenseur si le qualifier 82 Blocked est présent.
          Renseigné seulement pour une partie des tirs.
      - name: dec_blocked_y
        description: >
          Coordonnée Y (repère de l'équipe qui tire, 0-100) du point où le tir est stoppé
          (qualifier 147 BlockedY). Même sémantique que blocked_x.
      - name: bool_is_goal
        description: >
          Booléen : événement de type but (type_id = 16). ⚠️ Inclut 306 buts contre
          son camp (CSC) rattachés à l'équipe qui CONCÈDE, pas à celle qui marque.
          Pour « but marqué par l'équipe qui tire », exclure les CSC via is_own_goal.
          À filtrer aussi pour le xGOT (un CSC n'est pas un tir cadré normal).
      - name: bool_is_own_goal
        description: >
          Booléen : le but est un but contre son camp (CSC). TRUE pour les 306 CSC
          (type 16), sinon FALSE/NULL. Combiné à is_goal, permet d'isoler les vrais
          buts de l'équipe qui tire. Propagé depuis int_event_enriched.
      - name: bool_is_on_target
        description: "Booléen : tir cadré (SavedShot ou Goal, type 15/16). Seuls les tirs cadrés portent les dérivés de placement."
      - name: dec_pre_shot_xg_proxy
        description: >
          Proxy de xG pré-tir = chance_creation issu de event_values (baseline du xGOT).
          Non calibré : sert d'entrée/repère, pas de probabilité exacte.
      - name: dec_offset_center
        description: "Écart horizontal au centre du but : ABS(goal_mouth_y - 50). Tirs cadrés uniquement, NULL sinon."
      - name: dec_height
        description: "Hauteur du tir dans le but (= goal_mouth_z). Tirs cadrés uniquement, NULL sinon."
      - name: str_placement_col
        description: "Colonne de la grille 3×3 du cadre : left / center / right (selon goal_mouth_y). Tirs cadrés uniquement."
      - name: str_placement_row
        description: "Rangée de la grille 3×3 : low / mid / high (selon goal_mouth_z). Tirs cadrés uniquement."
      - name: str_placement_zone
        description: "Zone 3×3 du cadre (rangée_colonne, ex: high_left = lucarne gauche). Tirs cadrés uniquement, NULL sinon."
      - name: dec_corner_dist
        description: "Distance normalisée à la lucarne la plus proche (0 = pleine lucarne, plus grand = plus central/bas). Tirs cadrés uniquement."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - int_row_num

  - name: int_whoscored_lineup_agg
    description: >
      Features positionnelles au grain joueur×match, agrégées depuis
      int_whoscored_lineup : position moyenne pondérée par les minutes, slot
      principal, capitaine, nombre de périodes tactiques. Couverture liée à
      formation_slots (se remplit avec le load des archives).
      Source : int_whoscored_lineup.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: str_player_id
        description: "Identifiant WhoScored du joueur"
        tests:
          - not_null
      - name: dec_avg_vertical
        description: "Position verticale moyenne (0 = ligne de but propre, ~10 = attaque)"
      - name: dec_avg_horizontal
        description: "Position horizontale moyenne (5 = axe central)"
      - name: int_primary_slot
        description: "Slot de formation dominant (1..11, 1 = gardien)"
      - name: str_team_id
        description: "Id canonique de l'équipe."
      - name: bool_is_captain
        description: "Booléen : le joueur a été capitaine sur au moins une période."
      - name: int_n_formation_periods
        description: "Nombre de périodes tactiques distinctes du joueur dans le match (proxy de repositionnement)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - str_team_id
            - str_player_id

  - name: int_penalties
    description: >
      Penaltys au grain « un penalty tiré ». Pivot = la frappe (types 13/14/15/16
      portant qual 9) : tireur, résultat (marqué/arrêté/poteau/hors-cadre) et
      placement (goal_mouth_*). Rattachés en LEFT JOIN : PenaltyFaced (type 58, même
      instant) → équipe qui défend + gardien ; le foul en double (type 4 + qual 9)
      → joueur qui obtient / concède, dans une fenêtre de 300 s avant la frappe.
      Sources : int_event_enriched, int_whoscored_events, events_qual.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: str_attacking_team_id
        description: "Id canonique de l'équipe qui tire le penalty"
        tests:
          - not_null
      - name: str_taker_player_id
        description: "Joueur qui tire le penalty"
        tests:
          - not_null
      - name: str_defending_team_id
        description: "Équipe qui défend (via type 58). NULL si pas de PenaltyFaced apparié (~0,1 %)."
      - name: str_gk_player_id
        description: "Gardien face au penalty (via type 58)"
      - name: int_player_conceded
        description: "Joueur ayant concédé la faute (via qual 233). Rattaché à 100 %."
      - name: int_player_drew
        description: "Joueur ayant obtenu le penalty. Souvent NULL (limite données WhoScored, ~23 %)."
      - name: str_result_label
        description: "scored | saved | post | off_target"
        tests:
          - accepted_values:
              arguments:
                values: ['scored', 'saved', 'post', 'off_target']
      - name: int_row_num
        description: "row_num du tir du penalty. Avec match_id, clé unique."
      - name: str_season
        description: "Saison du match (ex. 2023-2024)."
      - name: str_league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: dt_scraped_at
        description: "Horodatage ISO du scrape."
      - name: int_expanded_minute
        description: "Minute (expanded_minute) du penalty."
      - name: bool_is_goal
        description: "Booléen : penalty marqué."
      - name: bool_is_saved
        description: "Booléen : penalty arrêté par le gardien."
      - name: bool_is_post
        description: "Booléen : penalty sur le poteau/la barre."
      - name: bool_is_off_target
        description: "Booléen : penalty non cadré."
      - name: dec_goal_mouth_y
        description: "Position horizontale du penalty dans le cadre du but (qualifier 102)."
      - name: dec_goal_mouth_z
        description: "Hauteur du penalty dans le cadre (qualifier 103)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - int_row_num

  - name: int_fouls_drawn
    description: >
      Fautes subies (coups francs obtenus) au grain « une faute subie » : côté
      outcome_id=1 des events Foul (type 4). Rattache le fautif via le qual 233
      (OppositeRelatedEvent, déterministe 100 %), la localisation (x/y, zone), le
      tiers offensif (x > 66.7) et si la faute donne un penalty. Le joueur qui subit
      est NULL ~5 % (limite source). Source : int_whoscored_events, events_qual.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: str_drawing_team_id
        description: "Équipe qui subit la faute / obtient le coup franc"
        tests:
          - not_null
      - name: str_drawer_player_id
        description: "Joueur qui subit la faute. NULL ~5 % (non renseigné à la source)."
      - name: str_committed_by_player_id
        description: "Fautif, rattaché via qual 233. NULL <1 %."
      - name: bool_is_attacking_third
        description: "Faute subie dans le tiers offensif (x > 66.7) — coup franc dangereux. NULL si x absent."
      - name: bool_leads_to_penalty
        description: "Vrai si la faute donne un penalty (qual 9 présent)"
      - name: int_row_num
        description: "row_num de la faute subie. Avec match_id, clé unique."
      - name: str_event_id
        description: "event_id WhoScored (scopé match+équipe)."
      - name: str_season
        description: "Saison du match (ex. 2023-2024)."
      - name: str_league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: dt_scraped_at
        description: "Horodatage ISO du scrape."
      - name: int_expanded_minute
        description: "Minute (expanded_minute) de la faute."
      - name: dec_x
        description: "Position X de la faute (0-100)."
      - name: dec_y
        description: "Position Y de la faute (0-100)."
      - name: str_foul_zone
        description: "Zone de la faute (qualifiers Opta) : Left / Center / Right = couloir latéral (gauche / axe / droite) ; Back = zone défensive/arrière. NULL si indéterminé."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - int_row_num

  - name: int_defensive_blocks
    description: >
      Contres défensifs au grain « un contre », avec le défenseur qui bloque.
      Basé sur l'event type 74 BlockedPass (bloqueur toujours nommé), rattaché à la
      passe bloquée via le qual 233 (99,4 %). Ce sont des contres de PASSE ; les
      contres de tir n'ont pas de bloqueur nommé chez Opta et sont hors périmètre.
      Le join qual 233 contraint l'équipe adverse (event_id scopé par équipe).
      Source : int_whoscored_events, events_qual.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: str_blocking_team_id
        description: "Équipe qui bloque (défend)"
        tests:
          - not_null
      - name: str_blocker_player_id
        description: "Défenseur qui bloque (type 74). Toujours renseigné."
        tests:
          - not_null
      - name: str_blocked_team_id
        description: "Équipe dont la passe est bloquée (adverse)"
      - name: str_blocked_player_id
        description: "Joueur dont la passe/action est bloquée (via qual 233). NULL <1 %."
      - name: str_blocked_type
        description: "Type d'action bloquée (surtout Pass)"
      - name: int_row_num
        description: "row_num du contre. Avec match_id, clé unique."
      - name: str_event_id
        description: "event_id WhoScored (scopé match+équipe)."
      - name: str_season
        description: "Saison du match (ex. 2023-2024)."
      - name: str_league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: dt_scraped_at
        description: "Horodatage ISO du scrape."
      - name: int_expanded_minute
        description: "Minute (expanded_minute) du contre."
      - name: dec_block_x
        description: "Position X du contre (0-100)."
      - name: dec_block_y
        description: "Position Y du contre (0-100)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - int_row_num

  - name: int_shot_creating_actions
    description: >
      Actions créatrices de tir (SCA) et de but (GCA), standard FBref/StatsBomb.
      Une ligne par crédit = (tir, sca_order 1|2) : les 2 actions offensives de
      l'équipe qui tire, dans la même chaîne de possession, juste avant le tir
      (Pass, TakeOn, faute obtenue, tir/rebond). is_gca vrai si le tir est un but.
      Source : player_possession_chains.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: int_sca_order
        description: "1 = action juste avant le tir, 2 = l'action précédente"
      - name: str_attacking_team_id
        description: "Équipe qui tire"
        tests:
          - not_null
      - name: str_creator_player_id
        description: "Joueur crédité de l'action créatrice"
        tests:
          - not_null
      - name: str_action_type
        description: "Type de l'action créatrice (Pass, TakeOn, tir…)"
      - name: bool_is_gca
        description: "Vrai si le tir est un but → ce crédit compte aussi en GCA"
      - name: int_shot_row_num
        description: "row_num du tir crédité."
      - name: str_shot_event_id
        description: "event_id du tir."
      - name: str_chain_id
        description: "Identifiant de la chaîne de possession (propagé de player_possession_chains)."
      - name: str_season
        description: "Saison du match (ex. 2023-2024)."
      - name: str_league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: dt_scraped_at
        description: "Horodatage ISO du scrape."
      - name: str_shot_taker_player_id
        description: "Joueur qui tire."
      - name: int_action_row_num
        description: "row_num de l'action créatrice."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - int_shot_row_num
            - int_sca_order

  - name: int_progressive_carries
    description: >
      Conduites (dribbles) au grain « un dribble réussi » : TakeOn (type 3) réussis
      côté offensif (outcome 1 + qual 286). WhoScored n'a pas d'event carry ; le
      TakeOn est la seule conduite balle au pied enregistrée. Progression mesurée du
      dribble jusqu'à la touche suivante du joueur dans la même chaîne, en mètres
      (réduction de distance au but). is_progressive = gain ≥ 5 m.
      Source : player_possession_chains, events_qual.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: str_team_id
        description: "Équipe du dribbleur"
        tests:
          - not_null
      - name: str_player_id
        description: "Joueur qui réussit le dribble"
        tests:
          - not_null
      - name: dec_progress_m
        description: "Gain de distance vers le but adverse (m). NULL si pas de touche suivante en chaîne."
      - name: bool_is_progressive
        description: "Vrai si la conduite gagne ≥ 5 m vers le but"
      - name: int_row_num
        description: "row_num du dribble (TakeOn). Avec match_id, clé unique."
      - name: str_event_id
        description: "event_id WhoScored du dribble (scopé match+équipe)."
      - name: str_season
        description: "Saison du match (ex. 2023-2024)."
      - name: str_league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: dt_scraped_at
        description: "Horodatage ISO du scrape."
      - name: int_expanded_minute
        description: "Minute (expanded_minute) du dribble."
      - name: dec_dribble_x
        description: "Position X du dribble (0-100)."
      - name: dec_dribble_y
        description: "Position Y du dribble (0-100)."
      - name: dec_next_x
        description: "Position X de la touche suivante du joueur (fin de la conduite)."
      - name: dec_next_y
        description: "Position Y de la touche suivante."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - int_row_num

  - name: int_substitutions
    description: >
      Changements au grain « un remplacement » : joueur qui sort (SubstitutionOff,
      type 18) apparié à celui qui entre (SubstitutionOn, type 19) par rang au sein
      du groupe (match, équipe, minute, seconde) — gère les changements simultanés.
      Croisé avec related_player_id (présent 27 %) : concordance 99,8 %. sub_number =
      k-ième changement de l'équipe. Source : int_whoscored_events.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: str_team_id
        description: "Équipe qui effectue le changement"
        tests:
          - not_null
      - name: int_player_off
        description: "Joueur qui sort"
        tests:
          - not_null
      - name: int_player_on
        description: "Joueur qui entre. NULL si sortie sans remplaçant (ex. carton rouge)."
      - name: int_expanded_minute
        description: "Minute du changement (temps additionnel inclus)"
      - name: int_sub_number
        description: "k-ième changement de l'équipe dans le match"
      - name: int_off_row_num
        description: "row_num de l'événement de sortie (SubstitutionOff). Clé avec match_id."
      - name: str_season
        description: "Saison du match (ex. 2023-2024)."
      - name: str_league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: dt_scraped_at
        description: "Horodatage ISO du scrape."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - int_off_row_num

  - name: int_xt_actions
    description: >
      Actions atomiques pour l'expected threat (xT), affectées à la grille fine
      16×12. Grain : une action de possession (déplacement, tir OU perte de balle).
      L'affectation (x,y)→case est définie UNIQUEMENT ici (col/row) et relue telle
      quelle par xt_grid.py et int_xt_contributions. Déplacements = passes réussies
      (player_passes_raw) + dribbles TakeOn réussis. Tirs = int_shot_placement, hors
      CSC. Pertes = fin de possession (passe/dribble ratés, contrôle manqué,
      Dispossessed, OffsidePass) depuis int_event_enriched.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)."
        tests:
          - not_null
      - name: int_row_num
        description: "Index de l'événement dans le match (ordre chronologique)."
      - name: str_season
        description: "Saison du match (ex. 2023-2024)."
      - name: str_league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: str_team_id
        description: "Id canonique de l'équipe de l'action."
      - name: str_player_id
        description: "Identifiant WhoScored du joueur (passeur, dribbleur ou tireur)."
      - name: str_action_kind
        description: "Type d'action : 'move' (passe/dribble réussi, avec destination), 'shot' (tir), ou 'turnover' (perte de balle, sans destination)."
      - name: bool_is_shot
        description: "Booléen : l'action est un tir."
      - name: bool_is_goal
        description: "Booléen : le tir est un but (renseigné pour les tirs ; NULL pour déplacements et pertes)."
      - name: int_col_from
        description: "Colonne (0-15) de la case de DÉPART sur la grille 16×12 (0 = son but, 15 = but adverse). = GREATEST(0, LEAST(15, INT(x/100·16)))."
      - name: int_row_from
        description: "Ligne (0-11) de la case de départ (largeur, ~6 = axe central). = GREATEST(0, LEAST(11, INT(y/100·12)))."
      - name: int_col_to
        description: "Colonne (0-15) de la case d'ARRIVÉE (déplacements). NULL pour les tirs et les dribbles sans touche suivante."
      - name: int_row_to
        description: "Ligne (0-11) de la case d'arrivée (déplacements). NULL pour les tirs et les dribbles sans touche suivante."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - int_row_num

  - name: int_xt_contributions
    description: >
      Contributions Expected Threat (xT) : xT ajouté par déplacement. Grain :
      1 ligne par déplacement (int_xt_actions action_kind='move' avec destination).
      xT_ajouté = xT(case d'arrivée) − xT(case de départ), attribué au joueur/équipe ;
      positif = progression vers le but adverse. Grille lue depuis
      machine_learning.xt_grid (étalon global). Matérialisé en table.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)."
        tests:
          - not_null
      - name: int_row_num
        description: "Index de l'événement dans le match. Avec match_id, clé unique."
      - name: str_season
        description: "Saison du match."
      - name: str_league_source
        description: "Championnat / source des données."
      - name: str_team_id
        description: "Équipe qui effectue le déplacement."
      - name: str_player_id
        description: "Joueur qui effectue le déplacement (passeur ou dribbleur)."
      - name: int_col_from
        description: "Colonne (0-15) de la case de départ."
      - name: int_row_from
        description: "Ligne (0-11) de la case de départ."
      - name: int_col_to
        description: "Colonne (0-15) de la case d'arrivée."
      - name: int_row_to
        description: "Ligne (0-11) de la case d'arrivée."
      - name: dec_xt_from
        description: "Valeur xT de la case de départ (machine_learning.xt_grid)."
      - name: dec_xt_to
        description: "Valeur xT de la case d'arrivée (machine_learning.xt_grid)."
      - name: dec_xt_added
        description: "xT ajouté = xt_to − xt_from. Positif = progression vers le but."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - int_row_num

  # ════════════════════════════════════════════════════════════════════════════
  # SHOT-STOPPING GARDIEN (PSxG+/-)
  # ════════════════════════════════════════════════════════════════════════════

  - name: int_keeper_shots
    description: >
      Attribution du gardien à chaque tir cadré subi — brique de int_keeper_psxg.
      Grain : un tir cadré (SavedShot + Goal, hors CSC/penalty), avec son xGOT
      (machine_learning.xgot_predictions) et le gardien qui l'a subi.
      Deux voies : tirs arrêtés → Save miroir relié au tir par le qualifier 233
      (related_event_id est NULL) ; buts → GK (slot=1) de l'équipe qui défend,
      période de formation active. keeper_id = COALESCE(save, lineup). Matérialisé
      en table.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)."
        tests:
          - not_null
      - name: int_row_num
        description: "Index du tir dans le match. Avec match_id, clé unique."
      - name: str_season
        description: "Saison du match (ex. 2023-2024)."
      - name: str_league_source
        description: "Championnat / source des données."
      - name: str_type_id
        description: "Type du tir : 15 SavedShot, 16 Goal."
      - name: bool_is_goal
        description: "Booléen : le tir a fini au fond."
      - name: dec_xgot
        description: "Post-Shot xG (xGOT) du tir, calibré, dans [0,1] (propagé de xgot_predictions)."
      - name: int_def_team
        description: "Id canonique de l'équipe qui défend (subit le tir)."
      - name: str_keeper_id
        description: >
          Gardien qui subit le tir (player_id WhoScored). COALESCE(Save miroir,
          GK lineup). NULL si non identifié (~lineup manquant) → exclu du PSxG.
      - name: str_attribution_method
        description: "Voie d'attribution : 'save' (qual 233), 'lineup' (GK de la période), 'none' (non identifié)."
        tests:
          - accepted_values:
              arguments:
                values: ['save', 'lineup', 'none']
      - name: bool_def_gk_available
        description: >
          Booléen : l'équipe qui défend a un GK lineup dans ce match (donc buts
          ET arrêts attribuables). Garde-fou symétrique consommé par int_keeper_psxg
          — FALSE = tirs non fiables (arrêts sans risque de but), exclus de l'agrégat.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - int_row_num

  - name: int_keeper_psxg
    description: >
      Post-Shot Expected Goals +/- (PSxG+/-) par gardien = mesure de shot-stopping.
      Grain : gardien × saison × championnat. Source : int_keeper_shots.
      psxg_plus_minus = Σ xGOT subi − buts encaissés ; > 0 = le gardien arrête plus
      que la qualité des tirs ne le prédit (surperformance). Garde-fou symétrique :
      uniquement les tirs des matchs où def_gk_available (pas d'arrêt sans but
      possible). Hors CSC/penalty par construction amont. Matérialisé en table.
    columns:
      - name: str_keeper_id
        description: "Gardien (player_id WhoScored)."
        tests:
          - not_null
      - name: str_season
        description: "Saison (ex. 2023-2024)."
        tests:
          - not_null
      - name: str_league_source
        description: "Championnat / source des données."
        tests:
          - not_null
      - name: int_shots_faced
        description: "Nombre de tirs cadrés subis (hors CSC/penalty, matchs couverts)."
      - name: int_goals_conceded
        description: "Buts encaissés (hors CSC/penalty)."
      - name: int_saves
        description: "Arrêts = shots_faced − goals_conceded."
      - name: dec_psxg_faced
        description: "Σ xGOT des tirs subis = qualité cumulée des tirs affrontés."
      - name: dec_psxg_plus_minus
        description: "psxg_faced − goals_conceded. Positif = surperformance (bon shot-stopper)."
      - name: dec_save_pct
        description: "Taux d'arrêt brut = saves / shots_faced (ne tient pas compte de la difficulté)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_keeper_id
            - str_season
            - str_league_source

  - name: int_player_minutes
    description: >
      Minutes jouées par joueur et par match, dérivées de la timeline de formation
      WhoScored (int_whoscored_lineup) — Σ des durées de segments, minutes expanded
      (absolues). Base du per-90 en couche Gold. Garde-fous : match_id non NULL
      (exclut les orphelins D2), segments bornés 0..130 (exclut la sentinelle 32767),
      GREATEST(end-start,0).
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)."
        tests:
          - not_null
      - name: str_team_id
        description: "Id canonique de l'équipe du joueur pour ce match."
        tests:
          - not_null
      - name: str_player_id
        description: "Identifiant WhoScored du joueur."
        tests:
          - not_null
      - name: int_minutes_played
        description: "Minutes jouées dans le match (0..~128, temps additionnel inclus). 0 = présent mais non entré. Aucun plafond appliqué : le test ci-dessous ALERTE si la source redevient aberrante (sentinelle 32767), au lieu de la masquer."
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 140
              config:
                severity: warn
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - str_team_id
            - str_player_id

  - name: int_player_zone_season
    description: >
      Agrégat zonal 5×5 offensif par (joueur, cellule, saison jouée) : part
      moyenne des touches (grille pct_zX_cY remise en tall) et tirs pris dans la
      cellule (int_shot_placement binné, CSC exclus). Base de gold.joueur_zone_saison.
      Scindé + matérialisé pour contourner un bug du planner DuckDB 1.5.1.
    columns:
      - name: str_player_id
        description: "Identifiant du joueur."
        tests:
          - not_null
      - name: str_zone_5x5
        description: "Cellule 5×5 (zX_cY) : z = profondeur (x), c = couloir (y), bornes tous les 20."
        tests:
          - not_null
      - name: str_season
        description: "Saison jouée (ex. 2023-2024)."
        tests:
          - not_null
      - name: dec_avg_touch_share
        description: "Part moyenne des touches du joueur dans la cellule sur la saison."
      - name: int_n_matches
        description: "Nombre de matchs du joueur dans la saison (compteur d'observations)."
      - name: int_total_shots
        description: "Tirs pris par le joueur dans la cellule sur la saison (CSC exclus)."
      - name: int_n_duels
        description: "Duels défensifs disputés par le joueur dans la cellule (repère retourné vers sa cage)."
      - name: int_duels_won
        description: "Duels défensifs gagnés dans la cellule (outcome_b = 1)."
      - name: dec_total_danger
        description: "Σ danger_position des actions OFFENSIVES du joueur dans la cellule (event_values, feature 35)."
      - name: int_total_progressive
        description: "Passes progressives du joueur dans la cellule sur la saison (player_passes_raw.is_progressive, feature 41)."
      - name: int_total_crosses
        description: >
          Centres délivrés depuis la cellule (feature 37). Définition géométrique :
          passe du dernier tiers sur un flanc (x≥66 et y<20 ou y>80) vers la surface
          centrale (end_x≥83, end_y∈[21,79]). is_creative écarté (piquait au centre).
      - name: int_total_def_actions
        description: >
          Actions défensives du joueur dans la cellule (event_values,
          def_execution_quality non NULL ; coords dans le repère du camp du défenseur,
          pas de retournement). Brique de def_actions_by_zone_lag (feature 55).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_player_id
            - str_zone_5x5
            - str_season

  - name: int_player_role_lag
    description: >
      Grain (player_id, season). Rôle tactique dominant du joueur en saison N-1
      (SEASON-LAG), calculé sur ses apparitions comme titulaire (moyenne pondérée
      par minutes titu de grid_vertical/grid_horizontal, taxonomie 9 : GK, CB,
      FB, DM, CM, WM, AM, W, ST). NULL possible pour une recrue → fallback dans
      int_player_role_match via role_fin_current.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: 
          - str_player_id 
          - str_season
    columns:
      - name: str_player_id
        tests: [not_null]
      - name: str_season
        tests: [not_null]
      - name: dec_gv_avg
        description: "Moyenne pondérée par minutes titu de grid_vertical (N-1)."
      - name: dec_gh_avg
        description: "Moyenne pondérée par minutes titu de grid_horizontal (N-1)."
      - name: dec_gh_offaxis
        description: "abs(gh_avg - 5), écart à l'axe central."
      - name: int_minutes_titu_lag
        description: "Minutes cumulées comme titulaire en N-1. Signal de confiance."
      - name: int_apps_starter_lag
        description: "Nb d'apparitions comme titulaire en N-1. Signal de confiance."
      - name: str_role_fin_lag
        description: "Rôle dominant N-1 (9 valeurs). NULL si recrue."
        tests:
          - accepted_values:
              arguments:
                values: ['GK', 'CB', 'FB', 'DM', 'CM', 'WM', 'AM', 'W', 'ST']

  - name: int_player_role_match
    description: >
      Grain (match_id, player_id). Rôle tactique résolu pour le match, cascade :
      role_fin_lag (SEASON-LAG) → role_fin_current (slot du joueur dans la
      formation initiale de ce match, coord annoncée pré-match, pas de leakage)
      → role_fin_resolved = COALESCE des deux, JAMAIS NULL pour un titulaire.
      Consommée par le KNN (famille 11 refonte) et serve_features.py.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: 
          - str_match_id 
          - str_player_id
    columns:
      - name: str_match_id
        tests: [not_null]
      - name: str_player_id
        tests: [not_null]
      - name: str_team_id
        tests: [not_null]
      - name: str_season
        tests: [not_null]
      - name: str_role_fin_lag
        description: "Rôle SEASON-LAG (peut être NULL : recrue)."
        tests:
          - accepted_values:
              values: ['GK', 'CB', 'FB', 'DM', 'CM', 'WM', 'AM', 'W', 'ST']
              config:
                where: "role_fin_lag IS NOT NULL"
      - name: str_role_fin_current
        description: "Rôle calculé sur la coord slot de CE match."
        tests:
          - not_null
          - accepted_values:
              values: ['GK', 'CB', 'FB', 'DM', 'CM', 'WM', 'AM', 'W', 'ST']
      - name: str_role_fin_resolved
        description: "COALESCE(role_fin_lag, role_fin_current). Utilisé comme masque KNN."
        tests:
          - not_null
          - accepted_values:
              values: ['GK', 'CB', 'FB', 'DM', 'CM', 'WM', 'AM', 'W', 'ST']
      - name: str_role_source
        description: "'season_lag' si role_fin_lag présent, 'match_slot' sinon."
        tests:
          - not_null
          - accepted_values:
              values: ['season_lag', 'match_slot']

  - name: int_lineup_formation
    description: >
      Grain (match_id, team_id). Features structurelles de la compo de départ
      (période 1) : compteurs par ligne via role_fin_resolved, catégorie 3/4/5-back
      via n_def, écart-type spatial du bloc de champ (GK exclu), hauteur moyenne
      des lignes défensive/offensive, axialité du XI. Base de la Phase 4
      (features formation) — consommé par int_formation_matchup_match et par
      equipe_lineup_match.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: 
          - str_match_id
          - str_team_id
    columns:
      - name: str_match_id
        tests: [not_null]
      - name: str_team_id
        tests: [not_null]
      - name: str_formation_id
        description: "Formation WhoScored de la période 1 (première formation)."
      - name: str_formation_family
        description: "'3-back' / '4-back' / '5-back' via n_def. 'other' = compo irrégulière (à monitorer)."
        tests:
          - not_null
          - accepted_values:
              values: ['3-back', '4-back', '5-back', 'other']
      - name: int_n_gk
        tests: [not_null]
      - name: int_n_def
        description: "Nb titulaires en CB ou FB."
        tests: [not_null]
      - name: int_n_mid
        description: "Nb titulaires en DM/CM/AM/WM."
        tests: [not_null]
      - name: int_n_att
        description: "Nb titulaires en W ou ST."
        tests: [not_null]
      - name: int_n_wingers
        description: "Nb titulaires en W ou WM (couloirs bas + hauts)."
      - name: int_n_central_att
        description: "Nb titulaires en ST ou AM (attaque axiale)."
      - name: dec_bloc_width
        description: "Écart-type de grid_horizontal sur les 10 joueurs de champ."
      - name: dec_bloc_depth
        description: "Écart-type de grid_vertical sur les 10 joueurs de champ."
      - name: dec_line_defensive_avg
        description: "Moyenne grid_vertical des CB+FB (hauteur du bloc défensif)."
      - name: dec_line_offensive_avg
        description: "Moyenne grid_vertical des W+ST (hauteur du bloc offensif)."
      - name: dec_axiality_score
        description: "Fraction du XI (hors GK) avec |gh-5| <= 1.5."

  - name: int_formation_matchup_match
    description: >
      Grain (match_id, team_id) directionnel A→B. Deltas structurels entre la
      formation de A et celle de l'adversaire B (attack_overload, mid_control_delta,
      back_depth_delta, width_delta, depth_delta, axiality_delta) + clé catégorielle
      croisée matchup_family (ex. '4-back_vs_3-back'). Complète le signal individuel
      d'int_lineup_formation par les effets non-linéaires de matchup formation × formation.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: 
          - str_match_id
          - str_team_id
    columns:
      - name: str_match_id
        tests: [not_null]
      - name: str_team_id
        tests: [not_null]
      - name: str_opponent_id
        tests: [not_null]
      - name: int_attack_overload
        description: "n_att(A) - n_def(B). Positif = surnombre offensif de A."
      - name: int_mid_control_delta
        description: "n_mid(A) - n_mid(B). Positif = supériorité numérique au milieu."
      - name: dec_back_depth_delta
        description: "line_defensive_avg(A) - line_defensive_avg(B). Positif = A joue plus haut."
      - name: dec_width_delta
        description: "bloc_width(A) - bloc_width(B). Positif = A joue plus large."
      - name: dec_depth_delta
        description: "bloc_depth(A) - bloc_depth(B). Positif = bloc de A plus étiré verticalement."
      - name: dec_axiality_delta
        description: "axiality_score(A) - axiality_score(B). Positif = A plus axial."
      - name: str_formation_family_self
        tests:
          - accepted_values:
              values: ['3-back', '4-back', '5-back', 'other']
      - name: str_formation_family_opp
        tests:
          - accepted_values:
              values: ['3-back', '4-back', '5-back', 'other']
      - name: str_matchup_family
        description: "concat(family_self, '_vs_', family_opp). Max 16 modalités, typiquement 6-9."
        tests:
          - not_null