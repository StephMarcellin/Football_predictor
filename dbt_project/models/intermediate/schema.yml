  - name: int_fbref_shooting
    description: >
      Volume de tirs FBref (tirs totaux, tirs cadrés, ratios d'efficacité) rematché
      sur match_id + team_id. Alimente le bloc tirs de backbone. Colonnes castées depuis
      le VARCHAR brut de silver.fbref_shooting. Pas de données de tirs FBref avant
      2014-2015 (19 900 lignes : sh, sot, pkatt et ratios NULL). sh = 0 traité comme
      donnée manquante (563 lignes → NULL). Ratios recalculés hors penalty, échelle 0-1.
    tests:
      # ── Grain de la table (1 ligne par équipe par match) ──
      # Historique A-001 : severity=warn tant que la jointure registry fan-outait (+249 lignes).
      # Jointure contrainte sur l'adversaire depuis la refonte → 0 doublon empirique → error.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - str_match_id
              - str_team_id
          config:
            severity: error
      # ── Contrainte physique dure : tirs cadrés ≤ tirs totaux ──
      # 0 violation empirique. NULL toléré (saisons sans données de tirs).
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(int_standard_sot IS NULL) OR (int_standard_sh IS NULL) OR (int_standard_sot <= int_standard_sh)"
          config:
            severity: error
      # ── Contrainte physique dure : penaltys transformés ≤ penaltys tentés ──
      # 0 violation empirique. pkatt NULL avant 2014-2015 (non scrapé), toléré.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(int_standard_pkatt IS NULL) OR (int_standard_pk <= int_standard_pkatt)"
          config:
            severity: error
      # ── Contrainte physique dure : buts sur penalty ≤ buts ──
      # 0 violation empirique.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "int_standard_pk <= int_standard_gls"
          config:
            severity: error
      # ── A-011 (révisé) : buts hors penalty ≤ tirs cadrés ──
      # L'ancienne règle "gls <= sot" était mal posée : Gls FBref inclut les penalties,
      # SoT les exclut (1 490 violations dont l'essentiel = buts sur penalty + faux zéros sh=0).
      # Règle correcte gls - pk <= sot : 5 violations résiduelles après neutralisation
      # des faux zéros → incohérence FBref non corrigeable, warn.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(int_standard_sot IS NULL) OR (int_standard_gls - int_standard_pk <= int_standard_sot)"
          config:
            severity: warn
      # ── A-011 : buts du rapport de tirs ≤ buts totaux ──
      # 7 lignes empiriques : matchs gagnés sur tapis vert (stats terrain vs score attribué,
      # ex. Wolfsburg-Münster 2021, Roma-Spezia 2021, Union-Bochum 2024). Attendu → warn.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "int_standard_gls <= int_gf"
          config:
            severity: warn
      # ── Cohérence result vs score ──
      # 2 lignes empiriques : Bastia-Lyon 16/04/2017 (match arrêté, victoire attribuée). Attendu → warn.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (str_result = 'W' AND int_gf > int_ga) OR
              (str_result = 'D' AND int_gf = int_ga) OR
              (str_result = 'L' AND int_gf < int_ga)
          config:
            severity: warn
      # ── Outliers de score (Cat D) : signalés, jamais filtrés ──
      # 1 ligne empirique > 12 buts.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "int_gf <= 12 AND int_ga <= 12"
          config:
            severity: warn
    columns:
