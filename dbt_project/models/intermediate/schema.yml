version: 2

models:
  - name: backbone
    description: >
      Table pivot centrale — 1 ligne par équipe par match.
      Jointure de 7 tables silver.* produite par dbt en mode incremental.
      Schéma intermediate — consommée par les modèles gold.features_*.
    config:
      alias: backbone

    columns:

      # ── Identifiants ────────────────────────────────────────────────────────
      - name: match_id
        description: "Identifiant Understat du match — NULL si le match n'existe pas dans Understat"
        tests:
          - not_null:
              config:
                severity: warn
      - name: date
        description: "Date du match"
        tests:
          - not_null

      - name: team_id
        description: "Nom normalisé de l'équipe"
        tests:
          - not_null

      - name: opponent_id
        description: "Nom normalisé de l'adversaire"
        tests:
          - not_null

      - name: venue
        description: "Lieu du match du point de vue de l'équipe : Home ou Away"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home', 'Away', 'Neutral']

      - name: season
        description: "Saison au format YYYY-YYYY"
        tests:
          - not_null

      - name: league_source
        description: "Nom de la compétition source (ex: Premier League, Ligue 1)"
        tests:
          - not_null

      - name: comp_category
        description: "Catégorie de compétition : Big5, Cup, Europe"
        tests:
          - not_null

      - name: result_1n2
        description: "Résultat du point de vue de l'équipe : H (victoire), D (nul), A (défaite)"
        tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              config:
                severity: error
              arguments:
                values: ['H', 'D', 'A']

      - name: formation
        description: "Formation tactique de l'équipe (ex: 4-3-3)"

      # ── Résultats bruts ──────────────────────────────────────────────────────
      - name: gf
        description: "Buts marqués par l'équipe"
        tests:
          - not_null
          - is_positive

      - name: ga
        description: "Buts encaissés par l'équipe"
        tests:
          - not_null
          - is_positive

      - name: possession
        description: "Possession en pourcentage (castée depuis VARCHAR fbref_schedule)"
        tests:
          - is_positive

      # ── Gardien (fbref_keeper) ───────────────────────────────────────────────
      - name: shots_on_target_faced
        description: "Tirs cadrés subis par le gardien (sota)"
        tests:
          - is_positive

      - name: saves
        description: "Arrêts du gardien"
        tests:
          - is_positive

      - name: save_pct
        description: "Pourcentage d'arrêts (saves / shots_on_target_faced)"

      - name: clean_sheet
        description: "1 si aucun but encaissé, 0 sinon"
        tests:
          - is_positive

      # ── Tirs (fbref_shooting) ────────────────────────────────────────────────
      - name: shots_total
        description: "Total de tirs tentés"
        tests:
          - is_positive

      - name: shots_on_target
        description: "Tirs cadrés"
        tests:
          - is_positive

      - name: goals_per_shot
        description: "Buts par tir (efficacité offensive brute)"

      # ── Disciplinaire (fbref_misc) ───────────────────────────────────────────
      - name: yellow_cards
        description: "Cartons jaunes reçus"
        tests:
          - is_positive

      - name: second_yellow_cards
        description: "Deuxièmes cartons jaunes (expulsion indirecte)"
        tests:
          - is_positive

      - name: red_cards
        description: "Cartons rouges directs reçus"
        tests:
          - is_positive

      - name: fouls_committed
        description: "Fautes commises"
        tests:
          - is_positive

      - name: interceptions
        description: "Interceptions"
        tests:
          - is_positive

      - name: tackles_won
        description: "Tacles remportés"
        tests:
          - is_positive

      # ── xG et pressing (understat_stats) ────────────────────────────────────
      - name: np_xg
        description: "Expected goals sans pénalties du point de vue de l'équipe (Understat) — NULL si match hors Understat"
        tests:
          - is_positive

      - name: np_xg_conceded
        description: "Expected goals sans pénalties concédés — NULL si match hors Understat"
        tests:
          - is_positive

      - name: ppda
        description: "PPDA de l'équipe — passes adverses autorisées par action défensive (mesure le pressing)"
        tests:
          - is_positive

      - name: ppda_allowed
        description: "PPDA autorisé à l'adversaire — pressing subi"
        tests:
          - is_positive

      - name: np_xg_diff_match
        description: "Différentiel npxG du match (np_xg - np_xg_conceded) — peut être négatif"

      # ── WhoScored saison (whoscored_team_season) ─────────────────────────────
      - name: season_att_rating
        description: "Rating offensif WhoScored de la saison selon le venue (Home ou Away)"
        tests:
          - is_positive

      - name: season_def_rating
        description: "Rating défensif WhoScored de la saison selon le venue"
        tests:
          - is_positive

      - name: ws_dribbles_pg
        description: "Dribbles réussis par match selon le venue"
        tests:
          - is_positive

      - name: ws_fouled_pg
        description: "Fautes subies par match selon le venue"
        tests:
          - is_positive

      - name: ws_shots_ot_pg
        description: "Tirs cadrés par match selon le venue"
        tests:
          - is_positive

      # ── Cotes Pinnacle (odds) ────────────────────────────────────────────────
      - name: odds_pinnacle_team
        description: "Cote Pinnacle victoire de l'équipe (H si Home, A si Away)"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: odds_pinnacle_draw
        description: "Cote Pinnacle match nul"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: odds_pinnacle_opp
        description: "Cote Pinnacle victoire de l'adversaire"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: odds_avg_team
        description: "Cote moyenne marché victoire de l'équipe"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: odds_avg_draw
        description: "Cote moyenne marché match nul"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: odds_avg_opp
        description: "Cote moyenne marché victoire adversaire"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      # ── Probabilités implicites ──────────────────────────────────────────────
      - name: pinnacle_prob_team
        description: "Probabilité implicite Pinnacle victoire de l'équipe"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: pinnacle_prob_draw
        description: "Probabilité implicite Pinnacle match nul"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: pinnacle_prob_opp
        description: "Probabilité implicite Pinnacle victoire adversaire"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: market_prob_team
        description: "Probabilité implicite marché moyen victoire de l'équipe"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: market_prob_draw
        description: "Probabilité implicite marché moyen match nul"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: market_prob_opp
        description: "Probabilité implicite marché moyen victoire adversaire"
        tests:
          - is_valid_probability:
              config:
                severity: warn

  - name: events_qual
    description: >
      Éclatement des qualifiers de int_whoscored_events (via qualifiers_json) :
      1 ligne par (événement × qualifier). Base de tous les modèles WhoScored.
      Incrémentale. Les colonnes d'événement sont reprises telles quelles de
      int_whoscored_events ; qual_type_id/name/value sont la transformation (unnest).
    columns:
      # ── Colonnes héritées de int_whoscored_events (mêmes définitions) ──────────
      - name: match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index."
      - name: team_id
        description: "Id canonique de l'équipe de l'événement (converti depuis l'id WhoScored via int_whoscored_match_index)."
      - name: player_id
        description: "Identifiant WhoScored du joueur auteur de l'action. NULL possible sur certains événements."
      - name: event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
        tests:
          - not_null
      - name: minute
        description: "Minute de jeu brute (hors temps additionnel)."
      - name: second
        description: "Seconde dans la minute."
      - name: expanded_minute
        description: "Minute cumulée, temps additionnel inclus (ex. 45+2 → 47)."
      - name: period
        description: "Période : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match (FormationSet), 14 = fin de match (End)."
      - name: x
        description: "Position X de l'action sur le terrain (0-100, croissant vers le but adverse ; repère relatif à l'équipe)."
      - name: y
        description: "Position Y de l'action (0-100, largeur, 50 = axe central)."
      - name: end_x
        description: "Position X de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: end_y
        description: "Position Y de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: type_id
        description: "Type d'événement WhoScored (cf. docs/Event_type_definition.txt ; ex. 1 Pass, 3 TakeOn, 4 Foul, 13-16 tirs)."
        tests:
          - not_null
      - name: type_name
        description: "Libellé du type d'événement (Pass, TakeOn, Foul, Goal…)."
      - name: outcome_id
        description: "Résultat de l'action : 1 = réussi, 0 = raté."
      - name: is_touch
        description: "Booléen : le joueur a touché le ballon (flag WhoScored isTouch)."
      - name: is_shot
        description: "Booléen : l'événement est un tir (flag WhoScored isShot)."
      - name: row_num
        description: "Index de l'événement dans le flux du match (ordre chronologique)."
        tests:
          - not_null
      # ── Transformation propre à events_qual : éclatement du qualifiers_json ────
      - name: qual_type_id
        description: "Id du type de qualifier (cf. docs/Qualifier_type_definition.txt ; ex. 9 Penalty, 102 GoalMouthY, 233 OppositeRelatedEvent)."
      - name: qual_type_name
        description: "Libellé du qualifier (displayName WhoScored)."
      - name: qual_value
        description: "Valeur du qualifier (chaîne). NULL pour un qualifier-drapeau sans valeur."

  - name: player_match_stats
    description: >
      Agrégats WhoScored par joueur par match.
      Calculé depuis int_whoscored_events et events_qual.
      Structure en trois CTEs : base_agg (métriques générales),
      offensive_agg (passes, tirs, progressions),
      defensive_agg (tackles, interceptions, dégagements).
      Utilisé pour les squad features dans gold.features_whoscored.

    columns:
      - name: match_id
        description: "Identifiant du match (SHA1)"
        tests:
          - not_null
      - name: team_id
        description: "Identifiant WhoScored de l'équipe"
        tests:
          - not_null
      - name: player_id
        description: "Identifiant WhoScored du joueur"
        tests:
          - not_null
      - name: date
        description: "Date du match"
        tests:
          - not_null
      - name: season
        description: "Saison (format YYYY-YYYY)"
        tests:
          - not_null
      - name: league_source
        description: "Ligue source"
        tests:
          - not_null

      # ── Métriques générales ──────────────────────────────────────
      - name: n_actions
        description: "Nombre total d'actions du joueur dans le match"
        tests:
          - is_positive
      - name: xg_contribution
        description: >
          Contribution xG estimée — nombre de tirs pondéré par la distance
          géométrique au centre du but adverse.
        tests:
          - is_positive
      - name: zone_dominance
        description: >
          Position moyenne X des touches (hors actions gardien).
          0 = zone défensive, 100 = zone offensive.

      # ── Métriques offensives ─────────────────────────────────────
      - name: n_shots
        description: "Nombre de tirs tentés"
        tests:
          - is_positive
      - name: n_shots_regular_play
        description: "Tirs dans le jeu collectif (qualifier RegularPlay=22)"
        tests:
          - is_positive
      - name: n_shots_individual_play
        description: "Tirs après action individuelle (qualifier IndividualPlay=215)"
        tests:
          - is_positive
      - name: n_shot_assists
        description: "Passes directement avant un tir (qualifier ShotAssist=210)"
        tests:
          - is_positive
      - name: n_key_passes
        description: "Passes clés WhoScored (qualifier KeyPass=11113)"
        tests:
          - is_positive
      - name: n_longballs
        description: "Longues passes (qualifier Longball=1, type Pass)"
        tests:
          - is_positive
      - name: n_crosses
        description: "Centres (qualifier Cross=2, type Pass)"
        tests:
          - is_positive
      - name: n_throughballs
        description: "Passes en profondeur (qualifier Throughball=4, type Pass)"
        tests:
          - is_positive
      - name: n_progressive_passes
        description: >
          Passes réussies faisant avancer le ballon de 10+ unités
          vers le but adverse (end_x > x + 10).
        tests:
          - is_positive

      # ── Métriques défensives ─────────────────────────────────────
      - name: n_tackles
        description: "Nombre de tacles tentés (type_id=7)"
        tests:
          - is_positive
      - name: n_tackles_won
        description: "Nombre de tacles réussis (type_id=7, outcome_id=1)"
        tests:
          - is_positive
      - name: n_interceptions
        description: "Nombre d'interceptions (type_id=8)"
        tests:
          - is_positive
      - name: n_ball_recoveries
        description: "Récupérations de balle libre (type_id=49)"
        tests:
          - is_positive
      - name: n_challenges
        description: >
          Challenges offensifs (type_id=45, toujours Unsuccessful).
          Signal de pressing et de résistance au tackle.
        tests:
          - is_positive
      - name: n_clearances
        description: "Dégagements défensifs (type_id=12)"
        tests:
          - is_positive
      - name: defensive_zone_x
        description: >
          Position X moyenne des actions défensives
          (tackles, interceptions, récupérations, challenges, dégagements).
          Mesure la hauteur de la ligne défensive du joueur.
          Valeur basse = défend profond, valeur haute = pressing haut.

      # ── Discipline ───────────────────────────────────────────────
      - name: n_yellow_cards
        description: "Cartons jaunes reçus par le joueur (event type 17, card_type=Yellow)"
        tests:
          - is_positive
      - name: n_second_yellows
        description: "Deuxièmes cartons jaunes (expulsion indirecte, card_type=SecondYellow)"
        tests:
          - is_positive
      - name: n_red_cards
        description: "Cartons rouges directs reçus (card_type=Red)"
        tests:
          - is_positive

      # ── Création (lien direct related_player_id) ─────────────────
      - name: n_assists
        description: >
          Passes décisives — buts où le joueur est le créateur direct
          (related_player_id). Conservateur vs qualifier 11111, mais lien exact.
        tests:
          - is_positive
      - name: n_chances_created
        description: "Tirs créés par le joueur (related_player_id sur un tir, toutes issues)"
        tests:
          - is_positive

      # ── Duels aériens offensifs / défensifs ──────────────────────
      - name: n_aerial_offensive
        description: "Duels aériens offensifs (type 44 + qualifier 286)"
        tests:
          - is_positive
      - name: n_aerial_defensive
        description: "Duels aériens défensifs (type 44 + qualifier 285)"
        tests:
          - is_positive

  - name: team_features_ws
    description: >
      Features tactiques WhoScored par équipe par match.
      Calculées depuis silver.stg_whoscored_events et intermediate.events_qual.
      32 métriques couvrant le pressing, les zones d'attaque, la structure défensive.
    columns:
      - name: ws_match_id
        description: "Identifiant WhoScored du match"
        tests:
          - not_null
      - name: team_id
        description: "Identifiant WhoScored de l'équipe"
        tests:
          - not_null
      - name: ws_field_tilt_actions
        description: "Tilt de terrain — proportion de touches en zone offensive"
      - name: ws_momentum_delta
        description: "Delta de momentum après avoir encaissé un but (actions post / actions pre)"
      - name: ws_zone_att_pct
        description: "Pourcentage de touches en zone offensive (x > 66.6)"
      - name: ws_counter_attack_dna
        description: "ADN contre-attaque — proportion de tirs issus d'une récupération < 15 secondes"
      - name: ws_midfield_control_idx
        description: "Contrôle du milieu — part des actions réussies en zone centrale"
      - name: ws_defensive_line_height
        description: "Hauteur moyenne de la ligne défensive (position X)"
      - name: ws_flank_exposure_asymm
        description: "Asymétrie d'exposition sur les flancs — différentiel gauche/droite"

  - name: h2h_history
    description: "Registre brut des confrontations directes entre équipes. Une ligne par match."
    columns:
      - name: match_id
        tests:
          - not_null
      - name: home_team_id
        tests:
          - not_null
      - name: away_team_id
        tests:
          - not_null
      - name: date
        tests:
          - not_null
  - name: player_possession_chains
    description: >
      Segmente le flux d'événements WhoScored en chaînes de possession.
      Pour chaque événement, détermine l'équipe réellement en possession
      (possession certaine vs indéterminée), puis marque le déclencheur de
      chaque chaîne via chain_trigger (corner, free_kick, counter_attack,
      open_play, recovery, throw_in, goal_kick...).
      Source : int_event_enriched. Incrémentale sur match_id.
      Brique de base de corner_profiles, player_passes_raw et player_xg_chain.
      Une ligne par action.
    columns:
      # ── Héritées de int_event_enriched (mêmes définitions) ─────────────────────
      - name: match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index."
        tests:
          - not_null
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: team_id
        description: "Id canonique de l'équipe de l'action (converti depuis l'id WhoScored via int_whoscored_match_index)."
      - name: player_id
        description: "Identifiant WhoScored du joueur auteur de l'action. NULL possible sur certains événements."
      - name: event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
      - name: row_num
        description: "Index de l'événement dans le flux du match (ordre chronologique)."
        tests:
          - not_null
      - name: expanded_minute
        description: "Minute cumulée, temps additionnel inclus (ex. 45+2 → 47)."
      - name: second
        description: "Seconde dans la minute."
      - name: period
        description: "Période : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match (FormationSet), 14 = fin de match (End)."
      - name: type_id
        description: "Type d'événement WhoScored (cf. docs/Event_type_definition.txt ; ex. 1 Pass, 3 TakeOn, 4 Foul, 13-16 tirs)."
      - name: type_name
        description: "Libellé du type d'événement (Pass, TakeOn, Foul, Goal…)."
      - name: outcome_id
        description: "Résultat de l'action : 1 = réussi, 0 = raté."
      - name: is_shot
        description: "Booléen : l'événement est un tir (flag WhoScored isShot)."
      - name: x
        description: "Position X de l'action sur le terrain (0-100, croissant vers le but adverse ; repère relatif à l'équipe)."
      - name: y
        description: "Position Y de l'action (0-100, largeur, 50 = axe central)."
      - name: scraped_at
        description: "Horodatage ISO du scrape du match."
      # ── Transformation : segmentation en chaînes de possession ────────────────
      - name: chain_id
        description: "Identifiant de la chaîne de possession = match_id || '_' || numéro de chaîne. Regroupe les actions d'une même possession."
      - name: chain_number
        description: "Numéro séquentiel de la chaîne de possession dans le match."
      - name: chain_team_id
        description: >
          Id canonique de l'équipe EN POSSESSION durant la chaîne (possesseur résolu).
          ≠ team_id : team_id est l'équipe de l'action précise (ex. un dégagement
          adverse peut appartenir à la chaîne de l'équipe qui attaque).
      - name: is_rupture
        description: "Flag (0/1) : l'événement clôt la chaîne (le possesseur change juste après)."
      - name: chain_trigger
        description: "Déclencheur de la chaîne : recovery / corner / goal_kick / throw_in / free_kick / open_play."
      - name: certain_possessor
        description: "Id de l'équipe si la possession est certaine à cet événement ; NULL si possession indéterminée (duel / ballon libre)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: freekick_profiles
    description: >
      Profils de coups francs par chaîne. Caractérise chaque coup franc par
      son type (direct, indirect, short_pass) et son issue (goal, shot_saved,
      shot_off_target, offside, foul_won, corner_won, open_play, turnover).
      Source : player_possession_chains. Incrémentale.
    columns:
      - name: match_id
        tests:
          - not_null
      - name: row_num
        tests:
          - not_null
      - name: fk_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['direct', 'indirect', 'short_pass']
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['goal', 'shot_saved', 'shot_off_target', 'offside', 'foul_won', 'corner_won', 'open_play', 'turnover']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  # ════════════════════════════════════════════════════════════════════════════
  # COUCHE int_* — rematchage silver → clés unifiées
  # Chaque table lit une source silver.*, remplace les noms d'équipes bruts par
  # team_id normalisé (team_mapping) et rattache le match_id unifié
  # (match_registry). Matérialisées en table.
  # ════════════════════════════════════════════════════════════════════════════

  - name: int_fbref_keeper
    description: >
      Stats gardien FBref (tirs cadrés subis, arrêts, save%) rematchées sur
      match_id unifié et team_id normalisé. Alimente les colonnes gardien
      de backbone.

  - name: int_fbref_misc
    description: >
      Stats disciplinaires et défensives FBref (cartons, fautes commises,
      interceptions, tacles gagnés) rematchées sur match_id + team_id.
      Alimente le bloc disciplinaire de backbone.

  - name: int_fbref_schedule
    description: >
      Feuille de match FBref (résultat, buts marqués/encaissés, possession,
      formation) rematchée sur match_id + team_id. Source des résultats bruts
      et de la possession dans backbone.

  - name: int_fbref_shooting
    description: >
      Volume de tirs FBref (tirs totaux, tirs cadrés, buts par tir) rematché
      sur match_id + team_id. Alimente le bloc tirs de backbone.

  - name: int_odds
    description: >
      Cotes bookmakers (Pinnacle et moyennes marché) rematchées sur match_id
      + team_id/opponent_id. Alimente les colonnes odds_* et les probabilités
      implicites de backbone.

  - name: int_understat_schedule
    description: >
      Calendrier Understat rematché sur le match_id unifié. Conserve
      us_match_id (id Understat d'origine) et produit la correspondance
      us_match_id ↔ match_id réutilisée par int_understat_stats.

  - name: int_understat_stats
    description: >
      Stats Understat par match (npxG, npxG concédés, PPDA) rattachées au
      match_id unifié via int_understat_schedule. Alimente les colonnes xG
      et pressing de backbone.

  - name: int_whoscored_match_index
    description: >
      Pont d'identité entre l'univers WhoScored (ws_match_id, ws_home/away_team_id)
      et les clés unifiées (match_id, team_id normalisé). Table de résolution
      d'identité centrale pour toute la chaîne événementielle WhoScored.
      Grain : une ligne par match.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1), résolu via match_registry. NULL si le match n'est pas résolu au registre."
      - name: team_id
        description: "Id canonique de l'équipe À DOMICILE (résolu via team_mapping sur home_team_name)."
      - name: opponent_id
        description: "Id canonique de l'équipe À L'EXTÉRIEUR (résolu via team_mapping sur away_team_name)."
      - name: ws_match_id
        description: "Identifiant WhoScored du match (brut, depuis silver.stg_whoscored_match_index)."
      - name: match_date
        description: "Date du match."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: scraped_at
        description: "Horodatage ISO du scrape du match."
      - name: comp_category
        description: "Catégorie de compétition. Valeur actuelle : Big5 (les 5 grands championnats européens)."
      - name: ws_home_team_id
        description: "Id WhoScored (brut) de l'équipe à domicile — sert de clé pour mapper vers team_id."
      - name: ws_away_team_id
        description: "Id WhoScored (brut) de l'équipe à l'extérieur — sert de clé pour mapper vers opponent_id."

  - name: int_whoscored_events
    description: >
      Événements bruts WhoScored (silver.stg_whoscored_events) avec team_id
      normalisé et match_id unifié, résolus via int_whoscored_match_index.
      Point d'entrée de la chaîne événementielle. Grain : un événement.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index. NULL si le match n'est pas résolu au registre."
      - name: team_id
        description: "Id canonique de l'équipe de l'événement (converti depuis l'id WhoScored via int_whoscored_match_index)."
      - name: event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: minute
        description: "Minute de jeu brute (hors temps additionnel)."
      - name: second
        description: "Seconde dans la minute."
      - name: expanded_minute
        description: "Minute cumulée, temps additionnel inclus (ex. 45+2 → 47)."
      - name: period
        description: "Période : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match (FormationSet), 14 = fin de match (End)."
      - name: player_id
        description: "Identifiant WhoScored du joueur auteur de l'action. NULL possible sur certains événements."
      - name: x
        description: "Position X de l'action sur le terrain (0-100, croissant vers le but adverse ; repère relatif à l'équipe)."
      - name: y
        description: "Position Y de l'action (0-100, largeur, 50 = axe central)."
      - name: end_x
        description: "Position X de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: end_y
        description: "Position Y de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: type_id
        description: "Type d'événement WhoScored (cf. docs/Event_type_definition.txt ; ex. 1 Pass, 3 TakeOn, 4 Foul, 13-16 tirs)."
      - name: type_name
        description: "Libellé du type d'événement (Pass, TakeOn, Foul, Goal…)."
      - name: outcome_id
        description: "Résultat de l'action : 1 = réussi, 0 = raté."
      - name: outcome_name
        description: "Libellé du résultat : Successful / Unsuccessful."
      - name: is_touch
        description: "Booléen : le joueur a touché le ballon (flag WhoScored isTouch)."
      - name: is_shot
        description: "Booléen : l'événement est un tir (flag WhoScored isShot)."
      - name: qualifiers_json
        description: "Tableau JSON brut des qualifiers de l'événement — SOURCE DE VÉRITÉ des qualifiers (éclaté dans events_qual)."
      - name: scraped_at
        description: "Horodatage ISO du scrape du match."
      - name: row_num
        description: "Index de l'événement dans le flux du match (ordre chronologique)."
      - name: is_goal
        description: "Booléen : l'événement est un but (flag WhoScored isGoal). TRUE aussi pour les CSC (voir is_own_goal)."
      - name: is_own_goal
        description: "Booléen : but contre son camp (CSC)."
      - name: related_event_id
        description: "Champ WhoScored relatedEventId (haut niveau de l'event). Souvent NULL — le lien réel entre events miroirs passe par le qualifier 233."
      - name: related_player_id
        description: "Champ WhoScored relatedPlayerId (haut niveau de l'event). Souvent NULL."
      - name: card_type
        description: "Type de carton : Yellow / Red / SecondYellow. NULL hors événements Card."
      - name: goal_mouth_y
        description: >
          Position horizontale où le tir atteint la ligne de but (qualifier 102 GoalMouthY).
          Cadre : poteaux à Y≈45.2 et 54.8, centre 50. NULL hors tirs / non renseigné.
      - name: goal_mouth_z
        description: "Hauteur où le tir atteint la ligne de but (qualifier 103 GoalMouthZ). Barre à Z≈38. NULL hors tirs / non renseigné."
      - name: blocked_x
        description: "Coordonnée X (repère équipe, 0-100) du point où le tir est stoppé (qualifier 146 BlockedX). Renseigné pour une partie des tirs."
      - name: blocked_y
        description: "Coordonnée Y (repère équipe, 0-100) du point où le tir est stoppé (qualifier 147 BlockedY)."

  - name: int_whoscored_team_season
    description: >
      Ratings agrégés de saison WhoScored par équipe (attaque/défense, dribbles,
      tirs cadrés par match, différenciés Home/Away). Alimente les colonnes
      season_*/ws_* de backbone.

  # ════════════════════════════════════════════════════════════════════════════
  # CHAÎNE ÉVÉNEMENTIELLE — enrichissement et valorisation par action
  # ════════════════════════════════════════════════════════════════════════════

  - name: int_event_enriched
    description: >
      Événements WhoScored enrichis d'un pivot des qualifiers utiles, notamment
      la hiérarchie chance_creation (leading_to_goal, intentional_assist,
      big_chance_created, key_pass, shot_assist...). Table socle de event_values,
      player_possession_chains, player_network_duels et player_zone_transitions.
      Incrémentale sur scraped_at. Filtre : player_id IS NOT NULL.
    columns:
      # ── Héritées de int_whoscored_events (mêmes définitions) ───────────────────
      - name: match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index."
      - name: team_id
        description: "Id canonique de l'équipe de l'événement (converti depuis l'id WhoScored via int_whoscored_match_index)."
      - name: player_id
        description: "Identifiant WhoScored du joueur auteur de l'action. (Ici jamais NULL : la table filtre player_id IS NOT NULL.)"
      - name: event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
      - name: row_num
        description: "Index de l'événement dans le flux du match (ordre chronologique)."
      - name: expanded_minute
        description: "Minute cumulée, temps additionnel inclus (ex. 45+2 → 47)."
      - name: second
        description: "Seconde dans la minute."
      - name: period
        description: "Période : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match (FormationSet), 14 = fin de match (End)."
      - name: type_id
        description: "Type d'événement WhoScored (cf. docs/Event_type_definition.txt ; ex. 1 Pass, 3 TakeOn, 4 Foul, 13-16 tirs)."
      - name: type_name
        description: "Libellé du type d'événement (Pass, TakeOn, Foul, Goal…)."
      - name: outcome_id
        description: "Résultat de l'action : 1 = réussi, 0 = raté."
      - name: is_shot
        description: "Booléen : l'événement est un tir (flag WhoScored isShot)."
      - name: is_touch
        description: "Booléen : le joueur a touché le ballon (flag WhoScored isTouch)."
      - name: x
        description: "Position X de l'action sur le terrain (0-100, croissant vers le but adverse ; repère relatif à l'équipe)."
      - name: y
        description: "Position Y de l'action (0-100, largeur, 50 = axe central)."
      - name: end_x
        description: "Position X de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: end_y
        description: "Position Y de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: is_own_goal
        description: "Booléen : but contre son camp (CSC)."
      - name: related_event_id
        description: "Champ WhoScored relatedEventId. Souvent NULL — le lien réel entre events miroirs passe par le qualifier 233."
      - name: related_player_id
        description: "Champ WhoScored relatedPlayerId. Souvent NULL."
      - name: card_type
        description: "Type de carton : Yellow / Red / SecondYellow. NULL hors événements Card."
      - name: goal_mouth_y
        description: >
          Position horizontale où le tir atteint la ligne de but (qualifier 102 GoalMouthY).
          Cadre : poteaux à Y≈45.2 et 54.8, centre 50. NULL hors tirs / non renseigné.
      - name: goal_mouth_z
        description: "Hauteur où le tir atteint la ligne de but (qualifier 103 GoalMouthZ). Barre à Z≈38. NULL hors tirs / non renseigné."
      - name: blocked_x
        description: "Coordonnée X (repère équipe, 0-100) du point où le tir est stoppé (qualifier 146 BlockedX)."
      - name: blocked_y
        description: "Coordonnée Y (repère équipe, 0-100) du point où le tir est stoppé (qualifier 147 BlockedY)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: scraped_at
        description: "Horodatage ISO du scrape du match."
      # ── Héritée de int_whoscored_match_index ──────────────────────────────────
      - name: match_date
        description: "Date du match (rattachée via int_whoscored_match_index)."
      # ── Transformation : flags de qualifiers pivotés (0/1) ────────────────────
      - name: is_leading_to_goal
        description: "Flag (0/1) : l'action mène à un but (qualifier 170 LeadingToGoal)."
      - name: is_intentional_goal_assist
        description: "Flag (0/1) : passe décisive intentionnelle (qualifier 11111 IntentionalGoalAssist)."
      - name: is_intentional_assist
        description: "Flag (0/1) : passe intentionnelle vers une occasion (qualifier 154 IntentionalAssist)."
      - name: is_big_chance_created
        description: "Flag (0/1) : grosse occasion créée (qualifier 11112 BigChanceCreated)."
      - name: is_key_pass
        description: "Flag (0/1) : passe clé — mène à un tir (qualifier 11113 KeyPass)."
      - name: is_shot_assist
        description: "Flag (0/1) : passe précédant directement un tir (qualifier 210 ShotAssist)."
      - name: is_leading_to_attempt
        description: "Flag (0/1) : l'action mène à une tentative de tir (qualifier 169 LeadingToAttempt)."
      - name: has_defensive_qual
        description: "Flag (0/1) : l'action porte le qualifier 285 Defensive (côté défensif d'un duel)."
      - name: has_offensive_qual
        description: "Flag (0/1) : l'action porte le qualifier 286 Offensive (côté offensif d'un duel)."
      - name: has_opposite_event
        description: "Flag (0/1) : l'action porte le qualifier 233 OppositeRelatedEvent (lien vers l'event miroir adverse)."
      # ── Transformation : score cumulé reconstruit ─────────────────────────────
      - name: team_score
        description: "Buts cumulés de l'équipe de l'événement à cet instant du match (reconstruit)."
      - name: opp_score
        description: "Buts cumulés de l'équipe adverse à cet instant du match (reconstruit)."

  - name: event_values
    description: >
      Valorise chaque événement individuel selon deux axes : danger_position
      (localisation terrain pondérée offensif/défensif) et chance_creation
      (proxy xG hiérarchisé). Couche "value par action" consommée par les
      modèles de chaînes. Source : int_event_enriched. Incrémentale.

  # ════════════════════════════════════════════════════════════════════════════
  # COUPS DE PIED ARRÊTÉS
  # ════════════════════════════════════════════════════════════════════════════

  - name: corner_profiles
    description: >
      Profils de corners. Pour chaque chaîne déclenchée par un corner,
      caractérise la livraison (end_x/end_y, joueur, via qualifier CornerTaken=6)
      et l'issue de la séquence. Source : player_possession_chains. Incrémentale.

  # ════════════════════════════════════════════════════════════════════════════
  # RÉSEAU DE PASSES JOUEUR
  # player_passes_raw → player_network_passes → centrality / betweenness / duels
  #                                          → team_network_features
  # ════════════════════════════════════════════════════════════════════════════

  - name: player_passes_raw
    description: >
      Passes atomiques passeur → receveur reconstruites depuis les chaînes de
      possession (LEAD sur les événements de l'équipe en possession, sans sauter
      les événements adverses). Porte les flags is_progressive/is_creative/
      is_buildup et le chain_trigger. Brique de base du réseau de passes.
      Grain : une passe réussie (type 1, outcome 1, avec receveur).
    columns:
      # ── Héritées ───────────────────────────────────────────────────────────────
      - name: match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index."
        tests:
          - not_null
      - name: chain_id
        description: "Identifiant de la chaîne de possession (repris de player_possession_chains)."
      - name: chain_trigger
        description: "Déclencheur de la chaîne : recovery / corner / goal_kick / throw_in / free_kick / open_play (repris de player_possession_chains)."
      - name: team_id
        description: "Id canonique de l'équipe qui fait la passe (= chain_team_id, l'équipe en possession)."
      - name: row_num
        description: "Index de l'événement (la passe) dans le flux du match (ordre chronologique)."
      - name: expanded_minute
        description: "Minute cumulée, temps additionnel inclus (ex. 45+2 → 47)."
      - name: second
        description: "Seconde dans la minute."
      - name: x
        description: "Position X de départ de la passe (0-100, croissant vers le but adverse ; repère relatif à l'équipe)."
      - name: y
        description: "Position Y de départ de la passe (0-100, largeur, 50 = axe central)."
      - name: end_x
        description: "Position X de fin de la passe (repris de int_event_enriched)."
      - name: end_y
        description: "Position Y de fin de la passe (repris de int_event_enriched)."
      - name: is_key_pass
        description: "Flag (0/1) : passe clé — mène à un tir (qualifier 11113 KeyPass, repris de int_event_enriched)."
      - name: is_shot_assist
        description: "Flag (0/1) : passe précédant directement un tir (qualifier 210 ShotAssist, repris de int_event_enriched)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      # ── Transformations propres à player_passes_raw ───────────────────────────
      - name: passer_id
        description: "Joueur qui effectue la passe (= player_id de l'événement Pass)."
      - name: receiver_id
        description: "Joueur qui reçoit = prochain joueur de la MÊME équipe dans la chaîne (LEAD sur les événements de l'équipe en possession)."
      - name: is_progressive
        description: "Booléen : la passe avance le ballon d'au moins 10 unités (≈10 m) vers le but adverse (end_x > x + 10)."
      - name: is_creative
        description: "Booléen : la passe mène directement à un tir (is_key_pass OU is_shot_assist)."
      - name: is_buildup
        description: "Booléen : la passe est jouée dans la moitié défensive (x < 50)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: player_network_passes
    description: >
      Arêtes du graphe de passes agrégées par (match, équipe, passeur, receveur) :
      volume total et ventilé par contexte (contre-attaque, open play, recovery,
      autre), passes progressives/créatives/buildup. Source : player_passes_raw.

  - name: player_network_centrality
    description: >
      Centralité de chaque joueur dans le réseau de passes : degrés entrant et
      sortant (bruts et pondérés par le volume), passes créatives/progressives
      émises et reçues. Source : player_network_passes.

  - name: player_network_betweenness
    description: >
      Modèle Python (dbt-python). Calcule la betweenness centrality exacte par
      (match, équipe) avec networkx sur le graphe pondéré de passes (normalized=True,
      weight=n_passes). Identifie les joueurs-ponts. Source : player_network_passes.

  - name: player_network_duels
    description: >
      Apparie les duels adverses via le qualifier 233 (miroir d'événement) pour
      relier le joueur A et son vis-à-vis B sur le même affrontement. Matière
      première des duels individuels. Sources : events_qual, int_event_enriched.

  - name: team_network_features
    description: >
      Agrège les métriques réseau joueur → features d'équipe par match : nombre
      de joueurs et d'arêtes actifs, dépendance au top créateur (top_creator_share),
      betweenness moyenne, entropie de Shannon du réseau (network_entropy).
      Source : player_network_centrality.

  # ════════════════════════════════════════════════════════════════════════════
  # xG / MENACE / ZONES
  # ════════════════════════════════════════════════════════════════════════════

  - name: player_xg_chain
    description: >
      Attribue une valeur xG (proxy via chance_creation du tir terminal) aux
      joueurs impliqués dans une chaîne se terminant par un tir — crédit offensif
      réparti sur la chaîne. Source : player_possession_chains. Incrémentale.

  - name: threat_conceded
    description: >
      Symétrique défensif de player_xg_chain : attribue la menace concédée sur
      les chaînes adverses terminées par un tir (penalty exclu), pour mesurer la
      responsabilité défensive. Source : player_xg_chain. Incrémentale.

  - name: player_zone_transitions
    description: >
      Compte les transitions de zone (zone_from → zone_to) par joueur, ventilées
      par période, état au score (score_state) et formation. Décrit les patterns
      de circulation du ballon. Source : int_event_enriched (via player_passes_raw
      pour les passes + TakeOns réussis). Incrémentale.
      Grain : (match, équipe, joueur, zone_from, zone_to, période, score_state, formation).
      Les « déplacements » = passes réussies + dribbles (TakeOn) réussis.
    columns:
      # ── Héritées ───────────────────────────────────────────────────────────────
      - name: match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index."
      - name: team_id
        description: "Id canonique de l'équipe du joueur (converti depuis l'id WhoScored via int_whoscored_match_index)."
      - name: player_id
        description: "Identifiant WhoScored du joueur auteur des déplacements."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: period
        description: "Période : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match, 14 = fin de match."
      # ── Transformations ───────────────────────────────────────────────────────
      - name: score_state
        description: "État au score au moment des déplacements : winning / losing / drawing (buts cumulés équipe vs adverse)."
      - name: formation
        description: "Code de la formation active de l'équipe à cet instant (via FormationSet/FormationChange, qualifier 130)."
      - name: zone_from
        description: >
          Cellule de DÉPART (grille 3×5). Bande latérale sur y : A (y<33.3), B (33.3–66.6),
          C (≥66.6) ; bande longitudinale sur x : 1 (x≥80, près du but adverse), 2 (≥60),
          3 (≥40), 4 (≥20), 5 (<20, près de son but). Ex. B1 = axe central, tiers offensif.
      - name: zone_to
        description: "Cellule d'ARRIVÉE du déplacement, même encodage 3×5, calculée depuis end_x / end_y."
      - name: n_transitions
        description: "Nombre de déplacements (passes + dribbles réussis) dans le groupe zone_from → zone_to."
      - name: pct_transitions
        description: "Part de ces déplacements sur l'ensemble des déplacements du joueur dans le contexte (match, période, score_state, formation)."
      - name: progressive_rate
        description: "Part des déplacements progressifs (end_x > x + 10, ≈10 m vers le but adverse) dans le groupe."

  - name: int_whoscored_player_match
    description: >
      Stats + note WhoScored par joueur par match, identités normalisées.
      Traduit l'id d'équipe WhoScored vers le team_id canonique et rattache le
      match_id unifié via int_whoscored_match_index (même logique que
      int_whoscored_events). player_id reste l'id WhoScored (clé vers
      silver.stg_whoscored_players_ref). Source : silver.stg_whoscored_player_match.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: "Id canonique de l'équipe (converti depuis l'id WhoScored)"
      - name: player_id
        description: "Identifiant WhoScored du joueur (FK vers stg_whoscored_players_ref)"
        tests:
          - not_null
      - name: rating
        description: "Note WhoScored finale du joueur sur le match"
      - name: stats_json
        description: "Stats du joueur par minute (JSON brut) — totaux calculés plus tard"

  - name: int_whoscored_formations
    description: >
      Timeline tactique par équipe par match, identités normalisées (team_id
      canonique + match_id unifié via int_whoscored_match_index).
      formation_id reste la clé vers silver.stg_whoscored_formations_ref.
      Source : silver.stg_whoscored_formations.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: "Id canonique de l'équipe (converti depuis l'id WhoScored)"
      - name: formation_id
        description: "Identifiant de la formation (FK vers stg_whoscored_formations_ref)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - team_id
            - formation_seq

  - name: int_whoscored_team_match
    description: >
      Stats d'équipe officielles WhoScored par match, identités normalisées.
      Conserve stats_json brut (35 métriques par minute) ; extraction des totaux
      plus tard. Source : silver.stg_whoscored_team_match.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: "Id canonique de l'équipe (converti depuis l'id WhoScored)"
      - name: stats_json
        description: "Stats équipe par minute (JSON brut) — totaux calculés plus tard"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - team_id

  - name: int_whoscored_players
    description: >
      Dimension joueur par saison et par équipe — grain (player_id, season,
      team_id canonique). Un transfert en cours de saison = plusieurs lignes.
      Profil courant height/weight (âge exclu car WhoScored renvoie l'âge du
      scrape, pas du match). Sources : int_whoscored_player_match,
      int_whoscored_match_index, silver.stg_whoscored_players_ref.
    columns:
      - name: player_id
        description: "Identifiant WhoScored du joueur"
        tests:
          - not_null
      - name: season
        description: "Saison (rattachée via le match)"
      - name: team_id
        description: "Id canonique de l'équipe"
      - name: player_name
        description: "Nom du joueur (depuis la table de référence)"
      - name: height
        description: "Taille du joueur (cm, depuis la table de référence)"
      - name: weight
        description: "Poids du joueur (kg, depuis la table de référence)"
      - name: n_matchs
        description: "Nombre de matchs joués pour cette équipe cette saison"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - player_id
            - season
            - team_id

  - name: int_whoscored_lineup
    description: >
      Composition positionnelle par période de formation — grain (match × équipe
      × formation_seq × joueur), une ligne par titulaire (slot 1..11). La position
      est récupérée via le slot du joueur (formation_positions[slot]), pas par
      alignement d'index : robuste aux trous de slot (carton rouge). Identités
      normalisées (team_id canonique + match_id unifié via int_whoscored_match_index).
      Source : silver.stg_whoscored_formations (prérequis : formation_slots rempli).
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: "Id canonique de l'équipe (converti depuis l'id WhoScored)"
      - name: player_id
        description: "Identifiant WhoScored du joueur titulaire"
        tests:
          - not_null
      - name: slot
        description: "Slot de formation 1..11 (1 = gardien)"
      - name: grid_vertical
        description: "Coordonnée verticale sur la grille tactique (0 = ligne de but propre)"
      - name: grid_horizontal
        description: "Coordonnée horizontale sur la grille tactique (5 = axe central)"
      - name: is_captain
        description: "Vrai si ce joueur est le capitaine sur cette période"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - team_id
            - formation_seq
            - player_id

  - name: int_shot_placement
    description: >
      Placement de tir au grain « un tir » — base du Post-Shot xG (xGOT).
      Tirs (types 13/14/15/16) issus de int_event_enriched, avec la géométrie du
      placement dans le cadre du but (goal_mouth_y/z) dérivée pour les tirs cadrés :
      zone 3×3, écart au centre, hauteur, distance normalisée à la lucarne. Le xGOT
      entraîné reste en aval ; ce modèle expose les entrées + un xG pré-tir proxy.
      Sources : int_event_enriched, event_values.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1). Clé de match commune à tout le projet."
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: >
          Id canonique de l'équipe qui tire (converti depuis l'id WhoScored).
          CAS CSC : pour un but contre son camp, team_id est l'équipe QUI CONCÈDE
          (celle du joueur marquant c.s.c.), pas celle qui profite du but.
      - name: player_id
        description: "Identifiant WhoScored du joueur qui tire."
        tests:
          - not_null
      - name: event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
      - name: row_num
        description: "Index de l'événement dans le flux du match (ordre chronologique). Unique par match avec match_id."
      - name: expanded_minute
        description: "Minute de jeu du tir, temps additionnel inclus (ex. 45+2 → 47)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: scraped_at
        description: "Horodatage ISO du scrape de ce match (sert au filtre incrémental)."
      - name: type_id
        description: "Type d'événement WhoScored : 13 MissedShots, 14 ShotOnPost, 15 SavedShot, 16 Goal."
      - name: type_name
        description: "Libellé du type d'événement (MissedShots / ShotOnPost / SavedShot / Goal)."
      - name: x
        description: "Position X de la frappe sur le terrain, échelle 0-100 (x croissant vers le but adverse)."
      - name: y
        description: "Position Y de la frappe sur le terrain, échelle 0-100 (largeur, 50 = axe central)."
      - name: goal_mouth_y
        description: >
          Position horizontale (largeur) où le tir franchit ou atteint la ligne de but
          (qualifier 102 GoalMouthY, définition Opta). Cadre : poteaux à Y≈45.2 et 54.8,
          centre 50. NULL si non renseigné à la source.
      - name: goal_mouth_z
        description: >
          Hauteur à laquelle le tir franchit/atteint la ligne de but (qualifier 103
          GoalMouthZ). Barre à Z≈38. NULL si non renseigné à la source.
      - name: blocked_x
        description: >
          Coordonnée X (repère de l'équipe qui tire, 0-100) du point où le tir est STOPPÉ
          (qualifier 146 BlockedX). Pour un tir arrêté, c'est la position de l'arrêt du
          gardien (vérifié sur exemple : blocked_x ≈ position du Save adverse converti).
          Peut aussi marquer un contre défenseur si le qualifier 82 Blocked est présent.
          Renseigné seulement pour une partie des tirs.
      - name: blocked_y
        description: >
          Coordonnée Y (repère de l'équipe qui tire, 0-100) du point où le tir est stoppé
          (qualifier 147 BlockedY). Même sémantique que blocked_x.
      - name: is_goal
        description: >
          Booléen : événement de type but (type_id = 16). ⚠️ Inclut 306 buts contre
          son camp (CSC) rattachés à l'équipe qui CONCÈDE, pas à celle qui marque.
          Pour « but marqué par l'équipe qui tire », exclure les CSC via is_own_goal.
          À filtrer aussi pour le xGOT (un CSC n'est pas un tir cadré normal).
      - name: is_own_goal
        description: >
          Booléen : le but est un but contre son camp (CSC). TRUE pour les 306 CSC
          (type 16), sinon FALSE/NULL. Combiné à is_goal, permet d'isoler les vrais
          buts de l'équipe qui tire. Propagé depuis int_event_enriched.
      - name: is_on_target
        description: "Booléen : tir cadré (SavedShot ou Goal, type 15/16). Seuls les tirs cadrés portent les dérivés de placement."
      - name: pre_shot_xg_proxy
        description: >
          Proxy de xG pré-tir = chance_creation issu de event_values (baseline du xGOT).
          Non calibré : sert d'entrée/repère, pas de probabilité exacte.
      - name: offset_center
        description: "Écart horizontal au centre du but : ABS(goal_mouth_y - 50). Tirs cadrés uniquement, NULL sinon."
      - name: height
        description: "Hauteur du tir dans le but (= goal_mouth_z). Tirs cadrés uniquement, NULL sinon."
      - name: placement_col
        description: "Colonne de la grille 3×3 du cadre : left / center / right (selon goal_mouth_y). Tirs cadrés uniquement."
      - name: placement_row
        description: "Rangée de la grille 3×3 : low / mid / high (selon goal_mouth_z). Tirs cadrés uniquement."
      - name: placement_zone
        description: "Zone 3×3 du cadre (rangée_colonne, ex: high_left = lucarne gauche). Tirs cadrés uniquement, NULL sinon."
      - name: corner_dist
        description: "Distance normalisée à la lucarne la plus proche (0 = pleine lucarne, plus grand = plus central/bas). Tirs cadrés uniquement."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: int_whoscored_lineup_agg
    description: >
      Features positionnelles au grain joueur×match, agrégées depuis
      int_whoscored_lineup : position moyenne pondérée par les minutes, slot
      principal, capitaine, nombre de périodes tactiques. Couverture liée à
      formation_slots (se remplit avec le load des archives).
      Source : int_whoscored_lineup.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: player_id
        description: "Identifiant WhoScored du joueur"
        tests:
          - not_null
      - name: avg_vertical
        description: "Position verticale moyenne (0 = ligne de but propre, ~10 = attaque)"
      - name: avg_horizontal
        description: "Position horizontale moyenne (5 = axe central)"
      - name: primary_slot
        description: "Slot de formation dominant (1..11, 1 = gardien)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - team_id
            - player_id

  - name: int_penalties
    description: >
      Penaltys au grain « un penalty tiré ». Pivot = la frappe (types 13/14/15/16
      portant qual 9) : tireur, résultat (marqué/arrêté/poteau/hors-cadre) et
      placement (goal_mouth_*). Rattachés en LEFT JOIN : PenaltyFaced (type 58, même
      instant) → équipe qui défend + gardien ; le foul en double (type 4 + qual 9)
      → joueur qui obtient / concède, dans une fenêtre de 300 s avant la frappe.
      Sources : int_event_enriched, int_whoscored_events, events_qual.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: attacking_team_id
        description: "Id canonique de l'équipe qui tire le penalty"
        tests:
          - not_null
      - name: taker_player_id
        description: "Joueur qui tire le penalty"
        tests:
          - not_null
      - name: defending_team_id
        description: "Équipe qui défend (via type 58). NULL si pas de PenaltyFaced apparié (~0,1 %)."
      - name: gk_player_id
        description: "Gardien face au penalty (via type 58)"
      - name: player_conceded
        description: "Joueur ayant concédé la faute (via qual 233). Rattaché à 100 %."
      - name: player_drew
        description: "Joueur ayant obtenu le penalty. Souvent NULL (limite données WhoScored, ~23 %)."
      - name: result_label
        description: "scored | saved | post | off_target"
        tests:
          - accepted_values:
              values: ['scored', 'saved', 'post', 'off_target']
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: int_fouls_drawn
    description: >
      Fautes subies (coups francs obtenus) au grain « une faute subie » : côté
      outcome_id=1 des events Foul (type 4). Rattache le fautif via le qual 233
      (OppositeRelatedEvent, déterministe 100 %), la localisation (x/y, zone), le
      tiers offensif (x > 66.7) et si la faute donne un penalty. Le joueur qui subit
      est NULL ~5 % (limite source). Source : int_whoscored_events, events_qual.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: drawing_team_id
        description: "Équipe qui subit la faute / obtient le coup franc"
        tests:
          - not_null
      - name: drawer_player_id
        description: "Joueur qui subit la faute. NULL ~5 % (non renseigné à la source)."
      - name: committed_by_player_id
        description: "Fautif, rattaché via qual 233. NULL <1 %."
      - name: is_attacking_third
        description: "Faute subie dans le tiers offensif (x > 66.7) — coup franc dangereux. NULL si x absent."
      - name: leads_to_penalty
        description: "Vrai si la faute donne un penalty (qual 9 présent)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: int_defensive_blocks
    description: >
      Contres défensifs au grain « un contre », avec le défenseur qui bloque.
      Basé sur l'event type 74 BlockedPass (bloqueur toujours nommé), rattaché à la
      passe bloquée via le qual 233 (99,4 %). Ce sont des contres de PASSE ; les
      contres de tir n'ont pas de bloqueur nommé chez Opta et sont hors périmètre.
      Le join qual 233 contraint l'équipe adverse (event_id scopé par équipe).
      Source : int_whoscored_events, events_qual.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: blocking_team_id
        description: "Équipe qui bloque (défend)"
        tests:
          - not_null
      - name: blocker_player_id
        description: "Défenseur qui bloque (type 74). Toujours renseigné."
        tests:
          - not_null
      - name: blocked_team_id
        description: "Équipe dont la passe est bloquée (adverse)"
      - name: blocked_player_id
        description: "Joueur dont la passe/action est bloquée (via qual 233). NULL <1 %."
      - name: blocked_type
        description: "Type d'action bloquée (surtout Pass)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: int_shot_creating_actions
    description: >
      Actions créatrices de tir (SCA) et de but (GCA), standard FBref/StatsBomb.
      Une ligne par crédit = (tir, sca_order 1|2) : les 2 actions offensives de
      l'équipe qui tire, dans la même chaîne de possession, juste avant le tir
      (Pass, TakeOn, faute obtenue, tir/rebond). is_gca vrai si le tir est un but.
      Source : player_possession_chains.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: sca_order
        description: "1 = action juste avant le tir, 2 = l'action précédente"
      - name: attacking_team_id
        description: "Équipe qui tire"
        tests:
          - not_null
      - name: creator_player_id
        description: "Joueur crédité de l'action créatrice"
        tests:
          - not_null
      - name: action_type
        description: "Type de l'action créatrice (Pass, TakeOn, tir…)"
      - name: is_gca
        description: "Vrai si le tir est un but → ce crédit compte aussi en GCA"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - shot_row_num
            - sca_order

  - name: int_progressive_carries
    description: >
      Conduites (dribbles) au grain « un dribble réussi » : TakeOn (type 3) réussis
      côté offensif (outcome 1 + qual 286). WhoScored n'a pas d'event carry ; le
      TakeOn est la seule conduite balle au pied enregistrée. Progression mesurée du
      dribble jusqu'à la touche suivante du joueur dans la même chaîne, en mètres
      (réduction de distance au but). is_progressive = gain ≥ 5 m.
      Source : player_possession_chains, events_qual.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: "Équipe du dribbleur"
        tests:
          - not_null
      - name: player_id
        description: "Joueur qui réussit le dribble"
        tests:
          - not_null
      - name: progress_m
        description: "Gain de distance vers le but adverse (m). NULL si pas de touche suivante en chaîne."
      - name: is_progressive
        description: "Vrai si la conduite gagne ≥ 5 m vers le but"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: int_substitutions
    description: >
      Changements au grain « un remplacement » : joueur qui sort (SubstitutionOff,
      type 18) apparié à celui qui entre (SubstitutionOn, type 19) par rang au sein
      du groupe (match, équipe, minute, seconde) — gère les changements simultanés.
      Croisé avec related_player_id (présent 27 %) : concordance 99,8 %. sub_number =
      k-ième changement de l'équipe. Source : int_whoscored_events.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: team_id
        description: "Équipe qui effectue le changement"
        tests:
          - not_null
      - name: player_off
        description: "Joueur qui sort"
        tests:
          - not_null
      - name: player_on
        description: "Joueur qui entre. NULL si sortie sans remplaçant (ex. carton rouge)."
      - name: expanded_minute
        description: "Minute du changement (temps additionnel inclus)"
      - name: sub_number
        description: "k-ième changement de l'équipe dans le match"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - off_row_num

  - name: int_xt_actions
    description: >
      Actions atomiques pour l'expected threat (xT), affectées à la grille fine
      16×12. Grain : une action de possession (déplacement, tir OU perte de balle).
      L'affectation (x,y)→case est définie UNIQUEMENT ici (col/row) et relue telle
      quelle par xt_grid.py et int_xt_contributions. Déplacements = passes réussies
      (player_passes_raw) + dribbles TakeOn réussis. Tirs = int_shot_placement, hors
      CSC. Pertes = fin de possession (passe/dribble ratés, contrôle manqué,
      Dispossessed, OffsidePass) depuis int_event_enriched.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
        tests:
          - not_null
      - name: row_num
        description: "Index de l'événement dans le match (ordre chronologique)."
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: team_id
        description: "Id canonique de l'équipe de l'action."
      - name: player_id
        description: "Identifiant WhoScored du joueur (passeur, dribbleur ou tireur)."
      - name: action_kind
        description: "Type d'action : 'move' (passe/dribble réussi, avec destination), 'shot' (tir), ou 'turnover' (perte de balle, sans destination)."
      - name: is_shot
        description: "Booléen : l'action est un tir."
      - name: is_goal
        description: "Booléen : le tir est un but (renseigné pour les tirs ; NULL pour déplacements et pertes)."
      - name: col_from
        description: "Colonne (0-15) de la case de DÉPART sur la grille 16×12 (0 = son but, 15 = but adverse). = GREATEST(0, LEAST(15, INT(x/100·16)))."
      - name: row_from
        description: "Ligne (0-11) de la case de départ (largeur, ~6 = axe central). = GREATEST(0, LEAST(11, INT(y/100·12)))."
      - name: col_to
        description: "Colonne (0-15) de la case d'ARRIVÉE (déplacements). NULL pour les tirs et les dribbles sans touche suivante."
      - name: row_to
        description: "Ligne (0-11) de la case d'arrivée (déplacements). NULL pour les tirs et les dribbles sans touche suivante."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: int_xt_contributions
    description: >
      Contributions Expected Threat (xT) : xT ajouté par déplacement. Grain :
      1 ligne par déplacement (int_xt_actions action_kind='move' avec destination).
      xT_ajouté = xT(case d'arrivée) − xT(case de départ), attribué au joueur/équipe ;
      positif = progression vers le but adverse. Grille lue depuis
      machine_learning.xt_grid (étalon global). Matérialisé en table.
    columns:
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
        tests:
          - not_null
      - name: row_num
        description: "Index de l'événement dans le match. Avec match_id, clé unique."
      - name: season
        description: "Saison du match."
      - name: league_source
        description: "Championnat / source des données."
      - name: team_id
        description: "Équipe qui effectue le déplacement."
      - name: player_id
        description: "Joueur qui effectue le déplacement (passeur ou dribbleur)."
      - name: col_from
        description: "Colonne (0-15) de la case de départ."
      - name: row_from
        description: "Ligne (0-11) de la case de départ."
      - name: col_to
        description: "Colonne (0-15) de la case d'arrivée."
      - name: row_to
        description: "Ligne (0-11) de la case d'arrivée."
      - name: xt_from
        description: "Valeur xT de la case de départ (machine_learning.xt_grid)."
      - name: xt_to
        description: "Valeur xT de la case d'arrivée (machine_learning.xt_grid)."
      - name: xt_added
        description: "xT ajouté = xt_to − xt_from. Positif = progression vers le but."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num
