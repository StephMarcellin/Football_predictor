  - name: int_whoscored_team_match_minute
    description: >
      Stats d'équipe WhoScored éclatées minute par minute — grain (match × équipe
      × minute jouée). Minute au format expanded (45+2 = 47, cf. int_whoscored_formations).
      Une minute absente d'une métrique dans le JSON source = l'action n'a pas eu
      lieu → 0.0 (COALESCE), jamais NULL. Colonnes *_success_value / *_accuracy_value
      / *_pct_value sont des ratios cumulatifs glissants du JSON source (biaisés,
      cf. rating) — ne jamais les sommer ni les moyenner ; recalculer depuis les
      compteurs bruts (accurate/total) en aval, cf. int_whoscored_team_match_agg.
      Source : int_whoscored_team_match.
    columns:
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1)"
        tests:
          - not_null:
              config:
                severity: warn
      - name: str_team_id
        description: "Id canonique de l'équipe"
      - name: int_minute
        description: "Minute expanded du match (0-based, ex. 45+2 = 47)"
      - name: dec_rating
        description: "Moyenne des ratings joueurs à cette minute — cumulatif glissant, non exploitable tel quel (cf. note table). Non utilisé en agrégation."
      - name: shots_total_value
        description: "Tirs tentés à cette minute"
      - name: shots_on_target_value
        description: "Tirs cadrés à cette minute"
      - name: shots_off_target_value
        description: "Tirs non cadrés à cette minute"
      - name: shots_blocked_value
        description: "Tirs contrés à cette minute"
      - name: clearances_value
        description: "Dégagements à cette minute"
      - name: interceptions_value
        description: "Interceptions à cette minute"
      - name: possession_value
        description: "Compte de possessions (nombre de fois où l'équipe a eu le ballon) à cette minute — pas un pourcentage"
      - name: touches_value
        description: "Touches de balle à cette minute"
      - name: passes_total_value
        description: "Passes tentées à cette minute"
      - name: passes_accurate_value
        description: "Passes réussies à cette minute"
      - name: passes_key_value
        description: "Passes clés à cette minute"
      - name: pass_success_value
        description: "Pourcentage de passes réussies (source WhoScored, cumulatif glissant) — ne pas sommer/moyenner, recalculer depuis passes_accurate/passes_total en aval"
      - name: aerials_total_value
        description: "Duels aériens disputés à cette minute"
      - name: aerials_won_value
        description: "Duels aériens gagnés à cette minute"
      - name: aerial_success_value
        description: "Pourcentage de duels aériens gagnés (source WhoScored, cumulatif glissant) — ne pas sommer/moyenner, recalculer depuis aerials_won/aerials_total en aval"
      - name: corners_total_value
        description: "Corners tentés à cette minute"
      - name: corners_accurate_value
        description: "Corners réussis à cette minute"
      - name: throw_ins_total_value
        description: "Touches (remises en jeu) tentées à cette minute"
      - name: throw_ins_accurate_value
        description: "Touches (remises en jeu) réussies à cette minute"
      - name: throw_in_accuracy_value
        description: "Pourcentage de réussite aux touches (source WhoScored, cumulatif glissant) — ne pas sommer/moyenner, recalculer depuis throw_ins_accurate/throw_ins_total en aval"
      - name: offsides_caught_value
        description: "Hors-jeux sifflés à cette minute"
      - name: fouls_committed_value
        description: "Fautes commises à cette minute"
      - name: tackles_total_value
        description: "Tacles tentés à cette minute"
      - name: tackles_successful_value
        description: "Tacles réussis à cette minute"
      - name: tackles_unsuccessful_value
        description: "Tacles manqués à cette minute"
      - name: tackle_success_value
        description: "Pourcentage de tacles réussis (source WhoScored, cumulatif glissant) — ne pas sommer/moyenner, recalculer depuis tackles_successful/tackles_total en aval"
      - name: dribbled_past_value
        description: "Fois où le joueur/l'équipe a été dribblé à cette minute"
      - name: dribbles_won_value
        description: "Dribbles réussis à cette minute"
      - name: dribbles_attempted_value
        description: "Dribbles tentés à cette minute"
      - name: dribbles_lost_value
        description: "Dribbles perdus à cette minute"
      - name: dribble_success_value
        description: "Pourcentage de dribbles réussis (source WhoScored, cumulatif glissant) — ne pas sommer/moyenner, recalculer depuis dribbles_won/dribbles_attempted en aval"
      - name: dispossessed_value
        description: "Pertes de balle sous pression à cette minute"
      - name: errors_value
        description: "Erreurs menant à une occasion adverse à cette minute"
      - name: defensive_aerials_value
        description: "Duels aériens défensifs à cette minute — sous-catégorie non confirmée d'aerials_total (à vérifier, cf. passation)"
      - name: offensive_aerials_value
        description: "Duels aériens offensifs à cette minute — sous-catégorie non confirmée d'aerials_total (à vérifier, cf. passation)"
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - str_match_id
            - str_team_id
            - int_minute

