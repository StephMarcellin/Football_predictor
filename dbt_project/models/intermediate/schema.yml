      - name: n_progressive_passes_losing
        description: "Nombre de passes progressives du joueur quand l'équipe est menée au score."
      - name: n_defensive_actions_losing
        description: "Nombre de actions défensives du joueur quand l'équipe est menée au score."
      - name: n_shots_losing
        description: "Nombre de tirs du joueur quand l'équipe est menée au score."
      - name: n_aerial_won
        description: "Duels aériens gagnés par le joueur dans le match."
      - name: aerial_win_rate
        description: "Taux de duels aériens gagnés (n_aerial_won / total des duels aériens)."
      - name: n_errors_lead_to_goal
        description: "Nombre d'erreurs du joueur ayant mené à un but."
      - name: n_errors_lead_to_shot
        description: "Nombre d'erreurs du joueur ayant mené à un tir."

      # ── Métriques générales ──────────────────────────────────────
      - name: n_actions
        description: "Nombre total d'actions du joueur dans le match"
        tests:
          - is_positive
      - name: xg_contribution
        description: >
          Contribution xG estimée — nombre de tirs pondéré par la distance
          géométrique au centre du but adverse.
        tests:
          - is_positive

      # ── Métriques offensives ─────────────────────────────────────
      - name: n_shots
        description: "Nombre de tirs tentés"
        tests:
          - is_positive
      - name: n_shots_regular_play
        description: "Tirs dans le jeu collectif (qualifier RegularPlay=22)"
        tests:
          - is_positive
      - name: n_shots_individual_play
        description: "Tirs après action individuelle (qualifier IndividualPlay=215)"
        tests:
          - is_positive
      - name: n_shot_assists
        description: "Passes directement avant un tir (qualifier ShotAssist=210)"
        tests:
          - is_positive
      - name: n_key_passes
        description: "Passes clés WhoScored (qualifier KeyPass=11113)"
        tests:
          - is_positive
      - name: n_longballs
        description: "Longues passes (qualifier Longball=1, type Pass)"
        tests:
          - is_positive
      - name: n_crosses
        description: "Centres (qualifier Cross=2, type Pass)"
        tests:
          - is_positive
      - name: n_throughballs
        description: "Passes en profondeur (qualifier Throughball=4, type Pass)"
        tests:
          - is_positive
      - name: n_progressive_passes
        description: >
          Passes réussies faisant avancer le ballon de 10+ unités
          vers le but adverse (end_x > x + 10).
        tests:
          - is_positive

      # ── Métriques défensives ─────────────────────────────────────
      - name: n_tackles
        description: "Nombre de tacles tentés (type_id=7)"
        tests:
          - is_positive
      - name: n_tackles_won
        description: "Nombre de tacles réussis (type_id=7, outcome_id=1)"
        tests:
          - is_positive
      - name: n_interceptions
        description: "Nombre d'interceptions (type_id=8)"
        tests:
          - is_positive
      - name: n_ball_recoveries
        description: "Récupérations de balle libre (type_id=49)"
        tests:
          - is_positive
      - name: n_challenges
        description: >
          Challenges offensifs (type_id=45, toujours Unsuccessful).
          Signal de pressing et de résistance au tackle.
        tests:
          - is_positive
      - name: n_clearances
        description: "Dégagements défensifs (type_id=12)"
        tests:
          - is_positive
      - name: defensive_zone_x
        description: >
          Position X moyenne des actions défensives
          (tackles, interceptions, récupérations, challenges, dégagements).
          Mesure la hauteur de la ligne défensive du joueur.
          Valeur basse = défend profond, valeur haute = pressing haut.

      # ── Discipline ───────────────────────────────────────────────
      - name: n_yellow_cards
        description: "Cartons jaunes reçus par le joueur (event type 17, card_type=Yellow)"
        tests:
          - is_positive
      - name: n_second_yellows
        description: "Deuxièmes cartons jaunes (expulsion indirecte, card_type=SecondYellow)"
        tests:
          - is_positive
      - name: n_red_cards
        description: "Cartons rouges directs reçus (card_type=Red)"
        tests:
          - is_positive

      # ── Création (lien direct related_player_id) ─────────────────
      - name: n_assists
        description: >
          Passes décisives — buts où le joueur est le créateur direct
          (related_player_id). Conservateur vs qualifier 11111, mais lien exact.
        tests:
          - is_positive
      - name: n_chances_created
        description: "Tirs créés par le joueur (related_player_id sur un tir, toutes issues)"
        tests:
          - is_positive

      # ── Duels aériens offensifs / défensifs ──────────────────────
      - name: n_aerial_offensive
        description: "Duels aériens offensifs (type 44 + qualifier 286)"
        tests:
          - is_positive
      - name: n_aerial_defensive
        description: "Duels aériens défensifs (type 44 + qualifier 285)"
        tests:
          - is_positive

  - name: team_features_ws
    description: >
      Features tactiques WhoScored par équipe par match.
      Calculées depuis silver.stg_whoscored_events et intermediate.events_qual.
      32 métriques couvrant le pressing, les zones d'attaque, la structure défensive.
    columns:
      - name: team_id
        description: "Identifiant WhoScored de l'équipe"
        tests:
          - not_null
      - name: ws_field_tilt_actions
        description: "Tilt de terrain — proportion de touches en zone offensive"
      - name: ws_momentum_delta
        description: "Delta de momentum après avoir encaissé un but (actions post / actions pre)"
      - name: ws_zone_att_pct
        description: "Pourcentage de touches en zone offensive (x > 66.6)"
      - name: ws_counter_attack_dna
        description: "ADN contre-attaque — proportion de tirs issus d'une récupération < 15 secondes"
      - name: ws_midfield_control_idx
        description: "Contrôle du milieu — part des actions réussies en zone centrale"
      - name: ws_defensive_line_height
        description: "Hauteur moyenne de la ligne défensive (position X)"
      - name: ws_flank_exposure_asymm
        description: "Asymétrie d'exposition sur les flancs — différentiel gauche/droite"
      - name: match_id
        description: "Identifiant unifié du match (SHA1)."
      - name: ws_high_turnover_rate
        description: "Taux de pertes de balle en zone haute = turnovers_high_zone / total_passes."
      - name: ws_deep_completion_rt
        description: "Taux de passes complétées en zone profonde (deep completions) = deep_completions / total_passes."
      - name: ws_counter_shot_rate
        description: "Part des tirs issus de contre-attaque = shots_counter_attack / total_shots."
      - name: ws_set_piece_pressure
        description: "Part des actions offensives issues de coups de pied arrêtés = set_pieces_offensive / offensive_actions."
      - name: ws_attack_left_pct
        description: "Part des touches offensives sur le flanc gauche = att_touches_left / att_touches_total."
      - name: ws_attack_center_pct
        description: "Part des touches offensives dans l'axe = att_touches_center / att_touches_total."
      - name: ws_attack_right_pct
        description: "Part des touches offensives sur le flanc droit = att_touches_right / att_touches_total."
      - name: ws_zone_def_pct
        description: "Part des touches de l'équipe en zone défensive = zone_def_touches / total_touches."
      - name: ws_zone_mid_pct
        description: "Part des touches en zone médiane = zone_mid_touches / total_touches."
      - name: ws_shot_six_yard_pct
        description: "Part des tirs pris dans les 6 mètres = shots_six_yard / total_shots."
      - name: ws_shot_penalty_pct
        description: "Part des tirs pris dans la surface = shots_penalty_area / total_shots."
      - name: ws_shot_oob_pct
        description: "Part des tirs pris hors de la surface = shots_out_of_box / total_shots."
      - name: ws_shot_open_play_pct
        description: "Part des tirs en jeu ouvert = shots_open_play / total_shots."
      - name: ws_shot_set_piece_pct
        description: "Part des tirs sur coup de pied arrêté = shots_set_piece / total_shots."
      - name: ws_shot_penalty_att_pct
        description: "Part des tirs qui sont des penalties = shots_penalty / total_shots."
      - name: ws_conversion_rate
        description: "Taux de conversion = buts marqués / total_shots."
      - name: ws_cross_rate
        description: "Part des passes qui sont des centres = passes_cross / total_passes."
      - name: ws_through_ball_rate
        description: "Part des passes en profondeur (through balls) = passes_through_ball / total_passes."
      - name: ws_long_ball_rate
        description: "Part des longs ballons = passes_long_ball / total_passes."
      - name: ws_short_pass_rate
        description: "Part des passes courtes = 1 − (cross + through_ball + long_ball) / total_passes."
      - name: ws_def_exposed_left_pct
        description: "Part des attaques adverses subies sur le flanc gauche = opp_att_left / opp_att_total."
      - name: ws_def_exposed_center_pct
        description: "Part des attaques adverses subies dans l'axe = opp_att_center / opp_att_total."
      - name: ws_def_exposed_right_pct
        description: "Part des attaques adverses subies sur le flanc droit = opp_att_right / opp_att_total."

