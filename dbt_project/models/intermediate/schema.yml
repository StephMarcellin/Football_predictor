  - name: int_whoscored_team_season
    description: >
      Agrégats de saison WhoScored par équipe (défense, attaque, xG, différenciés Home/Away),
      castés depuis le VARCHAR brut de silver.whoscored_team_season. Agrégats de SAISON
      COMPLÈTE : à n'utiliser qu'en saison N-1 (fuite de données sinon — cf. gold.equipe_match).
      Couverture : 2019-2020 (Premier League seule), puis 2021-2022 → 2024-2025 ;
      2020-2021 absente. 390 lignes, 0 valeur vide, 0 équipe non mappée.
    tests:
      # ── Grain (0 doublon empirique) ──
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - str_team_id
              - str_season
              - str_league_source
          config:
            severity: error
      # ── Identités exactes du site (0 violation empirique, tolérance d'arrondi 0.01) ──
      # xg_diff = buts − xG (positif = sur-performance offensive / plus encaissé que prévu).
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              ABS(dec_ws_home_xg_diff_for - (int_ws_home_goals_for - dec_ws_home_xg_for)) <= 0.011
              AND ABS(dec_ws_away_xg_diff_for - (int_ws_away_goals_for - dec_ws_away_xg_for)) <= 0.011
          config:
            severity: error
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              ABS(dec_ws_home_xg_diff_against - (int_ws_home_goals_against - dec_ws_home_xg_against)) <= 0.011
              AND ABS(dec_ws_away_xg_diff_against - (int_ws_away_goals_against - dec_ws_away_xg_against)) <= 0.011
          config:
            severity: error
      # xg_per_shot = xG / tirs, arrondi à 2 décimales par le site.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              ABS(dec_ws_home_xg_per_shot_for - dec_ws_home_xg_for / int_ws_home_shots_for) <= 0.0051
              AND ABS(dec_ws_away_xg_per_shot_for - dec_ws_away_xg_for / int_ws_away_shots_for) <= 0.0051
              AND ABS(dec_ws_home_xg_per_shot_against - dec_ws_home_xg_against / int_ws_home_shots_against) <= 0.0051
              AND ABS(dec_ws_away_xg_per_shot_against - dec_ws_away_xg_against / int_ws_away_shots_against) <= 0.0051
          config:
            severity: error
      # ── Contrainte physique : tirs cadrés ≤ tirs (0 violation empirique) ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dec_ws_home_shots_ot_pg <= dec_ws_home_shots_pg AND dec_ws_away_shots_ot_pg <= dec_ws_away_shots_pg"
          config:
            severity: error
      # ── Les 4 *_rating d'un même côté sont identiques par nature (note globale) ──
      # 0 écart empirique. Warn : un écart signalerait un changement côté site ou scraper.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              dec_ws_home_att_rating = dec_ws_home_def_rating
              AND dec_ws_home_att_rating = dec_ws_home_xg_for_rating
              AND dec_ws_home_att_rating = dec_ws_home_xg_against_rating
              AND dec_ws_away_att_rating = dec_ws_away_def_rating
              AND dec_ws_away_att_rating = dec_ws_away_xg_for_rating
              AND dec_ws_away_att_rating = dec_ws_away_xg_against_rating
          config:
            severity: warn
    columns:
      - name: str_team_id
        description: "Id canonique de l'équipe (via team_mapping sur le nom WhoScored 'team')."
        tests:
          - not_null
