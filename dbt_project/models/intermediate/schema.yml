  - name: int_fbref_schedule
    description: >
      Feuille de match FBref (résultat, buts marqués/encaissés, possession,
      formation) rematchée sur match_id + team_id. Source des résultats bruts
      et de la possession dans backbone. Couvre toutes les compétitions
      (Big5, Cup, D2, Europe, Other) — pas de segmentation Big5-only.
      Inclut les matchs non joués (à venir, reportés, annulés COVID 2019-20) :
      str_result = '', int_gf / int_ga / str_result_1n2 NULL (4 278 lignes).
    tests:
      # ── Grain de la table (1 ligne par équipe par match) ──
      # Historique : 1 doublon empirique avant la refonte (fan-out registry, +282 lignes en sortie).
      # Jointure contrainte sur l'adversaire → 0 doublon empirique → error.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - str_match_id
              - str_team_id
          config:
            severity: error
      # ── Contraintes physiques dures sur les buts ──
      # Empirique : gf ∈ [0, 14], ga ∈ [0, 10]. NULL (match non joué) toléré.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(int_gf IS NULL) OR (int_gf <= 15 AND int_ga <= 10)"
          config:
            severity: error
      # ── Match joué ⇒ score renseigné (0 violation empirique) ──
      # L'inverse n'est pas vrai : Paris FC-Lyon 17/12/2021 (match arrêté) a un score 1-1 et result = ''.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(str_result = '') OR (int_gf IS NOT NULL AND int_ga IS NOT NULL)"
          config:
            severity: error
      # ── Cohérence result / gf-ga / result_1n2 ──
      # W → gf > ga ; D → gf = ga ; L → gf < ga ; '' → result_1n2 IS NULL (match non joué).
      # Historique : 0 violation → error. Désormais 2 lignes : Bastia-Lyon 16/04/2017
      # (match arrêté, victoire attribuée sur tapis vert). Attendu → warn.
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              CASE
                WHEN str_result = 'W' THEN int_gf > int_ga
                WHEN str_result = 'D' THEN int_gf = int_ga
                WHEN str_result = 'L' THEN int_gf < int_ga
                WHEN str_result = '' THEN str_result_1n2 IS NULL
                ELSE false
              END
          config:
            severity: warn
      # ── Cohérence venue × result → result_1n2 (0 violation empirique, matches joués) ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              (str_result = '')
              OR (str_venue = 'Neutral')
              OR (str_venue = 'Home' AND str_result = 'W' AND str_result_1n2 = 'H')
              OR (str_venue = 'Home' AND str_result = 'D' AND str_result_1n2 = 'D')
              OR (str_venue = 'Home' AND str_result = 'L' AND str_result_1n2 = 'A')
              OR (str_venue = 'Away' AND str_result = 'W' AND str_result_1n2 = 'A')
              OR (str_venue = 'Away' AND str_result = 'D' AND str_result_1n2 = 'D')
              OR (str_venue = 'Away' AND str_result = 'L' AND str_result_1n2 = 'H')
          config:
            severity: error
    columns:
      - name: str_match_id
        description: >
          Identifiant unifié du match (SHA1), rattaché via match_registry.
          Historique A-005 : 49 NULL (0.09 %) avant la refonte ; 0 NULL empirique
          depuis la jointure contrainte sur l'adversaire (matchs non joués inclus).
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('intermediate', 'match_registry')
