version: 2

models:
  - name: backbone
    description: >
      Table pivot centrale — 1 ligne par équipe par match (base int_fbref_schedule,
      matchs à venir inclus). Jointure des int_fbref_* (schedule, keeper, shooting, misc),
      int_understat_stats et int_odds, produite par dbt en mode incremental. Uniquement des
      faits au grain match : les agrégats de saison WhoScored (grain équipe × saison) sont
      joints en gold, décalés en N-1 (cf. gold.equipe_match). Schéma intermediate — consommée par les modèles gold.* et marts.*.
      Noms de colonnes préfixés par type (docs/proposition_nommage_definitif.csv) ;
      premier run après la refonte en --full-refresh.

      Segmentation Big5-only :
      - Colonnes Understat (dec_np_xg, dec_ppda, dec_np_xg_diff_match) : 100 % NULL hors Big5
      - Colonnes Odds : 100 % NULL hors Big5, avec sparsité résiduelle en Big5
    config:
      alias: backbone
    tests:
      # ── Grain de la table (1 ligne par équipe par match) ──
      # Historique : 1 doublon hérité d'int_fbref_schedule (fan-out registry). Jointures
      # int_* contraintes sur l'adversaire depuis la refonte → 0 doublon empirique → error.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - str_match_id
              - str_team_id
          config:
            severity: error
      # ── Contrainte physique dure : tirs cadrés ≤ tirs totaux (0 violation empirique) ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: "int_shots_on_target <= int_shots_total"
          config:
            severity: error
      # ── Contrainte physique dure : différentiel npxG = np_xg - np_xg_conceded (0 violation) ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dec_np_xg IS NULL OR dec_np_xg_conceded IS NULL OR ABS(dec_np_xg_diff_match - (dec_np_xg - dec_np_xg_conceded)) < 0.001"
          config:
            severity: error
      # ── Ex-cascade A-024 : saves ≤ shots_on_target_faced ──
      # Historique : 296 violations. int_fbref_keeper résout désormais sota par identité
      # (sota ≥ ga_keeper + saves) → 0 violation empirique → error.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "int_saves IS NULL OR int_shots_on_target_faced IS NULL OR int_saves <= int_shots_on_target_faced"
          config:
            severity: error
      # ── Ex-cascade A-025 : clean_sheet = 1 → ga = 0 ──
      # Historique : 23 violations. clean_sheet est désormais dérivé de ga_keeper (buts
      # encaissés par le gardien, CSC exclus) : 18 lignes empiriques avec ga > 0 = buts
      # contre son camp uniquement. Attendu → warn.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "int_clean_sheet IS NULL OR int_clean_sheet = 0 OR int_ga = 0"
          config:
            severity: warn
      # ── Ex-cascade A-026 : save_pct dans [0, 1] (recalculé en ratio dans int_fbref_keeper) ──
      # Historique : 36 violations sur l'échelle [0, 100]. 0 violation empirique → error.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dec_save_pct IS NULL OR (dec_save_pct >= 0 AND dec_save_pct <= 1)"
          config:
            severity: error
      # ── Somme des probabilités Pinnacle 1n2 = 1 (0 violation) ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dec_pinnacle_prob_team IS NULL OR ABS(dec_pinnacle_prob_team + dec_pinnacle_prob_draw + dec_pinnacle_prob_opp - 1) < 0.001"
          config:
            severity: error
      # ── Somme des probabilités marché moyen 1n2 = 1 (0 violation) ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dec_market_prob_team IS NULL OR ABS(dec_market_prob_team + dec_market_prob_draw + dec_market_prob_opp - 1) < 0.001"
          config:
            severity: error
      # ── Somme over25 + under25 = 1 (0 violation) ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: "dec_pinnacle_prob_over25 IS NULL OR ABS(dec_pinnacle_prob_over25 + dec_pinnacle_prob_under25 - 1) < 0.001"
          config:
            severity: error
      # ── Match joué ⇔ résultat et score renseignés (0 violation empirique) ──
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(str_result_1n2 IS NULL) OR (int_gf IS NOT NULL AND int_ga IS NOT NULL)"
          config:
            severity: error
    columns:

      # ── Identifiants ────────────────────────────────────────────────────────
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1). Historique A-005 : 49 NULL ; 0 NULL empirique depuis la refonte des jointures int_*."
        tests:
          - not_null
      - name: dt_date
        description: "Date du match"
        tests:
          - not_null

      - name: str_team_id
        description: "Id canonique de l'équipe"
        tests:
          - not_null

      - name: str_opponent_id
        description: "Id canonique de l'adversaire. Historique : ~3.6 % NULL (cascade A-002) ; 0 NULL empirique aujourd'hui."
        tests:
          - not_null

      - name: str_venue
        description: "Lieu du match du point de vue de l'équipe : Home, Away ou Neutral (finales Cup/Europe)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Home', 'Away', 'Neutral']

      - name: str_season
        description: "Saison au format YYYY-YYYY"
        tests:
          - not_null

      - name: str_league_source
        description: "Nom de la compétition source (ex: Premier League, Ligue 1)"
        tests:
          - not_null

      - name: str_comp_category
        description: "Catégorie de compétition : Big5, Cup, D2, Europe, Other"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Big5', 'Cup', 'D2', 'Europe', 'Other']

      - name: str_result_1n2
        description: "Résultat encodé du point de vue neutre : H (victoire domicile), D (nul), A (victoire extérieur). NULL sur les matchs non joués (4 026 lignes, ~4.4 %)."
        tests:
          - accepted_values:
              config:
                severity: error
              arguments:
                values: ['H', 'D', 'A']

      - name: str_formation
        description: "Formation tactique de l'équipe (ex: 4-3-3). Chaîne vide si non fournie (avant 2014-2015, matchs non joués)."

      # ── Résultats bruts ──────────────────────────────────────────────────────
      - name: int_gf
        description: "Buts marqués par l'équipe. NULL si match non joué (4 024 lignes)."
        tests:
          - is_positive

      - name: int_ga
        description: "Buts encaissés par l'équipe. NULL si match non joué."
        tests:
          - is_positive

      - name: int_poss
        description: "Possession en pourcentage (int_poss de int_fbref_schedule, castée en DOUBLE). NULL avant 2014-2015, matchs non joués et 100 % neutralisé (~29 %)."
        tests:
          - is_positive

      # ── Gardien (fbref_keeper) ───────────────────────────────────────────────
      - name: int_shots_on_target_faced
        description: "Tirs cadrés subis par le gardien (sota)"
        tests:
          - is_positive

      - name: int_saves
        description: "Arrêts du gardien (vide en source = 0, cf. int_fbref_keeper). Historique A-024 résolu par identité dans int_fbref_keeper."
        tests:
          - is_positive

      - name: dec_save_pct
        description: "Ratio d'arrêts [0, 1], recalculé dans int_fbref_keeper. NULL si sota inconnu ou nul."

      - name: int_clean_sheet
        description: "1 si le gardien n'a encaissé aucun but (dérivé de ga_keeper, CSC exclus), 0 sinon. 18 lignes à 1 avec ga > 0 = CSC uniquement."
        tests:
          - is_positive

      # ── Tirs (fbref_shooting) ────────────────────────────────────────────────
      - name: int_shots_total
        description: "Tirs tentés, hors penalties. NULL avant 2014-2015 et sur les faux zéros FBref neutralisés (cf. int_fbref_shooting)."
        tests:
          - is_positive

      - name: int_shots_on_target
        description: "Tirs cadrés, hors penalties. Mêmes règles de NULL que int_shots_total."
        tests:
          - is_positive

      - name: dec_goals_per_shot
        description: "Buts hors penalty par tir, (gls - pk) / sh, échelle 0-1, définition uniforme toutes saisons (cf. int_fbref_shooting)."

      # ── Disciplinaire (fbref_misc) ───────────────────────────────────────────
      - name: int_yellow_cards
        description: "Cartons jaunes reçus"
        tests:
          - is_positive

      - name: int_second_yellow_cards
        description: "Deuxièmes cartons jaunes (expulsion indirecte)"
        tests:
          - is_positive

      - name: int_red_cards
        description: "Cartons rouges directs reçus"
        tests:
          - is_positive

      - name: int_fouls_committed
        description: "Fautes commises. NULL avant 2014-2015 et sur les faux zéros FBref neutralisés (cf. int_fbref_misc)."
        tests:
          - is_positive

      - name: int_interceptions
        description: "Interceptions. Mêmes règles de NULL que int_fouls_committed, plus le sous-bloc int = tklw = 0."
        tests:
          - is_positive

      - name: int_tackles_won
        description: "Tacles remportés. Mêmes règles de NULL que int_interceptions."
        tests:
          - is_positive

      # ── xG et pressing (understat_stats) — 100 % NULL hors Big5 ────────────
      - name: dec_np_xg
        description: "Expected goals sans pénalties du point de vue de l'équipe (Understat). NULL hors Big5."
        tests:
          - is_positive

      - name: dec_np_xg_conceded
        description: "Expected goals sans pénalties concédés. NULL hors Big5."
        tests:
          - is_positive

      - name: dec_ppda
        description: "PPDA de l'équipe — passes adverses autorisées par action défensive (mesure le pressing). Max empirique 193 (A-007). NULL hors Big5."
        tests:
          - is_positive

      - name: dec_ppda_allowed
        description: "PPDA autorisé à l'adversaire — pressing subi. NULL hors Big5."
        tests:
          - is_positive

      - name: dec_np_xg_diff_match
        description: "Différentiel npxG du match (np_xg - np_xg_conceded) — peut être négatif. NULL hors Big5."

      # ── Cotes Pinnacle (odds) — NULL hors Big5 + sparsité résiduelle Big5 ────
      - name: dec_odds_pinnacle_team
        description: "Cote Pinnacle victoire de l'équipe (H si Home, A si Away)"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: dec_odds_pinnacle_draw
        description: "Cote Pinnacle match nul"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: dec_odds_pinnacle_opp
        description: "Cote Pinnacle victoire de l'adversaire"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: dec_odds_avg_team
        description: "Cote moyenne marché victoire de l'équipe"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: dec_odds_avg_draw
        description: "Cote moyenne marché match nul"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      - name: dec_odds_avg_opp
        description: "Cote moyenne marché victoire adversaire"
        tests:
          - is_valid_odds:
              config:
                severity: warn

      # ── Probabilités implicites (ouverture) ─────────────────────────────────
      - name: dec_pinnacle_prob_team
        description: "Probabilité implicite Pinnacle victoire de l'équipe (ouverture)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_pinnacle_prob_draw
        description: "Probabilité implicite Pinnacle match nul (ouverture)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_pinnacle_prob_opp
        description: "Probabilité implicite Pinnacle victoire adversaire (ouverture)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_market_prob_team
        description: "Probabilité implicite marché moyen victoire de l'équipe (ouverture)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_market_prob_draw
        description: "Probabilité implicite marché moyen match nul (ouverture)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_market_prob_opp
        description: "Probabilité implicite marché moyen victoire adversaire (ouverture)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      # ── Probabilités implicites (closing) — ajoutées 2026-09-09 ──────────────
      - name: dec_pinnacle_prob_close_team
        description: "Probabilité implicite Pinnacle victoire de l'équipe (closing)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_pinnacle_prob_close_draw
        description: "Probabilité implicite Pinnacle match nul (closing)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_pinnacle_prob_close_opp
        description: "Probabilité implicite Pinnacle victoire adversaire (closing)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_market_prob_close_team
        description: "Probabilité implicite marché moyen victoire équipe (closing)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_market_prob_close_draw
        description: "Probabilité implicite marché moyen match nul (closing)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_market_prob_close_opp
        description: "Probabilité implicite marché moyen victoire adversaire (closing)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      # ── Drifts (mouvements de la cote entre ouverture et closing) ───────────
      # Peuvent être négatifs — bornes empiriques [-0.2, +0.3].
      - name: dec_pinnacle_drift_team
        description: "Drift Pinnacle victoire équipe (close - open). Peut être négatif."
      - name: dec_pinnacle_drift_draw
        description: "Drift Pinnacle match nul (close - open). Peut être négatif."
      - name: dec_pinnacle_drift_opp
        description: "Drift Pinnacle victoire adversaire (close - open). Peut être négatif."

      # ── Probabilités Over/Under 2.5 buts ────────────────────────────────────
      - name: dec_pinnacle_prob_over25
        description: "Probabilité implicite Pinnacle Over 2.5 buts (ouverture)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_pinnacle_prob_under25
        description: "Probabilité implicite Pinnacle Under 2.5 buts (ouverture)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_pinnacle_prob_close_over25
        description: "Probabilité implicite Pinnacle Over 2.5 buts (closing)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

      - name: dec_pinnacle_prob_close_under25
        description: "Probabilité implicite Pinnacle Under 2.5 buts (closing)"
        tests:
          - is_valid_probability:
              config:
                severity: warn

  - name: events_qual
    description: >
      Éclatement des qualifiers de int_whoscored_events (via qualifiers_json) :
      1 ligne par (événement × qualifier). Base de tous les modèles WhoScored.
      Incrémentale. Les colonnes d'événement sont reprises telles quelles de
      int_whoscored_events ; qual_type_id/name/value sont la transformation (unnest).
    columns:
      # ── Colonnes héritées de int_whoscored_events (mêmes définitions) ──────────
      - name: str_match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index."
      - name: str_team_id
        description: "Id canonique de l'équipe de l'événement (converti depuis l'id WhoScored via int_whoscored_match_index)."
      - name: str_player_id
        description: "Identifiant WhoScored du joueur auteur de l'action. NULL possible sur certains événements."
      - name: str_event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
        tests:
          - not_null
      - name: int_minute
        description: "Minute de jeu brute (hors temps additionnel)."
      - name: int_second
        description: "Seconde dans la minute."
      - name: int_expanded_minute
        description: "Minute cumulée, temps additionnel inclus (ex. 45+2 → 47)."
      - name: int_period
        description: "Période : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match (FormationSet), 14 = fin de match (End)."
      - name: dec_x
        description: "Position X de l'action sur le terrain (0-100, croissant vers le but adverse ; repère relatif à l'équipe)."
      - name: dec_y
        description: "Position Y de l'action (0-100, largeur, 50 = axe central)."
      - name: dec_end_x
        description: "Position X de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: dec_end_y
        description: "Position Y de fin de l'action (surtout les passes ; NULL pour les événements ponctuels)."
      - name: str_type_id
        description: "Type d'événement WhoScored (cf. docs/Event_type_definition.txt ; ex. 1 Pass, 3 TakeOn, 4 Foul, 13-16 tirs)."
        tests:
          - not_null
      - name: str_type_name
        description: "Libellé du type d'événement (Pass, TakeOn, Foul, Goal…)."
      - name: str_outcome_id
        description: "Résultat de l'action : 1 = réussi, 0 = raté."
      - name: bool_is_touch
        description: "Booléen : le joueur a touché le ballon (flag WhoScored isTouch)."
      - name: bool_is_shot
        description: "Booléen : l'événement est un tir (flag WhoScored isShot)."
      - name: int_row_num
        description: "Index de l'événement dans le flux du match (ordre chronologique)."
        tests:
          - not_null
      # ── Transformation propre à events_qual : éclatement du qualifiers_json ────
      - name: str_qual_type_id
        description: "Id du type de qualifier (cf. docs/Qualifier_type_definition.txt ; ex. 9 Penalty, 102 GoalMouthY, 233 OppositeRelatedEvent)."
      - name: str_qual_type_name
        description: "Libellé du qualifier (displayName WhoScored)."
      - name: str_qual_value
        description: "Valeur du qualifier (chaîne). NULL pour un qualifier-drapeau sans valeur."

  - name: player_match_stats
    description: >
      Agrégats WhoScored par joueur par match.
      Calculé depuis int_whoscored_events et events_qual.
      Structure en trois CTEs : base_agg (métriques générales),
      offensive_agg (passes, tirs, progressions),
      defensive_agg (tackles, interceptions, dégagements).
      Utilisé pour les squad features dans gold.features_whoscored.

    columns:
      - name: str_match_id
        description: "Identifiant du match (SHA1)"
        tests:
          - not_null
      - name: int_minutes_played
        description: "Minutes jouées par le joueur dans ce match (propagé depuis int_player_minutes). Base du per-90 en Gold. NULL = joueur avec événements mais sans ligne de lineup (~0,4 %)."
      - name: str_team_id
        description: "Identifiant WhoScored de l'équipe"
        tests:
          - not_null
      - name: str_player_id
        description: "Identifiant WhoScored du joueur"
        tests:
          - not_null
      - name: dt_date
        description: "Date du match"
        tests:
          - not_null
      - name: str_season
        description: "Saison (format YYYY-YYYY)"
        tests:
          - not_null
      - name: str_league_source
        description: "Ligue source"
        tests:
          - not_null
      - name: int_n_touches
        description: "Touches de balle."
      - name: dec_pct_z1_c1
        description: "Part des touches du joueur dans la case longueur z1 (x 0-20) × couloir c1 (y 0-20) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z1_c2
        description: "Part des touches du joueur dans la case longueur z1 (x 0-20) × couloir c2 (y 20-40) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z1_c3
        description: "Part des touches du joueur dans la case longueur z1 (x 0-20) × couloir c3 (y 40-60) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z1_c4
        description: "Part des touches du joueur dans la case longueur z1 (x 0-20) × couloir c4 (y 60-80) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z1_c5
        description: "Part des touches du joueur dans la case longueur z1 (x 0-20) × couloir c5 (y 80-100) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z2_c1
        description: "Part des touches du joueur dans la case longueur z2 (x 20-40) × couloir c1 (y 0-20) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z2_c2
        description: "Part des touches du joueur dans la case longueur z2 (x 20-40) × couloir c2 (y 20-40) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z2_c3
        description: "Part des touches du joueur dans la case longueur z2 (x 20-40) × couloir c3 (y 40-60) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z2_c4
        description: "Part des touches du joueur dans la case longueur z2 (x 20-40) × couloir c4 (y 60-80) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z2_c5
        description: "Part des touches du joueur dans la case longueur z2 (x 20-40) × couloir c5 (y 80-100) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z3_c1
        description: "Part des touches du joueur dans la case longueur z3 (x 40-60) × couloir c1 (y 0-20) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z3_c2
        description: "Part des touches du joueur dans la case longueur z3 (x 40-60) × couloir c2 (y 20-40) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z3_c3
        description: "Part des touches du joueur dans la case longueur z3 (x 40-60) × couloir c3 (y 40-60) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z3_c4
        description: "Part des touches du joueur dans la case longueur z3 (x 40-60) × couloir c4 (y 60-80) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z3_c5
        description: "Part des touches du joueur dans la case longueur z3 (x 40-60) × couloir c5 (y 80-100) de la grille 5×5 (z1 = tiers défensif → z5 = zone offensive ; c3 = axe central)."
      - name: dec_pct_z4_c1
