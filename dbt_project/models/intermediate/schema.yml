      - name: dec_shots_on_target
        description: "Tirs cadrés sur le match"
      - name: dec_shots_off_target
        description: "Tirs non cadrés sur le match"
      - name: dec_shots_blocked
        description: "Tirs contrés sur le match"
      - name: dec_clearances
        description: "Dégagements sur le match"
      - name: dec_interceptions
        description: "Interceptions sur le match"
      - name: int_possession
        description: "Compte de possessions sur le match — à convertir en ratio home/away en aval, pas un pourcentage direct"
      - name: dec_touches
        description: "Touches de balle sur le match"
      - name: dec_passes_total
        description: "Passes tentées sur le match"
      - name: dec_passes_accurate
        description: "Passes réussies sur le match"
      - name: dec_passes_key
        description: "Passes clés sur le match"
      - name: dec_aerials_total
        description: "Duels aériens disputés sur le match"
      - name: dec_aerials_won
        description: "Duels aériens gagnés sur le match"
      - name: dec_corners_total
        description: "Corners tentés sur le match"
      - name: dec_corners_accurate
        description: "Corners réussis sur le match"
      - name: dec_throw_ins_total
        description: "Touches (remises en jeu) tentées sur le match"
      - name: dec_throw_ins_accurate
        description: "Touches (remises en jeu) réussies sur le match"
      - name: dec_offsides_caught
        description: "Hors-jeux sifflés sur le match"
      - name: dec_fouls_committed
        description: "Fautes commises sur le match"
      - name: dec_tackles_total
        description: "Tacles tentés sur le match"
      - name: dec_tackles_successful
        description: "Tacles réussis sur le match"
      - name: dec_tackles_unsuccessful
        description: "Tacles manqués sur le match"
      - name: dec_dribbled_past
        description: "Fois où l'équipe a été dribblée sur le match"
      - name: dec_dribbles_won
        description: "Dribbles réussis sur le match"
      - name: dec_dribbles_attempted
        description: "Dribbles tentés sur le match"
      - name: dec_dribbles_lost
        description: "Dribbles perdus sur le match"
      - name: dec_dispossessed
        description: "Pertes de balle sous pression sur le match"
      - name: dec_errors
        description: "Erreurs menant à une occasion adverse sur le match"
      - name: dec_defensive_aerials
        description: "Duels aériens défensifs sur le match — sous-catégorie non confirmée d'aerials_total (à vérifier, cf. passation)"
      - name: dec_offensive_aerials
        description: "Duels aériens offensifs sur le match — sous-catégorie non confirmée d'aerials_total (à vérifier, cf. passation)"
      - name: dec_pass_success_pct
        description: "Recalculé : passes_accurate / passes_total * 100. NULL si passes_total = 0."
      - name: dec_aerial_success_pct
        description: "Recalculé : aerials_won / aerials_total * 100. NULL si aerials_total = 0."
      - name: dec_tackle_success_pct
        description: "Recalculé : tackles_successful / tackles_total * 100. NULL si tackles_total = 0."
      - name: dec_dribble_success_pct
        description: "Recalculé : dribbles_won / dribbles_attempted * 100. NULL si dribbles_attempted = 0."
      - name: dec_throw_in_accuracy_pct
        description: "Recalculé : throw_ins_accurate / throw_ins_total * 100. NULL si throw_ins_total = 0."
