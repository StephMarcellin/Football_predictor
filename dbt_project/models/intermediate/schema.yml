      - name: h2h_avg_gf_10
        description: "Moyenne de buts marqués sur les 10 dernières confrontations directes."
      - name: h2h_avg_ga_10
        description: "Moyenne de buts encaissés sur les 10 dernières confrontations directes."
      - name: h2h_avg_xg_diff_10
        description: "Différentiel xG moyen sur les 10 dernières confrontations directes."
  - name: player_possession_chains
    description: >
      Segmente le flux d'événements WhoScored en chaînes de possession.
      Pour chaque événement, détermine l'équipe réellement en possession
      (possession certaine vs indéterminée), puis marque le déclencheur de
      chaque chaîne via chain_trigger (corner, free_kick, counter_attack,
      open_play, recovery, throw_in, goal_kick...).
      Source : int_event_enriched. Incrémentale sur match_id.
      Brique de base de corner_profiles, player_passes_raw et player_xg_chain.
      Une ligne par action.
    columns:
      # ── Héritées de int_event_enriched (mêmes définitions) ─────────────────────
      - name: match_id
        description: "Identifiant unifié du match (SHA1), résolu via int_whoscored_match_index."
        tests:
          - not_null
      - name: season
        description: "Saison du match (ex. 2023-2024)."
      - name: league_source
        description: "Championnat / source des données (ex. Bundesliga)."
      - name: team_id
        description: "Id canonique de l'équipe de l'action (converti depuis l'id WhoScored via int_whoscored_match_index)."
      - name: player_id
        description: "Identifiant WhoScored du joueur auteur de l'action. NULL possible sur certains événements."
      - name: event_id
        description: >
          Identifiant WhoScored de l'événement. ATTENTION : scopé par (match, équipe),
          PAS unique par match — ne pas joindre dessus sans contraindre l'équipe.
      - name: row_num
        description: "Index de l'événement dans le flux du match (ordre chronologique)."
        tests:
          - not_null
      - name: expanded_minute
        description: "Minute cumulée, temps additionnel inclus (ex. 45+2 → 47)."
      - name: second
        description: "Seconde dans la minute."
      - name: period
        description: "Période : 1 = 1re mi-temps, 2 = 2e mi-temps, 16 = pré-match (FormationSet), 14 = fin de match (End)."
      - name: type_id
        description: "Type d'événement WhoScored (cf. docs/Event_type_definition.txt ; ex. 1 Pass, 3 TakeOn, 4 Foul, 13-16 tirs)."
      - name: type_name
        description: "Libellé du type d'événement (Pass, TakeOn, Foul, Goal…)."
      - name: outcome_id
        description: "Résultat de l'action : 1 = réussi, 0 = raté."
      - name: is_shot
        description: "Booléen : l'événement est un tir (flag WhoScored isShot)."
      - name: x
        description: "Position X de l'action sur le terrain (0-100, croissant vers le but adverse ; repère relatif à l'équipe)."
      - name: y
        description: "Position Y de l'action (0-100, largeur, 50 = axe central)."
      - name: scraped_at
        description: "Horodatage ISO du scrape du match."
      # ── Transformation : segmentation en chaînes de possession ────────────────
      - name: chain_id
        description: "Identifiant de la chaîne de possession = match_id || '_' || numéro de chaîne. Regroupe les actions d'une même possession."
      - name: chain_number
        description: "Numéro séquentiel de la chaîne de possession dans le match."
      - name: chain_team_id
        description: >
          Id canonique de l'équipe EN POSSESSION durant la chaîne (possesseur résolu).
          ≠ team_id : team_id est l'équipe de l'action précise (ex. un dégagement
          adverse peut appartenir à la chaîne de l'équipe qui attaque).
      - name: is_rupture
        description: "Flag (0/1) : l'événement clôt la chaîne (le possesseur change juste après)."
      - name: chain_trigger
        description: "Déclencheur de la chaîne : recovery / corner / goal_kick / throw_in / free_kick / open_play."
      - name: certain_possessor
        description: "Id de l'équipe si la possession est certaine à cet événement ; NULL si possession indéterminée (duel / ballon libre)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

  - name: freekick_profiles
    description: >
      Profils de coups francs par chaîne. Caractérise chaque coup franc par
      son type (direct, indirect, short_pass) et son issue (goal, shot_saved,
      shot_off_target, offside, foul_won, corner_won, open_play, turnover).
      Source : player_possession_chains. Incrémentale.
    columns:
      - name: match_id
        tests:
          - not_null
      - name: row_num
        tests:
          - not_null
      - name: fk_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['direct', 'indirect', 'short_pass']
      - name: outcome
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['goal', 'shot_saved', 'shot_off_target', 'offside', 'foul_won', 'corner_won', 'open_play', 'turnover']
      - name: chain_id
        description: "Identifiant de la chaîne de possession = match_id || '_' || numéro de chaîne (propagé de player_possession_chains)."
      - name: chain_number
        description: "Numéro séquentiel de la chaîne de possession dans le match (propagé de player_possession_chains)."
      - name: chain_team_id
        description: "Id de l'équipe en possession (attaquante) sur le coup franc (propagé de player_possession_chains)."
      - name: freekick_taker_id
        description: "Identifiant du joueur qui tire le coup franc."
      - name: event_id
        description: "event_id WhoScored de l'événement d'ancrage (scopé match+équipe)."
      - name: expanded_minute
        description: "Minute (expanded_minute) du coup franc."
      - name: second
        description: "Seconde dans la minute."
      - name: type_id
        description: "type_id de l'événement d'ancrage (13-16 pour un tir direct ; 1/2 pour une passe / OffsidePass)."
      - name: outcome_id
        description: "Résultat de l'événement d'ancrage (1 = réussi, 0 = raté)."
      - name: x
        description: "Position X du coup franc (0-100, repère équipe)."
      - name: y
        description: "Position Y du coup franc (0-100, 50 = axe central)."
      - name: is_offside
        description: "Booléen : la passe de coup franc a été signalée hors-jeu (OffsidePass, type 2). FALSE pour les coups francs directs."
      - name: fk_zone_type
        description: "Nature de la livraison : 'direct_shot' (frappe directe), 'own_box' (jouée dans sa propre surface, x<17), 'crossed' (centrée) ou 'too_far' (sinon)."
      - name: chain_danger_total
        description: "Somme du danger (action_value de event_values) généré par l'équipe sur la chaîne issue du coup franc."
      - name: chain_danger_momentum
        description: "Part du danger accumulée AVANT le dernier tir / danger total de la chaîne. NULL si aucun tir."
      - name: shot_body_part
        description: "Partie du corps du tir résultant (head / right_foot / left_foot / other, via qualifiers 15/20/72/21) — renseigné pour les coups francs centrés ('crossed')."
      - name: clearance_player_id
        description: "Identifiant du défenseur qui dégage (type 12), pour les coups francs centrés (NULL sinon)."
      - name: clearance_quality
        description: "Qualité du dégagement : 'perfect' (l'équipe qui dégage récupère), 'failed' (récupération adverse haut, recovery_x>=83), 'poor' (>=75), 'good' (sinon). NULL si pas de dégagement."
      - name: is_headed_clearance
        description: "Booléen : dégagement de la tête (qual 15) plutôt qu'autre (qual 21)."
      - name: x_m
        description: "Position X convertie en mètres = x * 1.05 (longueur terrain 105 m)."
      - name: y_m
        description: "Position Y convertie en mètres = y * 0.68 (largeur terrain 68 m)."
      - name: distance_to_goal
        description: "Distance en mètres du point du coup franc au centre du but adverse (105, 34)."
      - name: angle
        description: "Angle d'ouverture du but vu depuis le point du coup franc, en radians (loi des cosinus avec les poteaux à y=30.34 et 37.66 m)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - match_id
            - row_num

