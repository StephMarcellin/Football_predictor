        description: "Nombre de actions du joueur quand l'équipe mène au score."
      - name: n_progressive_passes_winning
        description: "Nombre de passes progressives du joueur quand l'équipe mène au score."
      - name: n_defensive_actions_winning
        description: "Nombre de actions défensives du joueur quand l'équipe mène au score."
      - name: n_shots_winning
        description: "Nombre de tirs du joueur quand l'équipe mène au score."
