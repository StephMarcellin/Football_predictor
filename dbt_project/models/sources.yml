          - name: raw_team
            description: "Nom brut de l'équipe"
            tests:
              - not_null
          - name: raw_opponent
            description: "Nom brut de l'adversaire"
            tests:
              - not_null
          - name: result_1n2
            description: "Résultat encodé : H, D, A"
            tests:
              - accepted_values:
                  arguments:
                    values: ['H', 'D', 'A']

      - name: understat_schedule
        description: "Calendrier des matchs Understat — 1 ligne par match (pas par équipe). Contient les identifiants pour jointure avec understat_stats."
        tests:
          # ── Grain silver — match_id unique + match_url unique ──
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [match_id]
          # ── Cohérence : is_result=false ↔ xG NULL ──
          # 431 lignes avec is_result=false, 431 avec home_xg NULL — parfaite correspondance.
          - dbt_utils.expression_is_true:
              expression: "(is_result = TRUE AND home_xg IS NOT NULL) OR (is_result = FALSE AND home_xg IS NULL)"
        columns:
          - name: match_id
            description: "Identifiant unique Understat du match — clé de jointure avec understat_stats"
            tests:
              - not_null
              - unique
          - name: league_source
            description: "Nom de la compétition source"
            tests:
              - not_null
          - name: home_team
            description: "Nom normalisé de l'équipe domicile"
            tests:
              - not_null
          - name: away_team
            description: "Nom normalisé de l'équipe extérieur"
            tests:
              - not_null
          - name: home_goals
            description: "Buts marqués par l'équipe domicile"
            tests:
              - is_positive
          - name: away_goals
            description: "Buts marqués par l'équipe extérieur"
            tests:
              - is_positive
          - name: home_xg
            description: "Expected goals équipe domicile"
            tests:
              - is_positive
          - name: away_xg
            description: "Expected goals équipe extérieur"
            tests:
              - is_positive
          - name: is_result
            description: "Indique si le match a un résultat définitif (1) ou est à venir (0)"
          - name: match_url
            description: "URL Understat du match"
          - name: season
            description: "Saison au format YYYY-YYYY"
            tests:
              - not_null
          - name: comp_category
            description: "Catégorie de compétition : Big5, Cup, Europe"
            tests:
              - not_null
          - name: raw_home_team
            description: "Nom brut de l'équipe domicile avant normalisation"
            tests:
              - not_null
          - name: raw_away_team
            description: "Nom brut de l'équipe extérieur avant normalisation"
            tests:
              - not_null

      - name: understat_stats
        description: "Statistiques xG détaillées par match (Understat) — 1 ligne par match. Jointure avec understat_schedule sur match_id."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [match_id]
          # ── Contraintes physiques : miroir xG et xpts sum ──
          # 0 violation empirique — tests durs.
          - dbt_utils.expression_is_true:
              expression: "ABS(home_np_xg_diff + away_np_xg_diff) < 0.001"
          - dbt_utils.expression_is_true:
              expression: "ABS((home_np_xg - away_np_xg) - home_np_xg_diff) < 0.001"
          - dbt_utils.expression_is_true:
              expression: "home_xpts + away_xpts <= 3.001"
        columns:
          - name: match_id
            description: "Identifiant Understat du match — clé de jointure avec understat_schedule"
            tests:
              - not_null
              - unique
          - name: home_xpts
            description: "Expected points domicile — points attendus selon les xG du match"
            tests:
              - not_null
              - is_positive
          - name: away_xpts
            description: "Expected points extérieur"
            tests:
              - not_null
              - is_positive
          - name: home_np_xg
            description: "Expected goals sans pénalties — équipe domicile"
            tests:
              - not_null
              - is_positive
          - name: away_np_xg
            description: "Expected goals sans pénalties — équipe extérieur"
            tests:
              - not_null
              - is_positive
          - name: home_np_xg_diff
            description: "Différentiel npxG domicile (home_np_xg - away_np_xg)"
            tests:
              - not_null
          - name: away_np_xg_diff
            description: "Différentiel npxG extérieur (away_np_xg - home_np_xg)"
            tests:
              - not_null
          - name: home_ppda
            description: "PPDA domicile — passes adverses autorisées par action défensive (mesure l'intensité du pressing)"
            tests:
              - not_null:
                  config:
                    severity: warn
              - is_positive
          - name: away_ppda
            description: "PPDA extérieur"
            tests:
              - not_null:
                  config:
                    severity: warn
              - is_positive
          - name: home_deep
            description: "Passes complétées dans les 18 derniers mètres adverses — domicile (mesure la pression offensive)"
            tests:
              - not_null
              - is_positive
          - name: away_deep
            description: "Passes complétées dans les 18 derniers mètres adverses — extérieur"
            tests:
              - not_null
              - is_positive
          - name: season
            description: "Saison au format YYYY-YYYY"
            tests:
              - not_null
          - name: league_source
            description: "Nom de la compétition source"
            tests:
              - not_null
          - name: comp_category
            description: "Catégorie de compétition : Big5, Cup, Europe"
            tests:
              - not_null

      - name: odds
        description: "Cotes de paris — 1 ligne par match. Source principale : Pinnacle (bookmaker de référence pour la valeur attendue)."
        tests:
          # ── Grain silver — 0 doublon empirique ──
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [date, home_team, away_team, league_source]
          # ── Contrainte physique : les probabilités no-vig somment exactement à 1 ──
          # Empirique min=0.9999999999999998 max=1.0000000000000002 → tolérance 1e-6.
          - dbt_utils.expression_is_true:
              expression: "pinnacle_prob_h IS NULL OR ABS(pinnacle_prob_h + pinnacle_prob_d + pinnacle_prob_a - 1) < 1e-6"
          - dbt_utils.expression_is_true:
              expression: "market_prob_h IS NULL OR ABS(market_prob_h + market_prob_d + market_prob_a - 1) < 1e-6"
        columns:
          - name: date
            description: "Date du match"
            tests:
              - not_null
          - name: season
            description: "Saison au format YYYY-YYYY"
            tests:
              - not_null
          - name: league_source
            description: "Nom de la compétition source"
            tests:
              - not_null
          - name: home_team
            description: "Nom normalisé de l'équipe domicile"
            tests:
              - not_null
          - name: away_team
            description: "Nom normalisé de l'équipe extérieur"
            tests:
              - not_null
          - name: result_fdc
            description: "Résultat réel du match (H/D/A) — utilisé pour calculer l'edge en backtest"
            tests:
              - accepted_values:
                  arguments:
                    values: ['H', 'D', 'A']
          - name: odds_pinnacle_h
            description: "Cote Pinnacle victoire domicile"
            tests:
              - not_null:
                  config:
                    severity: warn
              - is_valid_odds:
                  config:
                    severity: warn
          - name: odds_pinnacle_d
            description: "Cote Pinnacle match nul"
            tests:
              - not_null:
                  config:
                    severity: warn
              - is_valid_odds:
                  config:
                    severity: warn
          - name: odds_pinnacle_a
            description: "Cote Pinnacle victoire extérieur"
            tests:
              - not_null:
                  config:
                    severity: warn
              - is_valid_odds:
                  config:
                    severity: warn
          - name: odds_avg_h
            description: "Cote moyenne du marché victoire domicile"
            tests:
              - not_null:
                  config:
                    severity: warn
              - is_valid_odds:
                  config:
                    severity: warn
          - name: odds_avg_d
            description: "Cote moyenne du marché match nul"
            tests:
              - not_null:
                  config:
                    severity: warn
              - is_valid_odds:
                  config:
                    severity: warn
          - name: odds_avg_a
            description: "Cote moyenne du marché victoire extérieur"
            tests:
              - not_null:
                  config:
                    severity: warn
              - is_valid_odds:
                  config:
                    severity: warn
          - name: odds_max_h
            description: "Meilleure cote disponible sur le marché victoire domicile"
            tests:
              - not_null:
                  config:
                    severity: warn
              - is_valid_odds:
                  config:
                    severity: warn
          - name: odds_max_d
            description: "Meilleure cote disponible match nul"
            tests:
              - not_null:
                  config:
                    severity: warn
              - is_valid_odds:
