      - name: stg_whoscored_match_index
        description: >
          Index des matchs WhoScored — 1 ligne par match.
          Contient les identifiants équipes et la date pour jointure avec fbref.
        tests:
          # ── Grain silver — 0 doublon empirique (contraste avec int_whoscored_match_index : 118 doublons cascade A-003) ──
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [ws_match_id]
          # ── Contrainte : équipes différentes ──
          - dbt_utils.expression_is_true:
              expression: "home_team_id != away_team_id"
        columns:
          - name: ws_match_id
            description: "Identifiant unique WhoScored du match"
