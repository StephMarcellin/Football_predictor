          - name: ws_match_id
            description: "Identifiant WhoScored du match"
            tests:
              - not_null
              - unique
          - name: referee_id
            description: "Identifiant de l'arbitre"
          - name: referee_name
            description: "Nom de l'arbitre"
          - name: venue_name
            description: "Nom du stade"
          - name: attendance
            description: "Affluence"
          - name: kickoff_time
            description: "Date et heure du coup d'envoi"
          - name: ht_score
            description: "Score à la mi-temps"
          - name: ft_score
            description: "Score final"
          - name: et_score
            description: "Score en prolongation. A-017 : 100 % vide en pratique — colonne dead."
          - name: pk_score
            description: "Score après tirs au but. A-017 : 100 % vide en pratique — colonne dead."
          - name: weather_code
            description: "Code météo — 6 valeurs distinctes."
