version: 2

sources:
  - name: silver
    description: >
      Tables produites par 02_process.py après normalisation Python complète.
      Non gérées par dbt — dbt les lit uniquement.
    schema: silver

    tables:

      - name: fbref_schedule
        description: "Table centrale FBref — 1 ligne par équipe par match. Point de départ de toute la chaîne features."
        tests:
          # ── Grain silver — 0 doublon empirique ──
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [date, team, opponent, league_source]
        columns:
          - name: date
            description: "Date du match"
            tests:
              - not_null
          - name: time
            description: "Heure du match"
          - name: league_source
            description: "Nom de la compétition source (ex: Premier League, Ligue 1)"
            tests:
              - not_null
          - name: day
            description: "Jour de la semaine"
          - name: venue
            description: "Lieu du match du point de vue de l'équipe : Home ou Away"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Home', 'Away', 'Neutral']
          - name: result
            description: "Résultat brut FBref : W (victoire), D (nul), L (défaite)"
            tests:
              - accepted_values:
                  arguments:
                    values: ['W', 'D', 'L']
                  config:
                    severity: warn
          - name: gf
            description: "Buts marqués par l'équipe"
            tests:
              - not_null
              - is_positive
          - name: ga
            description: "Buts encaissés par l'équipe"
            tests:
              - not_null
              - is_positive
          - name: opponent
            description: "Nom normalisé de l'adversaire"
            tests:
              - not_null
          - name: poss
            description: "Possession en pourcentage (VARCHAR — castée en DOUBLE dans gold)"
          - name: formation
            description: "Formation tactique de l'équipe (ex: 4-3-3)"
          - name: opp_formation
            description: "Formation tactique de l'adversaire"
          - name: team
            description: "Nom normalisé de l'équipe"
            tests:
              - not_null
          - name: season
            description: "Saison au format YYYY-YYYY"
            tests:
              - not_null
          - name: source
            description: "Source de la donnée (fbref)"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['fbref']
          - name: scraped_at
            description: "Timestamp du scraping"
          - name: comp_category
            description: "Catégorie de compétition : Big5, Cup, Europe"
            tests:
              - not_null
          - name: raw_team
            description: "Nom brut de l'équipe avant normalisation"
            tests:
              - not_null
          - name: raw_opponent
            description: "Nom brut de l'adversaire avant normalisation"
            tests:
              - not_null

          - name: result_1n2
            description: "Résultat encodé du point de vue de l'équipe : H (victoire domicile), D (nul), A (victoire extérieur)"
            tests:
              - accepted_values:
                  arguments:
                    values: ['H', 'D', 'A']

      - name: fbref_keeper
        description: "Statistiques de gardien FBref — 1 ligne par équipe par match"
        tests:
          # ── Grain silver — 0 doublon empirique sur (date, team, opponent, league_source) ──
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [date, team, opponent, league_source]
          # ── A-004 (silver.fbref_keeper : bug scraping FBref, 1 186 lignes) ──
          # Contrainte physique : les buts encaissés ne peuvent excéder les tirs cadrés subis.
          # Warn ici parce que la dette est connue et suivie via audits.scraping_targets_int_fbref_keeper.
          - dbt_utils.expression_is_true:
              expression: "ga_keeper <= sota"
              config:
                severity: warn
          # ── A-012 (nouveau) : cs devrait être binaire {0, 1} ──
          # 119 lignes avec cs = 2, 203 contradictions cs ↔ ga_keeper.
          # L'intermediate camoufle en recalculant cs depuis ga_keeper — silver expose la vérité brute.
          - dbt_utils.expression_is_true:
              expression: "cs IN (0, 1)"
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              expression: "(ga_keeper > 0 AND cs = 0) OR (ga_keeper = 0 AND cs = 1)"
              config:
                severity: warn
          # ── Contrainte comptable sur les penaltys ──
          - dbt_utils.expression_is_true:
              expression: "pk_allowed + pk_saved + pk_missed <= pk_att"
              config:
                severity: warn
        columns:
          - name: date
            description: "Date du match"
            tests:
              - not_null
          - name: time
            description: "Heure du match"
          - name: league_source
            description: "Nom de la compétition source"
            tests:
              - not_null
          - name: day
            description: "Jour de la semaine"
          - name: venue
            description: "Lieu du match : Home ou Away"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Home', 'Away', 'Neutral']
          - name: result
            description: "Résultat brut FBref : W, D, L"
            tests:
              - accepted_values:
                  arguments:
                    values: ['W', 'D', 'L']
          - name: gf
            description: "Buts marqués"
            tests:
              - not_null
              - is_positive
          - name: ga
            description: "Buts encaissés"
            tests:
              - not_null
              - is_positive
          - name: opponent
            description: "Nom normalisé de l'adversaire"
            tests:
              - not_null
          - name: sota
            description: "Shots on target against — tirs cadrés subis par le gardien"
            tests:
              - not_null
              - is_positive
          - name: ga_keeper
            description: "Buts encaissés par le gardien (hors CSC)"
            tests:
              - not_null
              - is_positive
          - name: saves
            description: "Arrêts du gardien"
            tests:
              - not_null
              - is_positive
          - name: save_pct
            description: "Pourcentage d'arrêts (saves / sota)"
          - name: cs
            description: "Clean sheet — 1 si aucun but encaissé, 0 sinon"
            tests:
              - not_null
              - is_positive
          - name: pk_att
            description: "Penaltys tentés contre le gardien"
            tests:
              - not_null
              - is_positive
          - name: pk_allowed
            description: "Penaltys accordés (transformés contre)"
            tests:
              - not_null
              - is_positive
          - name: pk_saved
            description: "Penaltys arrêtés"
            tests:
              - not_null
              - is_positive
          - name: pk_missed
            description: "Penaltys manqués par l'attaquant adverse"
            tests:
              - not_null
              - is_positive
          - name: team
            description: "Nom normalisé de l'équipe"
            tests:
              - not_null
          - name: season
            description: "Saison au format YYYY-YYYY"
            tests:
              - not_null
          - name: source
            description: "Source de la donnée (fbref)"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['fbref']
          - name: scraped_at
            description: "Timestamp du scraping"
          - name: comp_category
            description: "Catégorie de compétition : Big5, Cup, Europe"
            tests:
              - not_null
          - name: raw_team
            description: "Nom brut de l'équipe avant normalisation"
            tests:
              - not_null
          - name: raw_opponent
            description: "Nom brut de l'adversaire"
            tests:
              - not_null
          - name: result_1n2
            description: "Résultat encodé : H, D, A"
            tests:
              - accepted_values:
                  arguments:
                    values: ['H', 'D', 'A']

      - name: fbref_shooting
        description: "Statistiques de tir FBref — 1 ligne par équipe par match"
        tests:
          # ── Grain silver — 0 doublon empirique ──
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [date, team, opponent, league_source]
          # ── Contraintes physiques dures (0 violation empirique) ──
          - dbt_utils.expression_is_true:
              expression: "standard_sot <= standard_sh"
          - dbt_utils.expression_is_true:
              expression: "standard_pk <= standard_pkatt"
          # ── A-011 (silver.fbref_shooting : bug scraping FBref suspecté) ──
          # 1 475 lignes empiriques avec standard_gls > standard_sot + 5 avec standard_gls > gf.
          # Warn en attendant investigation. Justifie un futur scraping_targets_int_fbref_shooting.
          - dbt_utils.expression_is_true:
              expression: "standard_gls <= standard_sot"
              config:
                severity: warn
          - dbt_utils.expression_is_true:
              expression: "standard_gls <= gf"
              config:
                severity: warn
        columns:
          - name: date
            description: "Date du match"
            tests:
              - not_null
          - name: time
            description: "Heure du match"
          - name: league_source
            description: "Nom de la compétition source"
            tests:
              - not_null
          - name: day
            description: "Jour de la semaine"
          - name: venue
            description: "Lieu du match : Home ou Away"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['Home', 'Away', 'Neutral']
          - name: result
            description: "Résultat brut FBref : W, D, L"
            tests:
              - accepted_values:
                  arguments:
                    values: ['W', 'D', 'L']
          - name: gf
            description: "Buts marqués"
            tests:
              - not_null
              - is_positive
          - name: ga
            description: "Buts encaissés"
            tests:
              - not_null
              - is_positive
          - name: opponent
            description: "Nom normalisé de l'adversaire"
            tests:
              - not_null
          - name: standard_gls
            description: "Buts marqués (hors pénaltys)"
            tests:
              - not_null
              - is_positive
          - name: standard_sh
            description: "Total de tirs tentés"
            tests:
              - not_null
              - is_positive
          - name: standard_sot
            description: "Tirs cadrés"
            tests:
              - not_null
              - is_positive
          - name: standard_sot_pct
            description: "Pourcentage de tirs cadrés (standard_sot / standard_sh)"
          - name: standard_g_sh
            description: "Buts par tir (efficacité offensive brute)"
          - name: standard_g_sot
            description: "Buts par tir cadré (efficacité offensive sur les tirs dangereux)"
          - name: standard_pk
            description: "Buts sur penalty"
            tests:
              - not_null
              - is_positive
          - name: standard_pkatt
            description: "Penaltys tentés"
            tests:
              - not_null
              - is_positive
          - name: team
            description: "Nom normalisé de l'équipe"
            tests:
              - not_null
          - name: season
            description: "Saison au format YYYY-YYYY"
            tests:
              - not_null
          - name: source
            description: "Source de la donnée (fbref)"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['fbref']
          - name: scraped_at
            description: "Timestamp du scraping"
          - name: comp_category
            description: "Catégorie de compétition : Big5, Cup, Europe"
            tests:
              - not_null
          - name: raw_team
            description: "Nom brut de l'équipe"
            tests:
              - not_null
          - name: raw_opponent
            description: "Nom brut de l'adversaire"
            tests:
              - not_null
          - name: result_1n2
            description: "Résultat encodé : H, D, A"
            tests:
              - accepted_values:
                  arguments:
                    values: ['H', 'D', 'A']

      - name: fbref_misc
        description: "Statistiques diverses FBref — cartons, fautes, corners, penaltys — 1 ligne par équipe par match"
        tests:
          # ── Grain silver — 0 doublon empirique ──
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [date, team, opponent, league_source]
          # ── Plafond de plausibilité disciplinaire ──
          # Empirique max = 9+3+2 = 14. Marge à 15.
          - dbt_utils.expression_is_true:
              expression: "crdy + crdr + crdy2 <= 15"
              config:
                severity: warn
        columns:
          - name: date
            description: "Date du match"
            tests:
              - not_null
          - name: time
            description: "Heure du match"
          - name: league_source
            description: "Nom de la compétition source"
            tests:
              - not_null
          - name: day
            description: "Jour de la semaine"
          - name: venue
            description: "Lieu du match : Home ou Away"
            tests:
