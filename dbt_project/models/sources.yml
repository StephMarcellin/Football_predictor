            description: "Affluence — 0 pour matches sans public (huis clos COVID)."

      - name: stg_whoscored_urls
        description: >
          Registre de scraping — 1 ligne par (ws_match_id, url). Statut is_scraped
          + skip_reason permettent de piloter le prochain run du scraper WhoScored.
          Table de gouvernance : jamais lue par un modèle dbt en aval.
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [ws_match_id]
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns: [url]
          # ── Cohérence : is_scraped=false ↔ scraped_at IS NULL ──
          - dbt_utils.expression_is_true:
              expression: "(is_scraped = TRUE AND scraped_at IS NOT NULL) OR (is_scraped = FALSE AND scraped_at IS NULL)"
        columns:
          - name: ws_match_id
            description: "Identifiant WhoScored du match"
            tests:
              - not_null
          - name: url
            description: "URL WhoScored du match"
            tests:
              - not_null
          - name: league_source
            description: "Championnat"
            tests:
              - not_null
          - name: season
            description: "Saison au format YYYY-YYYY"
            tests:
              - not_null
          - name: month_abbr
            description: "Mois abrégé du match"
          - name: match_year
            description: "Année du match"
          - name: is_scraped
            description: "Booléen : le match a été scrapé avec succès ?"
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: [true, false]
          - name: indexed_at
            description: "Timestamp de l'indexation (découverte de l'URL)"
          - name: scraped_at
            description: "Timestamp du scraping. NULL si is_scraped=false."
          - name: skip_reason
            description: "Raison du skip si is_scraped=false. NULL sinon (99.16 % NULL)."


  - name: intermediate
    description: >
      Tables intermédiaires gérées hors dbt (ex: match_registry alimenté par 02_process.py).
      dbt les lit comme sources pour construire les modèles intermediate.
    schema: intermediate

    tables:

      - name: match_registry
        description: >
          Registre central des matchs — 1 ligne par match physique.
          Alimenté par upsert depuis 02_process.py via SHA1 sur (date, home_team, away_team, league_source, season).
          Point de départ de toute la chaîne features du gold.
        columns:
          - name: match_id
            description: "Identifiant unique du match (SHA1)"
            tests:
              - not_null
              - unique
          - name: match_date
            description: "Date du match"
            tests:
              - not_null
          - name: home_team_id
            description: "Identifiant normalisé de l'équipe domicile (FK vers referentiel.team_mapping)"
            tests:
              - not_null
          - name: away_team_id
            description: "Identifiant normalisé de l'équipe extérieure (FK vers referentiel.team_mapping)"
            tests:
              - not_null:
                  config:
                    severity: warn
          - name: league_source
            description: "Compétition source"
            tests:
              - not_null
          - name: season
            description: "Saison au format YYYY-YYYY"
            tests:
              - not_null

  - name: machine_learning
    description: >
      Artefacts ML écrits hors dbt (Python). dbt les lit comme sources pour
      construire les modèles qui en dépendent.
    schema: machine_learning

    tables:

      - name: xt_grid
        description: >
          Grille Expected Threat (xT) 16×12 = 192 cases, estimée par
          pipelines/xt_grid.py (itération de valeur / chaîne de Markov) sur
          int_xt_actions. Étalon global stable : une valeur xT par case,
          croissante vers le but adverse, pic devant la surface. Lue par
          int_xt_contributions pour le xT ajouté par déplacement. Réécrite
          (CREATE OR REPLACE) à chaque run.
        columns:
          - name: col
            description: "Colonne de la case (0-15 ; 0 = son but, 15 = but adverse)."
            tests:
              - not_null
          - name: row
            description: "Ligne de la case (0-11 ; 6 ≈ axe central)."
            tests:
              - not_null
          - name: shots
            description: "Nombre de tirs partis de la case."
          - name: goals
            description: "Nombre de buts depuis la case."
          - name: moves
            description: "Déplacements réussis (avec destination) partis de la case."
          - name: turnover
            description: "Pertes de balle dans la case (fin de possession)."
          - name: shoot_pct
            description: "P(tir) = shots / (shots + moves + turnover)."
          - name: goal_prob
            description: "P(but | tir) = goals / shots."
          - name: move_pct
            description: "P(déplacement réussi) = moves / (shots + moves + turnover)."
          - name: xt
            description: "Valeur Expected Threat de la case (résultat de l'itération)."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - col
                - row

      - name: xgot_predictions
        description: >
                xGOT par tir cadré, écrit par pipelines/xgot_score.py (application de
                models/xgot.joblib à machine_learning.xgot_features). Réécrite
                (CREATE OR REPLACE) à chaque run. Lue par int_keeper_shots. Grain :
                (match_id, row_num).
        columns:
            - name: match_id
              description: "Identifiant unifié du match (SHA1)."
            - name: row_num
              description: "Index de l'événement de tir dans le flux du match. Avec match_id, clé unique."
            - name: season
              description: "Saison du match (ex. 2023-2024)."
            - name: is_goal
              description: "Booléen : le tir cadré a fini au fond."
            - name: xgot
              description: "Post-Shot xG (xGOT) du tir, calibré, dans [0,1]."
      - name: player_style_clusters
        description: >
          Clusters de style par (player_id, season), écrits par
          pipelines/03_knn_impute.py (KMeans standardisé sur profil + position,
          3 clusters/côté, labels sémantiques ; gardiens = 'GK'). Réécrite
          (CREATE OR REPLACE) à chaque run. Pré-restreint le vivier de voisins du
          KNN et sert de repli. Grain : (player_id, season).
        columns:
          - name: player_id
            description: "Identifiant joueur."
          - name: season
            description: "Saison (ex. 2023-2024)."
          - name: cluster_offensive
            description: "Style offensif : off_finisher / off_creator / off_low / GK."
          - name: cluster_defensive
            description: "Style défensif : def_aerial / def_recuperator / def_low / GK."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - player_id
                - season

      - name: zonal_profiles_imputed
        description: >
          Profils zonaux imputés (famille 11), écrits par
          pipelines/03_knn_impute.py. Même grain que gold.joueur_zone_saison : les
          cellules fiables (flag high/medium) sont conservées, les autres imputées
          par KNN action-spécifique (repli cluster). Un flag <feature>_imputed par
          colonne. Réécrite (CREATE OR REPLACE) à chaque run.
          Grain : (player_id, season, zone_5x5).
        columns:
          - name: player_id
            description: "Identifiant joueur."
          - name: season
            description: "Saison (ex. 2023-2024)."
          - name: zone_5x5
            description: "Cellule zonale z{1..5}_c{1..5} (25 cases)."
        tests:
          - dbt_utils.unique_combination_of_columns:
              combination_of_columns:
                - player_id
                - season
                - zone_5x5