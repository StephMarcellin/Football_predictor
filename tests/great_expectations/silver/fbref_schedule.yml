# ══════════════════════════════════════════════════════════════════════════════
# Suite Great Expectations — silver.fbref_schedule
# Rôle : SIGNAL & DISTRIBUTIONS — table centrale FBref
# Contrainte spatiotemporelle : aucune (FBref couvre toutes les comp_category).
# Test dérive volumétrique : exclut la saison 2025-2026 (scraping en cours).
# ══════════════════════════════════════════════════════════════════════════════

suite_name: silver.fbref_schedule
description: >
  Signal statistique de la source silver.fbref_schedule (feuille de match FBref,
  point de départ de la chaîne features). Couvre toutes les compétitions.

source:
  duckdb_path: db/football.duckdb
  query: |
    SELECT
      date, team, opponent, league_source, season,
      venue, result, result_1n2, comp_category, source,
      gf, ga, poss, formation, opp_formation
    FROM silver.fbref_schedule

expectations:
  - type: expect_table_row_count_to_be_between
    kwargs: { min_value: 40000, max_value: 100000 }
    severity: error
    meta: { description: "Empirique = 54 296." }

  # NULL rate
  - type: expect_column_values_to_not_be_null
    for_each_column:
      - date
      - team
      - opponent
      - league_source
      - season
      - venue
      - comp_category
      - source
      - gf
      - ga
      - poss
      - formation
      - opp_formation
    kwargs: { mostly: 1.0 }
    severity: error

  # result_1n2 : 1.96 % NULL empirique — cohérent avec matches à venir sans résultat
  - type: expect_column_values_to_not_be_null
    kwargs: { column: result_1n2, mostly: 0.95 }
    severity: warn
    meta: { description: "Empirique = 1.96 % NULL." }

  # Bornes
  - type: expect_column_values_to_be_between
    for_each_column: [gf, ga]
    kwargs: { min_value: 0, max_value: 20, mostly: 1.0 }
    severity: error

  # Moyennes
  - type: expect_column_mean_to_be_between
    for_each_column: [gf, ga]
    kwargs: { min_value: 1.0, max_value: 2.0 }
    severity: error

  # Dérive volumétrique
  - type: expect_partition_volume_stability
    kwargs:
      partition_col: season
      max_deviation_warn: 0.20
      max_deviation_error: 0.40
      min_seasons_history: 2
      exclude_partitions: ['2025-2026']
    severity: warn
