# ══════════════════════════════════════════════════════════════════════════════
# Suite GE — silver.stg_whoscored_urls
# Registre de scraping. Table de gouvernance : is_scraped ↔ scraped_at.
# ══════════════════════════════════════════════════════════════════════════════

suite_name: silver.stg_whoscored_urls
description: Registre de scraping WhoScored — statut, timestamps, raisons de skip.

source:
  query: |
    SELECT
      ws_match_id, url, league_source, season,
      month_abbr, match_year, is_scraped,
      indexed_at, scraped_at, skip_reason
    FROM silver.stg_whoscored_urls

expectations:
  # NULL rate structurel
  - type: expect_column_values_to_not_be_null
    for_each_column:
      - ws_match_id
      - url
      - league_source
      - season
      - month_abbr
      - match_year
      - is_scraped
      - indexed_at
    kwargs: { mostly: 1.0 }
    # severity: error
    severity: warn

  # scraped_at : 0.83 % NULL (matches skippés)
  - type: expect_column_values_to_not_be_null
    kwargs: { column: scraped_at, mostly: 0.94 }
    severity: warn
    meta: { description: "Empirique = 0.83 % NULL — matches skippés. Marge +5 pts." }

  # match_year plausible
  - type: expect_column_values_to_be_between
    kwargs: { column: match_year, min_value: 2005, max_value: 2030, mostly: 1.0 }
    # severity: error
    severity: warn
    meta: { description: "Empirique min=2009 max=2026." }