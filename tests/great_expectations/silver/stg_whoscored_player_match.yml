# ══════════════════════════════════════════════════════════════════════════════
# Suite GE — silver.stg_whoscored_player_match
# Faits joueur × match. Grain (ws_match_id, team_id, player_id).
# ══════════════════════════════════════════════════════════════════════════════

suite_name: silver.stg_whoscored_player_match
description: Faits WhoScored joueur × match — rating, position, is_first_eleven.

source:
  query: |
    SELECT
      ws_match_id, team_id, player_id,
      shirt_no, position, is_first_eleven, is_man_of_the_match,
      height, weight, age, rating
    FROM silver.stg_whoscored_player_match

expectations:
  # Structurels
  - type: expect_column_values_to_not_be_null
    for_each_column:
      - ws_match_id
      - team_id
      - player_id
      # - shirt_no
      - position
      - is_man_of_the_match
    kwargs: { mostly: 1.0 }
    # severity: error
    severity: warn

  # is_first_eleven NULL
  - type: expect_column_values_to_not_be_null
    kwargs: { column: is_first_eleven, mostly: 0.50 }
    severity: warn
    meta: { description: "Empirique = 45.17 % NULL (position = 'Sub')." }

  # rating NULL
  - type: expect_column_values_to_not_be_null
    kwargs: { column: rating, mostly: 0.68 }
    severity: warn
    meta: { description: "Empirique = 26.51 % NULL (Sub non entré)." }

  # Rating dans échelle WhoScored [3.0, 10.0]
  - type: expect_column_values_to_be_between
    kwargs: { column: rating, min_value: 0, max_value: 10, mostly: 1.0 }
    # severity: error
    severity: warn

  # shirt_no plausible
  - type: expect_column_values_to_be_between
    kwargs: { column: shirt_no, min_value: 1, max_value: 99, mostly: 1.0 }
    # severity: error
    severity: warn

  # A-016 : height / weight avec sentinelles 0
  - type: expect_column_values_to_be_between
    kwargs: { column: height, min_value: 0, max_value: 220, mostly: 1.0 }
    severity: warn
    meta: { description: "A-016 : 2 260 lignes height=0 (sentinel manquant)." }

  - type: expect_column_values_to_be_between
    kwargs: { column: weight, min_value: 0, max_value: 120, mostly: 1.0 }
    severity: warn
    meta: { description: "A-016 : 6 460 lignes weight=0 (sentinel manquant)." }

  - type: expect_column_values_to_be_between
    kwargs: { column: age, min_value: 0, max_value: 55, mostly: 1.0 }
    severity: warn
    meta: { description: "A-016 : 2 lignes age=0 (sentinel manquant)." }

  # Moyenne rating cohérente WhoScored
  - type: expect_column_mean_to_be_between
    kwargs: { column: rating, min_value: 6.0, max_value: 7.5 }
    # severity: error
    severity: warn