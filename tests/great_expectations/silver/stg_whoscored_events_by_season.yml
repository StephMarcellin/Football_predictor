# ══════════════════════════════════════════════════════════════════════════════
# Suite GE — silver.stg_whoscored_events (agrégats par saison)
# Stratégie big data : PUSH-DOWN AGRÉGATS.
# ══════════════════════════════════════════════════════════════════════════════

suite_name: silver.stg_whoscored_events.by_season
description: >
  Signal statistique de stg_whoscored_events agrégé par saison. Push-down :
  aucune ligne brute ne remonte à pandas, seulement les agrégats saison.

source:
  query: |
    SELECT
      season,
      COUNT(*)                                      AS n_events,
      COUNT(DISTINCT ws_match_id)                   AS n_matches,
      COUNT(DISTINCT team_id)                       AS n_teams,
      COUNT(DISTINCT player_id) FILTER (WHERE player_id IS NOT NULL) AS n_players,
      COUNT(DISTINCT type_id)                       AS n_type_ids,
      SUM(CASE WHEN is_shot THEN 1 ELSE 0 END)      AS n_shots,
      SUM(CASE WHEN is_goal THEN 1 ELSE 0 END)      AS n_goals,
      SUM(CASE WHEN is_own_goal THEN 1 ELSE 0 END)  AS n_own_goals,
      SUM(CASE WHEN type_id = 1 THEN 1 ELSE 0 END)  AS n_passes,
      SUM(CASE WHEN type_id = 4 THEN 1 ELSE 0 END)  AS n_fouls,
      SUM(CASE WHEN second IS NULL THEN 1 ELSE 0 END)     AS n_null_second,
      SUM(CASE WHEN player_id IS NULL THEN 1 ELSE 0 END)  AS n_null_player_id,
      SUM(CASE WHEN end_x IS NULL THEN 1 ELSE 0 END)      AS n_null_end_x
    FROM silver.stg_whoscored_events
    GROUP BY season
    ORDER BY season

expectations:
  # Volume events par saison — plancher / plafond
  - type: expect_column_values_to_be_between
    kwargs: { column: n_events, min_value: 1500000, max_value: 5500000, mostly: 1.0 }
    # severity: error
    severity: warn
    meta: { description: "Volume events par saison plausible." }

  # Nombre de matches par saison
  - type: expect_column_values_to_be_between
    kwargs: { column: n_matches, min_value: 1200, max_value: 3200, mostly: 1.0 }
    # severity: error
    severity: warn
    meta: { description: "Empirique : 1441 (2011-12) à 2684 (2020-21)." }

  # Cohérence types et acteurs
  - type: expect_column_values_to_be_between
    kwargs: { column: n_type_ids, min_value: 30, max_value: 45, mostly: 1.0 }
    # severity: error
    severity: warn

  - type: expect_column_values_to_be_between
    kwargs: { column: n_teams, min_value: 30, max_value: 200, mostly: 1.0 }
    severity: warn

  - type: expect_column_values_to_be_between
    kwargs: { column: n_players, min_value: 1500, max_value: 5500, mostly: 1.0 }
    severity: warn

  # Métriques football
  - type: expect_column_mean_to_be_between
    kwargs: { column: n_passes, min_value: 1500000, max_value: 3500000 }
    # severity: error
    severity: warn
    meta: { description: "Moyenne passes/saison — empirique ~2.2M." }

  # Taux NULL par saison
  - type: expect_column_values_to_be_between
    kwargs: { column: n_null_second, min_value: 0, max_value: 50000, mostly: 1.0 }
    severity: warn
    meta: { description: "Dette 'second NULL' localisée : max 50 k / saison." }

  - type: expect_column_values_to_be_between
    kwargs: { column: n_null_player_id, min_value: 0, max_value: 200000, mostly: 1.0 }
    severity: warn