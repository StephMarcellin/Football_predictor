suite_name: gold.joueur_zone_saison
description: >
  Push-down agrégats. Volumétrie de référence : 1,398,725 lignes.

source:
  duckdb_path: db/football.duckdb
  query: |
    SELECT
          COUNT(*) AS n_rows,
          COUNT(*) FILTER (WHERE "str_player_id" IS NULL) AS null_player_id,
          COUNT(*) FILTER (WHERE "str_zone_5x5" IS NULL) AS null_zone_5x5,
          COUNT(*) FILTER (WHERE "str_season" IS NULL) AS null_season,
          COUNT(*) FILTER (WHERE "dec_off_touch_share_by_zone_lag" IS NULL) AS null_off_touch_share_by_zone_lag,
          COUNT(*) FILTER (WHERE "dec_off_shot_volume_by_zone_lag" IS NULL) AS null_off_shot_volume_by_zone_lag,
          COUNT(*) FILTER (WHERE "dec_off_danger_by_zone_lag" IS NULL) AS null_off_danger_by_zone_lag,
          COUNT(*) FILTER (WHERE "dec_off_progressive_actions_by_zone_lag" IS NULL) AS null_off_progressive_actions_by_zone_lag,
          COUNT(*) FILTER (WHERE "dec_off_cross_volume_by_zone_lag" IS NULL) AS null_off_cross_volume_by_zone_lag,
          COUNT(*) FILTER (WHERE "dec_def_duel_win_rate_by_zone_lag" IS NULL) AS null_def_duel_win_rate_by_zone_lag,
          COUNT(*) FILTER (WHERE "dec_def_actions_by_zone_lag" IS NULL) AS null_def_actions_by_zone_lag,
          COUNT(*) FILTER (WHERE "int_n_duels_prev" IS NULL) AS null_n_duels_prev,
          COUNT(*) FILTER (WHERE "int_n_matches_prev" IS NULL) AS null_n_matches_prev,
          COUNT(*) FILTER (WHERE "str_profile_confidence_flag" IS NULL) AS null_profile_confidence_flag,
          MIN("dec_off_touch_share_by_zone_lag") AS min_off_touch_share_by_zone_lag,
          MAX("dec_off_touch_share_by_zone_lag") AS max_off_touch_share_by_zone_lag,
          AVG("dec_off_touch_share_by_zone_lag") AS avg_off_touch_share_by_zone_lag,
          MIN("dec_off_shot_volume_by_zone_lag") AS min_off_shot_volume_by_zone_lag,
          MAX("dec_off_shot_volume_by_zone_lag") AS max_off_shot_volume_by_zone_lag,
          AVG("dec_off_shot_volume_by_zone_lag") AS avg_off_shot_volume_by_zone_lag,
          MIN("dec_off_danger_by_zone_lag") AS min_off_danger_by_zone_lag,
          MAX("dec_off_danger_by_zone_lag") AS max_off_danger_by_zone_lag,
          AVG("dec_off_danger_by_zone_lag") AS avg_off_danger_by_zone_lag,
          MIN("dec_off_progressive_actions_by_zone_lag") AS min_off_progressive_actions_by_zone_lag,
          MAX("dec_off_progressive_actions_by_zone_lag") AS max_off_progressive_actions_by_zone_lag,
          AVG("dec_off_progressive_actions_by_zone_lag") AS avg_off_progressive_actions_by_zone_lag,
          MIN("dec_off_cross_volume_by_zone_lag") AS min_off_cross_volume_by_zone_lag,
          MAX("dec_off_cross_volume_by_zone_lag") AS max_off_cross_volume_by_zone_lag,
          AVG("dec_off_cross_volume_by_zone_lag") AS avg_off_cross_volume_by_zone_lag,
          MIN("dec_def_duel_win_rate_by_zone_lag") AS min_def_duel_win_rate_by_zone_lag,
          MAX("dec_def_duel_win_rate_by_zone_lag") AS max_def_duel_win_rate_by_zone_lag,
          AVG("dec_def_duel_win_rate_by_zone_lag") AS avg_def_duel_win_rate_by_zone_lag,
          MIN("dec_def_actions_by_zone_lag") AS min_def_actions_by_zone_lag,
          MAX("dec_def_actions_by_zone_lag") AS max_def_actions_by_zone_lag,
          AVG("dec_def_actions_by_zone_lag") AS avg_def_actions_by_zone_lag,
          MIN("int_n_duels_prev") AS min_n_duels_prev,
          MAX("int_n_duels_prev") AS max_n_duels_prev,
          AVG("int_n_duels_prev") AS avg_n_duels_prev,
          MIN("int_n_matches_prev") AS min_n_matches_prev,
          MAX("int_n_matches_prev") AS max_n_matches_prev,
          AVG("int_n_matches_prev") AS avg_n_matches_prev
        FROM gold."joueur_zone_saison"

expectations:

  # ── VOLUMÉTRIE (1 ligne agrégée = 1 seule row en output) ──
  - type: expect_table_row_count_to_be_between
    kwargs: { min_value: 1, max_value: 1 }
    # severity: error
    severity: warn
    meta: { description: "Agrégat push-down doit renvoyer exactement 1 ligne." }

  - type: expect_row_condition_to_hold
    kwargs:
      condition: "n_rows >= 559490 and n_rows <= 2797450"
