# ═════════════════════════════════════════════════════════════════════
# Suite Great Expectations — gold.joueur_zone_saison (PUSH-DOWN 2026-09-09)
# Volumétrie : 1,398,725 lignes, 13 colonnes
# Stratégie big data : agrégats DuckDB → 1 ligne en pandas.
