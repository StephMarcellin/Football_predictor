          AVG("minutes_lag") AS avg_minutes_lag,
          MIN("scorer_xg_per90_lag") AS min_scorer_xg_per90_lag,
          MAX("scorer_xg_per90_lag") AS max_scorer_xg_per90_lag,
          AVG("scorer_xg_per90_lag") AS avg_scorer_xg_per90_lag,
          MIN("scorer_shots_per90_lag") AS min_scorer_shots_per90_lag,
          MAX("scorer_shots_per90_lag") AS max_scorer_shots_per90_lag,
          AVG("scorer_shots_per90_lag") AS avg_scorer_shots_per90_lag,
          MIN("off_chances_created_per90_lag") AS min_off_chances_created_per90_lag,
