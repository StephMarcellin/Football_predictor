suite_name: gold.joueur_saison
description: >
  Push-down agrégats. Volumétrie de référence : 1,075,422 lignes.

source:
  duckdb_path: db/football.duckdb
  query: |
    SELECT
          COUNT(*) AS n_rows,
          COUNT(*) FILTER (WHERE "match_id" IS NULL) AS null_match_id,
          COUNT(*) FILTER (WHERE "team_id" IS NULL) AS null_team_id,
          COUNT(*) FILTER (WHERE "player_id" IS NULL) AS null_player_id,
          COUNT(*) FILTER (WHERE "date" IS NULL) AS null_date,
          COUNT(*) FILTER (WHERE "season" IS NULL) AS null_season,
          COUNT(*) FILTER (WHERE "league_source" IS NULL) AS null_league_source,
          COUNT(*) FILTER (WHERE "n_apps_lag" IS NULL) AS null_n_apps_lag,
          COUNT(*) FILTER (WHERE "minutes_lag" IS NULL) AS null_minutes_lag,
          COUNT(*) FILTER (WHERE "scorer_xg_per90_lag" IS NULL) AS null_scorer_xg_per90_lag,
          COUNT(*) FILTER (WHERE "scorer_shots_per90_lag" IS NULL) AS null_scorer_shots_per90_lag,
          COUNT(*) FILTER (WHERE "off_chances_created_per90_lag" IS NULL) AS null_off_chances_created_per90_lag,
          COUNT(*) FILTER (WHERE "off_key_passes_per90_lag" IS NULL) AS null_off_key_passes_per90_lag,
          COUNT(*) FILTER (WHERE "off_xg_per_shot_lag" IS NULL) AS null_off_xg_per_shot_lag,
          COUNT(*) FILTER (WHERE "def_aerial_win_rate_lag" IS NULL) AS null_def_aerial_win_rate_lag,
          COUNT(*) FILTER (WHERE "def_actions_per90_lag" IS NULL) AS null_def_actions_per90_lag,
          COUNT(*) FILTER (WHERE "def_errors_per90_lag" IS NULL) AS null_def_errors_per90_lag,
          COUNT(*) FILTER (WHERE "player_card_propensity_lag" IS NULL) AS null_player_card_propensity_lag,
          COUNT(*) FILTER (WHERE "off_xgchain_per90_lag" IS NULL) AS null_off_xgchain_per90_lag,
          COUNT(*) FILTER (WHERE "off_xgbuildup_per90_lag" IS NULL) AS null_off_xgbuildup_per90_lag,
          COUNT(*) FILTER (WHERE "scorer_team_shot_share_lag" IS NULL) AS null_scorer_team_shot_share_lag,
          COUNT(*) FILTER (WHERE "scorer_penalty_taker_lag" IS NULL) AS null_scorer_penalty_taker_lag,
          COUNT(*) FILTER (WHERE "scorer_freekick_taker_lag" IS NULL) AS null_scorer_freekick_taker_lag,
          COUNT(*) FILTER (WHERE "def_threat_conceded_per90_lag" IS NULL) AS null_def_threat_conceded_per90_lag,
          COUNT(*) FILTER (WHERE "scorer_xgot_overperformance_lag" IS NULL) AS null_scorer_xgot_overperformance_lag,
          COUNT(*) FILTER (WHERE "profile_confidence_flag" IS NULL) AS null_profile_confidence_flag,
          MIN("team_id") AS min_team_id,
          MAX("team_id") AS max_team_id,
          AVG("team_id") AS avg_team_id,
          MIN("player_id") AS min_player_id,
          MAX("player_id") AS max_player_id,
          AVG("player_id") AS avg_player_id,
          MIN("n_apps_lag") AS min_n_apps_lag,
          MAX("n_apps_lag") AS max_n_apps_lag,
          AVG("n_apps_lag") AS avg_n_apps_lag,
          MIN("minutes_lag") AS min_minutes_lag,
