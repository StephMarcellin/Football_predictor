# ═════════════════════════════════════════════════════════════════════
# Suite Great Expectations — intermediate.int_player_zone_season (PUSH-DOWN 2026-09-09)
# Volumétrie : 1,398,725 lignes, 12 colonnes
# Stratégie big data : agrégats DuckDB → 1 ligne en pandas.
# ═════════════════════════════════════════════════════════════════════

suite_name: intermediate.int_player_zone_season
description: >
  Push-down agrégats. Volumétrie de référence : 1,398,725 lignes.

source:
  duckdb_path: db/football.duckdb
  query: |
    SELECT
          COUNT(*) AS n_rows,
          COUNT(*) FILTER (WHERE "str_player_id" IS NULL) AS null_player_id,
          COUNT(*) FILTER (WHERE "str_zone_5x5" IS NULL) AS null_zone_5x5,
          COUNT(*) FILTER (WHERE "str_season" IS NULL) AS null_season,
          COUNT(*) FILTER (WHERE "dec_avg_touch_share" IS NULL) AS null_avg_touch_share,
          COUNT(*) FILTER (WHERE "int_n_matches" IS NULL) AS null_n_matches,
          COUNT(*) FILTER (WHERE "int_total_shots" IS NULL) AS null_total_shots,
          COUNT(*) FILTER (WHERE "int_n_duels" IS NULL) AS null_n_duels,
          COUNT(*) FILTER (WHERE "int_duels_won" IS NULL) AS null_duels_won,
          COUNT(*) FILTER (WHERE "dec_total_danger" IS NULL) AS null_total_danger,
          COUNT(*) FILTER (WHERE "int_total_progressive" IS NULL) AS null_total_progressive,
          COUNT(*) FILTER (WHERE "int_total_crosses" IS NULL) AS null_total_crosses,
          COUNT(*) FILTER (WHERE "int_total_def_actions" IS NULL) AS null_total_def_actions,
          MIN("dec_avg_touch_share") AS min_avg_touch_share,
          MAX("dec_avg_touch_share") AS max_avg_touch_share,
          AVG("dec_avg_touch_share") AS avg_avg_touch_share,
          MIN("int_n_matches") AS min_n_matches,
          MAX("int_n_matches") AS max_n_matches,
          AVG("int_n_matches") AS avg_n_matches,
          MIN("int_total_shots") AS min_total_shots,
          MAX("int_total_shots") AS max_total_shots,
          AVG("int_total_shots") AS avg_total_shots,
          MIN("int_n_duels") AS min_n_duels,
          MAX("int_n_duels") AS max_n_duels,
          AVG("int_n_duels") AS avg_n_duels,
          MIN("int_duels_won") AS min_duels_won,
          MAX("int_duels_won") AS max_duels_won,
          AVG("int_duels_won") AS avg_duels_won,
          MIN("dec_total_danger") AS min_total_danger,
          MAX("dec_total_danger") AS max_total_danger,
          AVG("dec_total_danger") AS avg_total_danger,
          MIN("int_total_progressive") AS min_total_progressive,
          MAX("int_total_progressive") AS max_total_progressive,
          AVG("int_total_progressive") AS avg_total_progressive,
          MIN("int_total_crosses") AS min_total_crosses,
          MAX("int_total_crosses") AS max_total_crosses,
          AVG("int_total_crosses") AS avg_total_crosses,
          MIN("int_total_def_actions") AS min_total_def_actions,
          MAX("int_total_def_actions") AS max_total_def_actions,
          AVG("int_total_def_actions") AS avg_total_def_actions
        FROM intermediate."int_player_zone_season"

expectations:

  # ── VOLUMÉTRIE (1 ligne agrégée = 1 seule row en output) ──
  - type: expect_table_row_count_to_be_between
    kwargs: { min_value: 1, max_value: 1 }
    # severity: error
    severity: warn
    meta: { description: "Agrégat push-down doit renvoyer exactement 1 ligne." }

  - type: expect_row_condition_to_hold
    kwargs:
      condition: "n_rows >= 559490 and n_rows <= 2797450"
    # severity: error
    severity: warn
    meta: { description: "Row count empirique = 1,398,725." }

  # ── COMPLÉTION PAR COLONNE (push-down NULL counts) ──
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_player_id / n_rows <= 0.001"
    severity: warn
    meta: { description: "player_id empirique 0.00% NULL." }
  - type: expect_row_condition_to_hold
