suite_name: intermediate.player_possession_chains
description: >
  Push-down agrégats. Volumétrie de référence : 3,711,226 lignes.

source:
  duckdb_path: db/football.duckdb
  query: |
    SELECT
          COUNT(*) AS n_rows,
          COUNT(*) FILTER (WHERE "match_id" IS NULL) AS null_match_id,
          COUNT(*) FILTER (WHERE "season" IS NULL) AS null_season,
          COUNT(*) FILTER (WHERE "league_source" IS NULL) AS null_league_source,
          COUNT(*) FILTER (WHERE "chain_id" IS NULL) AS null_chain_id,
          COUNT(*) FILTER (WHERE "chain_number" IS NULL) AS null_chain_number,
          COUNT(*) FILTER (WHERE "chain_team_id" IS NULL) AS null_chain_team_id,
          COUNT(*) FILTER (WHERE "team_id" IS NULL) AS null_team_id,
          COUNT(*) FILTER (WHERE "player_id" IS NULL) AS null_player_id,
          COUNT(*) FILTER (WHERE "event_id" IS NULL) AS null_event_id,
          COUNT(*) FILTER (WHERE "row_num" IS NULL) AS null_row_num,
          COUNT(*) FILTER (WHERE "expanded_minute" IS NULL) AS null_expanded_minute,
          COUNT(*) FILTER (WHERE "second" IS NULL) AS null_second,
          COUNT(*) FILTER (WHERE "period" IS NULL) AS null_period,
          COUNT(*) FILTER (WHERE "type_id" IS NULL) AS null_type_id,
          COUNT(*) FILTER (WHERE "type_name" IS NULL) AS null_type_name,
          COUNT(*) FILTER (WHERE "outcome_id" IS NULL) AS null_outcome_id,
          COUNT(*) FILTER (WHERE "is_shot" IS NULL) AS null_is_shot,
          COUNT(*) FILTER (WHERE "x" IS NULL) AS null_x,
          COUNT(*) FILTER (WHERE "y" IS NULL) AS null_y,
          COUNT(*) FILTER (WHERE "is_rupture" IS NULL) AS null_is_rupture,
          COUNT(*) FILTER (WHERE "chain_trigger" IS NULL) AS null_chain_trigger,
          COUNT(*) FILTER (WHERE "certain_possessor" IS NULL) AS null_certain_possessor,
          COUNT(*) FILTER (WHERE "scraped_at" IS NULL) AS null_scraped_at,
          MIN("chain_number") AS min_chain_number,
          MAX("chain_number") AS max_chain_number,
          AVG("chain_number") AS avg_chain_number,
          MIN("chain_team_id") AS min_chain_team_id,
          MAX("chain_team_id") AS max_chain_team_id,
          AVG("chain_team_id") AS avg_chain_team_id,
          MIN("team_id") AS min_team_id,
          MAX("team_id") AS max_team_id,
          AVG("team_id") AS avg_team_id,
          MIN("player_id") AS min_player_id,
          MAX("player_id") AS max_player_id,
          AVG("player_id") AS avg_player_id,
          MIN("event_id") AS min_event_id,
          MAX("event_id") AS max_event_id,
          AVG("event_id") AS avg_event_id,
          MIN("row_num") AS min_row_num,
          MAX("row_num") AS max_row_num,
          AVG("row_num") AS avg_row_num,
          MIN("expanded_minute") AS min_expanded_minute,
          MAX("expanded_minute") AS max_expanded_minute,
          AVG("expanded_minute") AS avg_expanded_minute,
          MIN("second") AS min_second,
          MAX("second") AS max_second,
          AVG("second") AS avg_second,
          MIN("period") AS min_period,
          MAX("period") AS max_period,
          AVG("period") AS avg_period,
          MIN("type_id") AS min_type_id,
          MAX("type_id") AS max_type_id,
          AVG("type_id") AS avg_type_id,
          MIN("outcome_id") AS min_outcome_id,
          MAX("outcome_id") AS max_outcome_id,
          AVG("outcome_id") AS avg_outcome_id,
          MIN("x") AS min_x,
          MAX("x") AS max_x,
          AVG("x") AS avg_x,
          MIN("y") AS min_y,
          MAX("y") AS max_y,
          AVG("y") AS avg_y,
          MIN("is_rupture") AS min_is_rupture,
          MAX("is_rupture") AS max_is_rupture,
          AVG("is_rupture") AS avg_is_rupture,
          MIN("certain_possessor") AS min_certain_possessor,
          MAX("certain_possessor") AS max_certain_possessor,
          AVG("certain_possessor") AS avg_certain_possessor
        FROM intermediate."player_possession_chains"

