          AVG("blocked_x") AS avg_blocked_x,
          MIN("blocked_y") AS min_blocked_y,
          MAX("blocked_y") AS max_blocked_y,
          AVG("blocked_y") AS avg_blocked_y
        FROM intermediate."int_whoscored_events"

