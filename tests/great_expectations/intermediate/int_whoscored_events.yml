# ═════════════════════════════════════════════════════════════════════
# Suite Great Expectations — intermediate.int_whoscored_events (PUSH-DOWN 2026-09-09)
# Volumétrie : 60,251,567 lignes, 32 colonnes
# Stratégie big data : agrégats DuckDB → 1 ligne en pandas.
# ═════════════════════════════════════════════════════════════════════

suite_name: intermediate.int_whoscored_events
description: >
  Push-down agrégats. Volumétrie de référence : 60,251,567 lignes.

source:
  duckdb_path: db/football.duckdb
  query: |
    SELECT
          COUNT(*) AS n_rows,
          COUNT(*) FILTER (WHERE "str_match_id" IS NULL) AS null_match_id,
          COUNT(*) FILTER (WHERE "str_team_id" IS NULL) AS null_team_id,
          COUNT(*) FILTER (WHERE "str_event_id" IS NULL) AS null_event_id,
          COUNT(*) FILTER (WHERE "str_league_source" IS NULL) AS null_league_source,
          COUNT(*) FILTER (WHERE "str_season" IS NULL) AS null_season,
          COUNT(*) FILTER (WHERE "int_minute" IS NULL) AS null_minute,
          COUNT(*) FILTER (WHERE "int_second" IS NULL) AS null_second,
          COUNT(*) FILTER (WHERE "int_expanded_minute" IS NULL) AS null_expanded_minute,
          COUNT(*) FILTER (WHERE "int_period" IS NULL) AS null_period,
          COUNT(*) FILTER (WHERE "str_player_id" IS NULL) AS null_player_id,
          COUNT(*) FILTER (WHERE "dec_x" IS NULL) AS null_x,
          COUNT(*) FILTER (WHERE "dec_y" IS NULL) AS null_y,
          COUNT(*) FILTER (WHERE "dec_end_x" IS NULL) AS null_end_x,
          COUNT(*) FILTER (WHERE "dec_end_y" IS NULL) AS null_end_y,
          COUNT(*) FILTER (WHERE "str_type_id" IS NULL) AS null_type_id,
          COUNT(*) FILTER (WHERE "str_type_name" IS NULL) AS null_type_name,
          COUNT(*) FILTER (WHERE "str_outcome_id" IS NULL) AS null_outcome_id,
          COUNT(*) FILTER (WHERE "str_outcome_name" IS NULL) AS null_outcome_name,
          COUNT(*) FILTER (WHERE "bool_is_touch" IS NULL) AS null_is_touch,
          COUNT(*) FILTER (WHERE "bool_is_shot" IS NULL) AS null_is_shot,
          COUNT(*) FILTER (WHERE "dt_scraped_at" IS NULL) AS null_scraped_at,
          COUNT(*) FILTER (WHERE "int_row_num" IS NULL) AS null_row_num,
          COUNT(*) FILTER (WHERE "bool_is_goal" IS NULL) AS null_is_goal,
          COUNT(*) FILTER (WHERE "bool_is_own_goal" IS NULL) AS null_is_own_goal,
          COUNT(*) FILTER (WHERE "str_related_event_id" IS NULL) AS null_related_event_id,
          COUNT(*) FILTER (WHERE "str_related_player_id" IS NULL) AS null_related_player_id,
          COUNT(*) FILTER (WHERE "str_card_type" IS NULL) AS null_card_type,
          COUNT(*) FILTER (WHERE "dec_goal_mouth_y" IS NULL) AS null_goal_mouth_y,
          COUNT(*) FILTER (WHERE "dec_goal_mouth_z" IS NULL) AS null_goal_mouth_z,
          COUNT(*) FILTER (WHERE "dec_blocked_x" IS NULL) AS null_blocked_x,
          COUNT(*) FILTER (WHERE "dec_blocked_y" IS NULL) AS null_blocked_y,
          MIN("int_minute") AS min_minute,
          MAX("int_minute") AS max_minute,
          AVG("int_minute") AS avg_minute,
          MIN("int_second") AS min_second,
          MAX("int_second") AS max_second,
          AVG("int_second") AS avg_second,
          MIN("int_expanded_minute") AS min_expanded_minute,
          MAX("int_expanded_minute") AS max_expanded_minute,
          AVG("int_expanded_minute") AS avg_expanded_minute,
          MIN("int_period") AS min_period,
          MAX("int_period") AS max_period,
          AVG("int_period") AS avg_period,
          MIN("dec_x") AS min_x,
          MAX("dec_x") AS max_x,
          AVG("dec_x") AS avg_x,
          MIN("dec_y") AS min_y,
          MAX("dec_y") AS max_y,
          AVG("dec_y") AS avg_y,
          MIN("dec_end_x") AS min_end_x,
          MAX("dec_end_x") AS max_end_x,
          AVG("dec_end_x") AS avg_end_x,
          MIN("dec_end_y") AS min_end_y,
          MAX("dec_end_y") AS max_end_y,
          AVG("dec_end_y") AS avg_end_y,
          MIN("int_row_num") AS min_row_num,
          MAX("int_row_num") AS max_row_num,
          AVG("int_row_num") AS avg_row_num,
          MIN("dec_goal_mouth_y") AS min_goal_mouth_y,
          MAX("dec_goal_mouth_y") AS max_goal_mouth_y,
          AVG("dec_goal_mouth_y") AS avg_goal_mouth_y,
          MIN("dec_goal_mouth_z") AS min_goal_mouth_z,
          MAX("dec_goal_mouth_z") AS max_goal_mouth_z,
          AVG("dec_goal_mouth_z") AS avg_goal_mouth_z,
          MIN("dec_blocked_x") AS min_blocked_x,
          MAX("dec_blocked_x") AS max_blocked_x,
          AVG("dec_blocked_x") AS avg_blocked_x,
          MIN("dec_blocked_y") AS min_blocked_y,
          MAX("dec_blocked_y") AS max_blocked_y,
          AVG("dec_blocked_y") AS avg_blocked_y
        FROM intermediate."int_whoscored_events"

