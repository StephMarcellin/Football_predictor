# ══════════════════════════════════════════════════════════════════════════════
# Suite Great Expectations — intermediate.int_fbref_shooting
# Rôle : SIGNAL & DISTRIBUTIONS
# Contrainte spatiotemporelle : aucune (FBref couvre toutes les comp_category).
# Test dérive volumétrique : exclut la saison 2025-2026 (scraping en cours).
# ══════════════════════════════════════════════════════════════════════════════

suite_name: intermediate.int_fbref_shooting
description: >
  Signal statistique du modèle intermediate int_fbref_shooting (volume de tirs
  et efficacité offensive rematchés sur match_id + team_id normalisés).
  Couvre toutes les compétitions (Big5, Cup, D2, Europe, Other) — pas de filtre
  saisonnier.

source:
  duckdb_path: db/football.duckdb
  query: |
    SELECT
      match_id, team_id, opponent_id, date, season,
      venue, result, result_1n2, comp_category, source,
      gf, ga,
      standard_gls, standard_sh, standard_sot, standard_sot_pct,
      standard_g_sh, standard_g_sot,
      standard_pk, standard_pkatt
    FROM intermediate.int_fbref_shooting

expectations:

  # ────────────────────────────────────────────────────────────────────────────
  # 1. VOLUMÉTRIE — la table doit contenir entre 40k et 100k lignes
  # ────────────────────────────────────────────────────────────────────────────
  - type: expect_table_row_count_to_be_between
    kwargs: { min_value: 40000, max_value: 100000 }
    severity: error
    meta: { description: "Empirique = 55 709 lignes. Fenêtre de tolérance large." }

  # ────────────────────────────────────────────────────────────────────────────
  # 2. COMPLÉTION — NULL rate contrôlé par famille
  # ────────────────────────────────────────────────────────────────────────────
  # Colonnes structurelles : 0 % NULL toléré
  - type: expect_column_values_to_not_be_null
    for_each_column:
      - team_id
      - date
      - season
      - venue
      - comp_category
      - source
      - gf
      - ga
      - standard_gls
      - standard_sh
      - standard_sot
      - standard_pk
      - standard_pkatt
    kwargs: { mostly: 1.0 }
    severity: error

  # match_id : 49 NULL empiriques (0.09 %) — cf. A-005 (bug cascade seed team_mapping)
  - type: expect_column_values_to_not_be_null
    kwargs: { column: match_id, mostly: 0.995 }
    severity: warn
    meta: { description: "Empirique = 0.09 % NULL. Marge de +5 pts appliquée." }

  # opponent_id : NULL toléré ~3.6 % empirique + marge 5 pts → 91.4 % non-null min
  - type: expect_column_values_to_not_be_null
    kwargs: { column: opponent_id, mostly: 0.914 }
    severity: error
    meta: { description: "Empirique = 3.59 % NULL (2 001 lignes). Marge de +5 pts appliquée." }

  # standard_sot_pct : NULL légitime quand standard_sh=0 (~3.5 %) → warn
  - type: expect_column_values_to_not_be_null
    kwargs: { column: standard_sot_pct, mostly: 0.90 }
    severity: warn
    meta: { description: "Empirique = 3.49 % NULL (standard_sh=0). Marge de +5 pts." }

  # standard_g_sh : idem
  - type: expect_column_values_to_not_be_null
    kwargs: { column: standard_g_sh, mostly: 0.90 }
    severity: warn
    meta: { description: "Empirique = 3.48 % NULL (standard_sh=0). Marge de +5 pts." }

  # standard_g_sot : NULL légitime quand standard_sot=0 (~5.7 %) → warn
  - type: expect_column_values_to_not_be_null
    kwargs: { column: standard_g_sot, mostly: 0.88 }
    severity: warn
    meta: { description: "Empirique = 5.68 % NULL (standard_sot=0). Marge de +5 pts." }

  # ────────────────────────────────────────────────────────────────────────────
  # 3. BORNES DE VALEURS
  # ────────────────────────────────────────────────────────────────────────────
  # standard_sot_pct est un pourcentage
  - type: expect_column_values_to_be_between
    kwargs: { column: standard_sot_pct, min_value: 0, max_value: 100, mostly: 1.0 }
    severity: error

  # standard_g_sh borné [0, 1] (0 buts par tir = 0, 1 = 100 % conversion)
  - type: expect_column_values_to_be_between
    kwargs: { column: standard_g_sh, min_value: 0, max_value: 1, mostly: 1.0 }
    severity: error

  # standard_g_sot borné [0, 2] (peut dépasser 1 si CSC comptés)
  - type: expect_column_values_to_be_between
    kwargs: { column: standard_g_sot, min_value: 0, max_value: 2, mostly: 1.0 }
    severity: error

  # Métriques comptables : bornes larges (max = record historique + marge)
  - type: expect_column_values_to_be_between
    for_each_column: [gf, ga, standard_gls]
    kwargs: { min_value: 0, max_value: 20, mostly: 1.0 }
    severity: error
    meta: { description: "Max empirique gf=14. Marge x1.5." }

  - type: expect_column_values_to_be_between
    kwargs: { column: standard_sh, min_value: 0, max_value: 60, mostly: 1.0 }
    severity: error
    meta: { description: "Max empirique 47. Marge x1.3." }

  - type: expect_column_values_to_be_between
    kwargs: { column: standard_sot, min_value: 0, max_value: 35, mostly: 1.0 }
    severity: error
    meta: { description: "Max empirique 25. Marge x1.4." }

  - type: expect_column_values_to_be_between
    for_each_column: [standard_pk, standard_pkatt]
    kwargs: { min_value: 0, max_value: 5, mostly: 1.0 }
    severity: error

  # ────────────────────────────────────────────────────────────────────────────
  # 4. BORNES STATISTIQUES — moyennes cohérentes avec la nature de la métrique
  # ────────────────────────────────────────────────────────────────────────────
  - type: expect_column_mean_to_be_between
    kwargs: { column: standard_sh, min_value: 9.0, max_value: 16.0 }
    severity: error
    meta: { description: "Empirique = 12.44" }

  - type: expect_column_mean_to_be_between
    kwargs: { column: standard_sot, min_value: 3.0, max_value: 6.0 }
    severity: error
    meta: { description: "Empirique = 4.33" }

  - type: expect_column_mean_to_be_between
    kwargs: { column: standard_sot_pct, min_value: 25.0, max_value: 45.0 }
    severity: error
    meta: { description: "Empirique = 35.25 %" }

  - type: expect_column_mean_to_be_between
    for_each_column: [gf, ga, standard_gls]
    kwargs: { min_value: 1.0, max_value: 2.0 }
    severity: error
    meta: { description: "Empirique gf=1.45 ga=1.34 gls=1.41" }

  - type: expect_column_mean_to_be_between
    kwargs: { column: standard_g_sh, min_value: 0.07, max_value: 0.15 }
    severity: error
    meta: { description: "Empirique = 0.105" }

  - type: expect_column_mean_to_be_between
    kwargs: { column: standard_g_sot, min_value: 0.20, max_value: 0.40 }
    severity: error
    meta: { description: "Empirique = 0.288" }

  - type: expect_column_mean_to_be_between
    kwargs: { column: standard_pkatt, min_value: 0.05, max_value: 0.30 }
    severity: warn
    meta: { description: "Empirique = 0.16" }

  # ────────────────────────────────────────────────────────────────────────────
  # 5. COHÉRENCE CROISÉE — contraintes physiques métier
  # Doublon volontaire avec dbt (charte v2) : dbt bloque la matérialisation,
  # GE rapporte à chaque run indépendamment.
  # ────────────────────────────────────────────────────────────────────────────
  # Contrainte physique dure : tirs cadrés ≤ tirs totaux
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "standard_sot <= standard_sh"
    severity: error
    meta: { description: "Un tir cadré est nécessairement un tir. 0 violation empirique." }

  # Contrainte physique dure : penaltys transformés ≤ penaltys tentés
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "standard_pk <= standard_pkatt"
    severity: error
    meta: { description: "0 violation empirique." }

  # Contrainte physique : buts sur tir ≤ tirs cadrés — WARN (1 490 violations, cf. A-011)
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "standard_gls <= standard_sot"
    severity: warn
    meta:
      description: "1 490 violations empiriques — bug scraping FBref suspecté."
      fires_on_current_bug: true

  # Contrainte cohérence : buts sur tir ≤ buts totaux — WARN (5 violations, cf. A-011)
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "standard_gls <= gf"
    severity: warn
    meta:
      description: "5 violations empiriques — anomalie mineure."
      fires_on_current_bug: true

  # ────────────────────────────────────────────────────────────────────────────
  # 6. DÉRIVE VOLUMÉTRIQUE INTER-SAISONS
  # Exclut 2025-2026 (scraping en cours). Compare 2024-2025 aux 2 précédentes.
  # ────────────────────────────────────────────────────────────────────────────
  - type: expect_partition_volume_stability
    kwargs:
      partition_col: season
      max_deviation_warn: 0.20
      max_deviation_error: 0.40
      min_seasons_history: 2
      exclude_partitions: ['2025-2026']
    severity: warn
    meta: { description: "La saison en cours est écartée du calcul." }
