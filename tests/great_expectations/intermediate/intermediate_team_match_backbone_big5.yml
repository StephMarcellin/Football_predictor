# ══════════════════════════════════════════════════════════════════════════════
# Suite Great Expectations — intermediate.intermediate_team_match_backbone (couche Big5-only)
# Rôle : SIGNAL & DISTRIBUTIONS des colonnes Understat / WhoScored saison
# Périmètre : WHERE comp_category = 'Big5'
#
# Charte v2 : ces colonnes sont 100 % NULL hors Big5 par design — testées ici.
# Note A-007 : ppda max 193 (empirique légitime).
# Les colonnes WhoScored saison (ratings, *_pg) ont été retirées de intermediate_team_match_backbone
# (grain saison ≠ grain match) : plus testées ici.
# ══════════════════════════════════════════════════════════════════════════════

suite_name: intermediate.intermediate_team_match_backbone_big5
description: >
  Signal statistique des colonnes Big5-only de intermediate_team_match_backbone :
  Understat (np_xg, ppda). Les cotes ne sont plus dans le backbone (cf. gold.gold_odds_pinnacle).

source:
  duckdb_path: db/football.duckdb
  query: |
    SELECT
      str_match_id, str_team_id, str_season, str_comp_category,
      dec_np_xg, dec_np_xg_conceded, dec_ppda, dec_ppda_allowed, dec_np_xg_diff_match,
      CASE
        WHEN dec_np_xg IS NULL OR dec_np_xg_conceded IS NULL THEN 1
        WHEN ABS(dec_np_xg_diff_match - (dec_np_xg - dec_np_xg_conceded)) < 0.001 THEN 1
        ELSE 0
      END AS np_xg_diff_ok
    FROM intermediate.intermediate_team_match_backbone
    WHERE str_comp_category = 'Big5'

expectations:

  # ────────────────────────────────────────────────────────────────────────────
  # 1. VOLUMÉTRIE (Big5 uniquement)
  # ────────────────────────────────────────────────────────────────────────────
  - type: expect_table_row_count_to_be_between
    kwargs: { min_value: 20000, max_value: 50000 }
    # severity: error
    severity: warn
    meta: { description: "Empirique = 32 218 lignes Big5." }

  # ────────────────────────────────────────────────────────────────────────────
  # 2. COMPLÉTION — Understat ~2 % NULL en Big5, WhoScored ~55 %
  # ────────────────────────────────────────────────────────────────────────────
  - type: expect_column_values_to_not_be_null
    for_each_column: [dec_np_xg, dec_np_xg_conceded, dec_ppda, dec_ppda_allowed, dec_np_xg_diff_match]
    kwargs: { mostly: 0.95 }
    severity: warn
    meta: { description: "Empirique 2.0-2.1 % NULL en Big5 (matches Cup/Europe qui débordent)." }

  # ────────────────────────────────────────────────────────────────────────────
  # 3. BORNES DE VALEURS
  # ────────────────────────────────────────────────────────────────────────────
  # Understat xG
  - type: expect_column_values_to_be_between
    for_each_column: [dec_np_xg, dec_np_xg_conceded]
    kwargs: { min_value: 0, max_value: 10, mostly: 1.0 }
    # severity: error
    severity: warn
    meta: { description: "Empirique 0-7.11." }

  - type: expect_column_values_to_be_between
    kwargs: { column: dec_np_xg_diff_match, min_value: -10, max_value: 10, mostly: 1.0 }
    # severity: error
    severity: warn
    meta: { description: "Empirique -6.27 à +6.27." }

  # PPDA — attention A-007 max 193
  - type: expect_column_values_to_be_between
    for_each_column: [dec_ppda, dec_ppda_allowed]
    kwargs: { min_value: 0, max_value: 250, mostly: 1.0 }
    severity: warn
    meta: { description: "Empirique 2-193 (A-007 : max extrême légitime)." }

  # ────────────────────────────────────────────────────────────────────────────
  # 4. BORNES STATISTIQUES
  # ────────────────────────────────────────────────────────────────────────────
  - type: expect_column_mean_to_be_between
    for_each_column: [dec_np_xg, dec_np_xg_conceded]
    kwargs: { min_value: 0.8, max_value: 2.0 }
    # severity: error
    severity: warn
    meta: { description: "Empirique 1.308." }

  - type: expect_column_mean_to_be_between
    kwargs: { column: dec_np_xg_diff_match, min_value: -0.1, max_value: 0.1 }
    severity: warn
    meta: { description: "Structural : diff moyen ≈ 0 (deux équipes miroirs)." }

  - type: expect_column_mean_to_be_between
    for_each_column: [dec_ppda, dec_ppda_allowed]
    kwargs: { min_value: 8, max_value: 18 }
    severity: warn
    meta: { description: "Empirique 12.46." }

  # ────────────────────────────────────────────────────────────────────────────
  # 5. COHÉRENCES CROISÉES — contraintes physiques (miroir dbt, charte v2)
  # ────────────────────────────────────────────────────────────────────────────
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "np_xg_diff_ok == 1"
    # severity: error
    severity: warn
    meta: { description: "np_xg_diff_match = np_xg - np_xg_conceded (0 violation empirique)." }

  # ────────────────────────────────────────────────────────────────────────────
  # 6. DÉRIVE VOLUMÉTRIQUE INTER-SAISONS (Big5 uniquement)
  # ────────────────────────────────────────────────────────────────────────────
  - type: expect_partition_volume_stability
    kwargs:
      partition_col: str_season
      max_deviation_warn: 0.20
      max_deviation_error: 0.40
      min_seasons_history: 2
      exclude_partitions: ['2025-2026']
    severity: warn
