# ═════════════════════════════════════════════════════════════════════
# Suite Great Expectations — intermediate.player_passes_raw (PUSH-DOWN 2026-09-09)
# Volumétrie : 1,930,574 lignes, 20 colonnes
# Stratégie big data : agrégats DuckDB → 1 ligne en pandas.
# ═════════════════════════════════════════════════════════════════════

suite_name: intermediate.player_passes_raw
description: >
  Push-down agrégats. Volumétrie de référence : 1,930,574 lignes.

source:
  duckdb_path: db/football.duckdb
  query: |
    SELECT
          COUNT(*) AS n_rows,
          COUNT(*) FILTER (WHERE "str_match_id" IS NULL) AS null_match_id,
          COUNT(*) FILTER (WHERE "str_chain_id" IS NULL) AS null_chain_id,
          COUNT(*) FILTER (WHERE "str_chain_trigger" IS NULL) AS null_chain_trigger,
          COUNT(*) FILTER (WHERE "str_team_id" IS NULL) AS null_team_id,
          COUNT(*) FILTER (WHERE "str_passer_id" IS NULL) AS null_passer_id,
          COUNT(*) FILTER (WHERE "str_receiver_id" IS NULL) AS null_receiver_id,
          COUNT(*) FILTER (WHERE "int_row_num" IS NULL) AS null_row_num,
          COUNT(*) FILTER (WHERE "int_expanded_minute" IS NULL) AS null_expanded_minute,
          COUNT(*) FILTER (WHERE "int_second" IS NULL) AS null_second,
          COUNT(*) FILTER (WHERE "dec_x" IS NULL) AS null_x,
          COUNT(*) FILTER (WHERE "dec_y" IS NULL) AS null_y,
          COUNT(*) FILTER (WHERE "dec_end_x" IS NULL) AS null_end_x,
          COUNT(*) FILTER (WHERE "dec_end_y" IS NULL) AS null_end_y,
          COUNT(*) FILTER (WHERE "int_is_key_pass" IS NULL) AS null_is_key_pass,
          COUNT(*) FILTER (WHERE "int_is_shot_assist" IS NULL) AS null_is_shot_assist,
          COUNT(*) FILTER (WHERE "str_season" IS NULL) AS null_season,
          COUNT(*) FILTER (WHERE "str_league_source" IS NULL) AS null_league_source,
          COUNT(*) FILTER (WHERE "bool_is_progressive" IS NULL) AS null_is_progressive,
          COUNT(*) FILTER (WHERE "bool_is_creative" IS NULL) AS null_is_creative,
          COUNT(*) FILTER (WHERE "bool_is_buildup" IS NULL) AS null_is_buildup,
          MIN("int_row_num") AS min_row_num,
          MAX("int_row_num") AS max_row_num,
          AVG("int_row_num") AS avg_row_num,
          MIN("int_expanded_minute") AS min_expanded_minute,
          MAX("int_expanded_minute") AS max_expanded_minute,
          AVG("int_expanded_minute") AS avg_expanded_minute,
          MIN("int_second") AS min_second,
          MAX("int_second") AS max_second,
          AVG("int_second") AS avg_second,
          MIN("dec_x") AS min_x,
          MAX("dec_x") AS max_x,
          AVG("dec_x") AS avg_x,
          MIN("dec_y") AS min_y,
          MAX("dec_y") AS max_y,
          AVG("dec_y") AS avg_y,
          MIN("dec_end_x") AS min_end_x,
          MAX("dec_end_x") AS max_end_x,
          AVG("dec_end_x") AS avg_end_x,
          MIN("dec_end_y") AS min_end_y,
          MAX("dec_end_y") AS max_end_y,
          AVG("dec_end_y") AS avg_end_y,
          MIN("int_is_key_pass") AS min_is_key_pass,
          MAX("int_is_key_pass") AS max_is_key_pass,
          AVG("int_is_key_pass") AS avg_is_key_pass,
          MIN("int_is_shot_assist") AS min_is_shot_assist,
          MAX("int_is_shot_assist") AS max_is_shot_assist,
          AVG("int_is_shot_assist") AS avg_is_shot_assist
        FROM intermediate."player_passes_raw"

expectations:

  # ── VOLUMÉTRIE (1 ligne agrégée = 1 seule row en output) ──
  - type: expect_table_row_count_to_be_between
    kwargs: { min_value: 1, max_value: 1 }
    # severity: error
    severity: warn
    meta: { description: "Agrégat push-down doit renvoyer exactement 1 ligne." }

  - type: expect_row_condition_to_hold
    kwargs:
      condition: "n_rows >= 772229 and n_rows <= 3861148"
    # severity: error
    severity: warn
    meta: { description: "Row count empirique = 1,930,574." }

  # ── COMPLÉTION PAR COLONNE (push-down NULL counts) ──
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_match_id / n_rows <= 0.001"
    severity: warn
    meta: { description: "match_id empirique 0.00% NULL." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_chain_id / n_rows <= 0.001"
