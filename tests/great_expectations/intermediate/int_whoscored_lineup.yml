# ═════════════════════════════════════════════════════════════════════
# Suite Great Expectations — intermediate.int_whoscored_lineup (PUSH-DOWN 2026-09-09)
# Volumétrie : 1,759,851 lignes, 12 colonnes
# Stratégie big data : agrégats DuckDB → 1 ligne en pandas.
# ═════════════════════════════════════════════════════════════════════

suite_name: intermediate.int_whoscored_lineup
description: >
  Push-down agrégats. Volumétrie de référence : 1,759,851 lignes.

source:
  duckdb_path: db/football.duckdb
  query: |
    SELECT
          COUNT(*) AS n_rows,
          COUNT(*) FILTER (WHERE "match_id" IS NULL) AS null_match_id,
          COUNT(*) FILTER (WHERE "team_id" IS NULL) AS null_team_id,
          COUNT(*) FILTER (WHERE "formation_seq" IS NULL) AS null_formation_seq,
          COUNT(*) FILTER (WHERE "formation_id" IS NULL) AS null_formation_id,
          COUNT(*) FILTER (WHERE "period" IS NULL) AS null_period,
          COUNT(*) FILTER (WHERE "start_minute" IS NULL) AS null_start_minute,
          COUNT(*) FILTER (WHERE "end_minute" IS NULL) AS null_end_minute,
          COUNT(*) FILTER (WHERE "player_id" IS NULL) AS null_player_id,
          COUNT(*) FILTER (WHERE "slot" IS NULL) AS null_slot,
          COUNT(*) FILTER (WHERE "grid_vertical" IS NULL) AS null_grid_vertical,
          COUNT(*) FILTER (WHERE "grid_horizontal" IS NULL) AS null_grid_horizontal,
          COUNT(*) FILTER (WHERE "is_captain" IS NULL) AS null_is_captain,
          MIN("team_id") AS min_team_id,
          MAX("team_id") AS max_team_id,
          AVG("team_id") AS avg_team_id,
          MIN("formation_seq") AS min_formation_seq,
          MAX("formation_seq") AS max_formation_seq,
          AVG("formation_seq") AS avg_formation_seq,
          MIN("formation_id") AS min_formation_id,
          MAX("formation_id") AS max_formation_id,
          AVG("formation_id") AS avg_formation_id,
          MIN("period") AS min_period,
          MAX("period") AS max_period,
          AVG("period") AS avg_period,
          MIN("start_minute") AS min_start_minute,
          MAX("start_minute") AS max_start_minute,
          AVG("start_minute") AS avg_start_minute,
          MIN("end_minute") AS min_end_minute,
          MAX("end_minute") AS max_end_minute,
          AVG("end_minute") AS avg_end_minute,
          MIN("player_id") AS min_player_id,
          MAX("player_id") AS max_player_id,
          AVG("player_id") AS avg_player_id,
          MIN("slot") AS min_slot,
          MAX("slot") AS max_slot,
          AVG("slot") AS avg_slot,
          MIN("grid_vertical") AS min_grid_vertical,
          MAX("grid_vertical") AS max_grid_vertical,
          AVG("grid_vertical") AS avg_grid_vertical,
          MIN("grid_horizontal") AS min_grid_horizontal,
          MAX("grid_horizontal") AS max_grid_horizontal,
          AVG("grid_horizontal") AS avg_grid_horizontal
        FROM intermediate."int_whoscored_lineup"

expectations:

  # ── VOLUMÉTRIE (1 ligne agrégée = 1 seule row en output) ──
  - type: expect_table_row_count_to_be_between
    kwargs: { min_value: 1, max_value: 1 }
    severity: error
    meta: { description: "Agrégat push-down doit renvoyer exactement 1 ligne." }

  - type: expect_row_condition_to_hold
    kwargs:
      condition: "n_rows >= 703940 and n_rows <= 3519702"
    severity: error
    meta: { description: "Row count empirique = 1,759,851." }

  # ── COMPLÉTION PAR COLONNE (push-down NULL counts) ──
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_match_id / n_rows <= 0.0675"
    severity: warn
    meta: { description: "match_id empirique 1.75% NULL." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_team_id / n_rows <= 0.0577"
    severity: warn
    meta: { description: "team_id empirique 0.77% NULL." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_formation_seq / n_rows <= 0.001"
    severity: warn
    meta: { description: "formation_seq empirique 0.00% NULL." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_formation_id / n_rows <= 0.001"
    severity: warn
    meta: { description: "formation_id empirique 0.00% NULL." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_period / n_rows <= 0.001"
    severity: warn
    meta: { description: "period empirique 0.00% NULL." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_start_minute / n_rows <= 0.001"
    severity: warn
    meta: { description: "start_minute empirique 0.00% NULL." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_end_minute / n_rows <= 0.001"
    severity: warn
    meta: { description: "end_minute empirique 0.00% NULL." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_player_id / n_rows <= 0.001"
    severity: warn
    meta: { description: "player_id empirique 0.00% NULL." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_slot / n_rows <= 0.001"
    severity: warn
    meta: { description: "slot empirique 0.00% NULL." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_grid_vertical / n_rows <= 0.001"
    severity: warn
    meta: { description: "grid_vertical empirique 0.00% NULL." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_grid_horizontal / n_rows <= 0.001"
    severity: warn
    meta: { description: "grid_horizontal empirique 0.00% NULL." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "null_is_captain / n_rows <= 0.0501"
    severity: warn
    meta: { description: "is_captain empirique 0.01% NULL." }

  # ── BORNES NUMÉRIQUES (push-down MIN/MAX) ──
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "min_team_id >= 202606099958.5000 and max_team_id <= 202606100468.5000"
    severity: warn
    meta: { description: "team_id empirique [202606100001.0, 202606100426.0]." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "min_formation_seq >= 0.0000 and max_formation_seq <= 11.0000"
    severity: warn
    meta: { description: "formation_seq empirique [0.0, 10.0]." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "min_formation_id >= -0.3000 and max_formation_id <= 27.3000"
    severity: warn
    meta: { description: "formation_id empirique [2.0, 25.0]." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "min_period >= -0.5000 and max_period <= 17.5000"
    severity: warn
    meta: { description: "period empirique [1.0, 16.0]." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "min_start_minute >= 0.0000 and max_start_minute <= 123.2000"
    severity: warn
    meta: { description: "start_minute empirique [0.0, 112.0]." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "min_end_minute >= 0.0000 and max_end_minute <= 129.8000"
    severity: warn
    meta: { description: "end_minute empirique [0.0, 118.0]." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "min_player_id >= 0.0000 and max_player_id <= 617974.5000"
    severity: warn
    meta: { description: "player_id empirique [0.0, 561795.0]." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "min_slot >= 0.0000 and max_slot <= 12.0000"
    severity: warn
    meta: { description: "slot empirique [1.0, 11.0]." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "min_grid_vertical >= 0.0000 and max_grid_vertical <= 9.9000"
    severity: warn
    meta: { description: "grid_vertical empirique [0.0, 9.0]." }
  - type: expect_row_condition_to_hold
    kwargs:
      condition: "min_grid_horizontal >= 0.2000 and max_grid_horizontal <= 9.8000"
    severity: warn
    meta: { description: "grid_horizontal empirique [1.0, 9.0]." }
